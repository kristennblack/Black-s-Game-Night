<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W43 Portrait Anchor Runtime QA</title><link rel="stylesheet" href="/styles.css?v=W45-HEADWEAR-SCALE-RECOVERY-63"><link rel="stylesheet" href="/phase-w-platform.css?v=W45-HEADWEAR-SCALE-RECOVERY-63"><style>
html,body{margin:0;background:#0e0a07;color:#f5e1b7;font-family:system-ui,sans-serif}.wrap{padding:16px;max-width:1500px;margin:auto}.top{position:sticky;top:0;z-index:30;background:#0e0a07ee;border-bottom:1px solid #7c5a32;padding:10px 0}.top h1{margin:0;font-size:28px}.top p{margin:5px 0;color:#b9c6b3}.grid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;margin-top:14px}.card{border:1px solid #71502d;background:#17110d;border-radius:10px;overflow:hidden}.stage{position:relative;aspect-ratio:1;overflow:hidden;background:#241b15}.stage>img.avatar-base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.card .meta{padding:8px;font-size:12px}.card .meta b{display:block;color:#f1cf8a;font-size:14px}.micro{margin-top:22px;border-top:1px solid #624726;padding-top:14px}.micro-grid{display:flex;gap:16px;flex-wrap:wrap}.micro-card{display:grid;justify-items:center;gap:5px}.micro-stage{position:relative;width:76px;height:76px;border-radius:50%;overflow:hidden;border:2px solid #d1a254;background:#222}.micro-stage>img.avatar-base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.micro-card span{font-size:11px;color:#d8c29c}.avatar-cosmetic{position:absolute!important;left:var(--cx)!important;top:var(--cy)!important;width:var(--cw)!important;height:var(--ch,auto)!important;max-width:none!important;object-fit:contain!important;border:0!important;border-radius:0!important;box-shadow:none!important;animation:none!important;transform:translate(-50%,-50%) rotate(var(--cr)) skewX(var(--cskew,0deg)) scale(var(--csx,1),var(--csy,1))!important;transform-origin:50% 50%!important;z-index:9!important}.pill{display:inline-block;padding:3px 6px;border:1px solid #496f50;border-radius:99px;background:#193121;color:#c8f2c9;font-size:10px;margin-top:3px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><header class="top"><h1>W43 · ACTUAL RUNTIME PORTRAIT ANCHOR RECOVERY</h1><p>Same portrait source as shop/card games · exact style-key anchors · real GLB-derived overlays · shared CSS loaded</p></header><main id="grid" class="grid"></main><section class="micro"><h2>Card-size proof</h2><div id="micro" class="micro-grid"></div></section></div><script type="module">
import {COSMETIC_BY_ID,cosmeticOverlayHTML} from './avatar-cosmetics.mjs?v=W45-HEADWEAR-SCALE-RECOVERY-63';
import {portraitStyleAsset,portraitGlassesFit} from './portrait-accessory-anchors.mjs?v=W45-HEADWEAR-SCALE-RECOVERY-63';
const people=[['john','John',0],['kristen','Kristen',0],['holly','Holly',0],['vanessa','Vanessa',0],['elizabeth','Elizabeth',0],['logan','Logan',0]];
const ids=['round-glasses','classic-glasses','heart-glasses','safety-glasses'];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
for(const [a,name,v] of people){for(const id of ids){const item=COSMETIC_BY_ID[id];const f=portraitGlassesFit(a,v,item);const eq={glasses:id};document.querySelector('#grid').insertAdjacentHTML('beforeend',`<article class="card"><div class="stage avatar-frame"><img class="avatar-base" src="${portraitStyleAsset(a,v)}">${cosmeticOverlayHTML(eq,a,v)}</div><div class="meta"><b>${name} · ${esc(item.name)}</b>${f.portraitKey} · ${f.anchorMode}<br>w ${f.w.toFixed(1)}% · rot ${f.r.toFixed(1)}°<br><span class="pill">${f.exactCalibration?'EXACT STYLE ANCHORS':'FALLBACK'}</span></div></article>`);}}
for(const [a,name,v] of people){const id='classic-glasses';document.querySelector('#micro').insertAdjacentHTML('beforeend',`<div class="micro-card"><div class="micro-stage avatar-frame"><img class="avatar-base" src="${portraitStyleAsset(a,v)}">${cosmeticOverlayHTML({glasses:id},a,v)}</div><span>${name}</span></div>`)}
</script></body></html>
