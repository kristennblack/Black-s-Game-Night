<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Papa's Paddle Battle - Black Family Game Night</title><style>
:root{color-scheme:dark;--ink:#fff6e6;--muted:#baa98f;--gold:#e8b95c;--panel:#1b1510;--wood:#2a1b12;--accent:#d4934c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#46301f,#100c09 62%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,600px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.07em;line-height:1.05}.brand small{display:block;font-size:10px;color:var(--gold);letter-spacing:.18em;margin-bottom:3px}.stats{font-size:11px;color:var(--muted);text-align:right}.stats b{color:var(--gold);font-size:18px}.foot{display:flex;justify-content:space-between;align-items:center;gap:9px;margin:7px 4px 0;font-size:11px;color:var(--muted);flex-wrap:wrap}a{color:var(--gold);text-decoration:none}.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-15px);opacity:0;background:#f4d793;color:#20130b;padding:10px 14px;border-radius:999px;font-weight:900;font-size:12px;pointer-events:none;transition:.2s;z-index:4;box-shadow:0 8px 28px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}.stage{position:relative}button{font:inherit}
canvas{display:block;width:100%;aspect-ratio:3/4;background:#1b120d;border:2px solid #7c5534;border-radius:22px;box-shadow:0 18px 58px #0009;touch-action:none}</style><link rel="stylesheet" href="/phase-w-platform.css?v=31"></head><body><div class="wrap"><div class="head"><div class="brand"><small>PAPA</small>PAPA'S PADDLE BATTLE</div><div class="stats">YOU <b id="you">0</b> / PAPA <b id="bot">0</b></div></div><div class="stage"><div class="toast" id="toast"></div><canvas id="game" width="720" height="960" aria-label="Papa paddle battle game"></canvas></div><div class="foot"><span>Mouse / touch / arrows. First to 7.</span><a href="/">Back to Lodge</a></div></div><script>
const BFGN_PROGRESS_KEY='bfgn_arcade_progress_v1';
const BFGN_ACH_KEY='bfgn_arcade_achievements_v1';
function bfRead(k,fallback){try{return JSON.parse(localStorage.getItem(k)||'')||fallback}catch{return fallback}}
function bfWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function bfPlay(id){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.plays=(p.plays||0)+1;p.games=p.games||{};p.games[id]=(p.games[id]||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfWin(){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.wins=(p.wins||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfUnlock(id,label){const a=bfRead(BFGN_ACH_KEY,{});if(a[id])return false;a[id]={label,at:Date.now()};bfWrite(BFGN_ACH_KEY,a);const t=document.getElementById('toast');if(t){t.textContent='Achievement: '+label;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}return true}

(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),W=c.width,H=c.height,youEl=document.getElementById('you'),botEl=document.getElementById('bot');let state='ready',you=0,bot=0,last=performance.now(),left=false,right=false,msg='Defend the shop. Blame Nana if you lose.';const p={x:W/2,w:165,y:H-72,h:24},ai={x:W/2,w:154,y:72,h:24};let ball={x:W/2,y:H/2,vx:230,vy:315,r:14,speed:390};
function resetBall(dir=Math.random()<.5?-1:1){ball={x:W/2,y:H/2,vx:(Math.random()*.8-.4)*260,vy:dir*330,r:14,speed:390}}
function start(){if(state==='over'){you=0;bot=0;youEl.textContent='0';botEl.textContent='0'}state='play';msg='';bfPlay('papas-paddle-battle');resetBall(Math.random()<.5?-1:1)}
function pointerX(e){const r=c.getBoundingClientRect();p.x=Math.max(p.w/2,Math.min(W-p.w/2,(e.clientX-r.left)*W/r.width))}
c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType!=='mouse')pointerX(e)});c.addEventListener('pointerdown',e=>{c.setPointerCapture?.(e.pointerId);pointerX(e);if(state!=='play')start()});addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))left=true;if(['ArrowRight','d','D'].includes(e.key))right=true;if(e.code==='Space'&&state!=='play'){e.preventDefault();start()}});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))left=false;if(['ArrowRight','d','D'].includes(e.key))right=false});
function hit(pd,down){const top=pd.y-pd.h/2,bottom=pd.y+pd.h/2;if(down?ball.vy<=0:ball.vy>=0)return false;if(ball.x+ball.r<pd.x-pd.w/2||ball.x-ball.r>pd.x+pd.w/2||ball.y+ball.r<top||ball.y-ball.r>bottom)return false;const off=(ball.x-pd.x)/(pd.w/2),angle=off*1.08;ball.speed=Math.min(760,ball.speed+18);ball.vx=Math.sin(angle)*ball.speed;ball.vy=(down?-1:1)*Math.cos(angle)*ball.speed;ball.y=down?top-ball.r:bottom+ball.r;return true}
function point(who){if(who==='you'){you++;youEl.textContent=you}else{bot++;botEl.textContent=bot}if(you>=7||bot>=7){state='over';if(you>bot){msg='Papa Approved.';bfUnlock('papa-approved','Papa Approved');bfWin()}else msg='Papa is still got it. Nana probably distracted you.'}else{state='serve';setTimeout(()=>{if(state==='serve'){state='play';resetBall(who==='you'?1:-1)}},620)}}
function update(dt){if(state!=='play')return;if(left)p.x-=520*dt;if(right)p.x+=520*dt;p.x=Math.max(p.w/2,Math.min(W-p.w/2,p.x));const target=ball.x+ball.vx*.11,sp=360+Math.min(180,(you+bot)*18);ai.x+=Math.max(-sp*dt,Math.min(sp*dt,target-ai.x));ai.x=Math.max(ai.w/2,Math.min(W-ai.w/2,ai.x));let rem=dt;for(let i=0;i<6&&rem>0;i++){const st=Math.min(rem,.005);ball.x+=ball.vx*st;ball.y+=ball.vy*st;rem-=st;if(ball.x-ball.r<18&&ball.vx<0){ball.x=18+ball.r;ball.vx*=-1}if(ball.x+ball.r>W-18&&ball.vx>0){ball.x=W-18-ball.r;ball.vx*=-1}hit(p,true);hit(ai,false);if(ball.y<-42){point('you');break}if(ball.y>H+42){point('bot');break}}}
function chair(){g.fillStyle='#b59b48';g.beginPath();g.roundRect(56,370,80,105,22);g.fill();g.fillStyle='#8e7437';g.fillRect(68,450,10,55);g.fillRect(116,450,10,55);g.strokeStyle='#6e562c';g.lineWidth=6;g.strokeRect(56,370,80,105)}
function fireplace(){g.fillStyle='#4a2a1c';g.fillRect(W-154,352,102,132);g.fillStyle='#111';g.fillRect(W-134,396,62,68);g.fillStyle='#ff8e3f';g.beginPath();g.moveTo(W-104,450);g.quadraticCurveTo(W-130,420,W-103,406);g.quadraticCurveTo(W-75,430,W-104,450);g.fill()}
function draw(){const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#382116');bg.addColorStop(.5,'#160f0b');bg.addColorStop(1,'#3a2114');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let x=75;x<W;x+=95){g.strokeStyle='#7c553433';g.beginPath();g.moveTo(x,28);g.lineTo(x,H-28);g.stroke()}chair();fireplace();g.fillStyle='#8c6544';for(let i=0;i<5;i++)g.fillRect(180+i*75,132+(i%2)*18,42,8);g.strokeStyle='#8b5e39';g.lineWidth=10;g.strokeRect(18,18,W-36,H-36);g.setLineDash([14,18]);g.strokeStyle='#765337';g.lineWidth=3;g.beginPath();g.moveTo(30,H/2);g.lineTo(W-30,H/2);g.stroke();g.setLineDash([]);
function paddle(pd,player){const rg=g.createLinearGradient(pd.x-pd.w/2,0,pd.x+pd.w/2,0);rg.addColorStop(0,'#4a2c1b');rg.addColorStop(.5,player?'#d39a56':'#8e684a');rg.addColorStop(1,'#3a2418');g.fillStyle=rg;g.strokeStyle='#f0d29b';g.lineWidth=3;g.beginPath();g.roundRect(pd.x-pd.w/2,pd.y-pd.h/2,pd.w,pd.h,10);g.fill();g.stroke();g.fillStyle='#21140e';g.fillRect(pd.x-6,pd.y-pd.h/2-7,12,7)}paddle(ai,false);paddle(p,true);g.save();g.shadowColor='#ff8b3d';g.shadowBlur=28;g.fillStyle='#ffb34e';g.beginPath();g.arc(ball.x,ball.y,ball.r,0,Math.PI*2);g.fill();g.fillStyle='#fff3b0';g.beginPath();g.arc(ball.x-4,ball.y-4,4,0,Math.PI*2);g.fill();g.restore();if(state!=='play'&&state!=='serve'){g.fillStyle='#0d0806dc';g.fillRect(0,0,W,H);g.textAlign='center';g.fillStyle='#e8b95c';g.font='800 18px system-ui';g.fillText('PAPA',W/2,H*.34);g.fillStyle='#fff6df';g.font='950 50px system-ui';g.fillText(state==='over'?(you>bot?'PAPA APPROVED':'SHOP CLOSED'):"PAPA'S PADDLE BATTLE",W/2,H*.42);g.fillStyle='#e8b95c';g.font='700 21px system-ui';g.fillText(state==='over'?`${you} - ${bot}`:'Defend the shop. Blame Nana if you lose.',W/2,H*.49);g.fillStyle='#d0c1aa';g.font='17px system-ui';g.fillText(state==='over'?msg:'Tap / Space to serve',W/2,H*.55);if(state==='over')g.fillText('Tap to rematch',W/2,H*.60)}}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script><script type="module" src="/phase-w-platform.mjs?v=31"></script></body></html>
