<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Camp Pong</title><style>
:root{color-scheme:dark;--ink:#fff6df;--muted:#c8b89e;--gold:#e8b95c;--wood:#2a1b12;--wood2:#6b4328}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#4b2d1b,#140e0a 58%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,600px)}.head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.1em}.score{font-size:12px;color:var(--muted)}.score b{color:var(--gold);font-size:22px}canvas{display:block;width:100%;aspect-ratio:3/4;background:#1b120d;border:2px solid #7c5534;border-radius:22px;box-shadow:0 18px 58px #0009;touch-action:none}.foot{display:flex;justify-content:space-between;gap:12px;margin:7px 5px 0;font-size:11px;color:var(--muted)}a{color:var(--gold);text-decoration:none}</style></head><body><div class="wrap"><div class="head"><div class="brand">CAMP PONG</div><div class="score">YOU <b id="you">0</b> · PAPA BOT <b id="bot">0</b></div></div><canvas id="game" width="720" height="960" aria-label="Camp Pong paddle game"></canvas><div class="foot"><span>Move: mouse / touch / arrows · First to 7</span><a href="/">Back to Lodge</a></div></div><script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),W=c.width,H=c.height,youEl=document.getElementById('you'),botEl=document.getElementById('bot');let state='ready',you=0,bot=0,last=performance.now(),left=false,right=false;const p={x:W/2,w:160,y:H-70,h:22},ai={x:W/2,w:150,y:70,h:22};let ball={x:W/2,y:H/2,vx:250,vy:300,r:14,speed:390};function resetBall(dir=Math.random()<.5?-1:1){ball={x:W/2,y:H/2,vx:(Math.random()*.8-.4)*260,vy:dir*330,r:14,speed:390}}function start(){if(state==='over'){you=bot=0;youEl.textContent=botEl.textContent='0'}state='play';resetBall(Math.random()<.5?-1:1)}function pointerX(e){const r=c.getBoundingClientRect();p.x=Math.max(p.w/2,Math.min(W-p.w/2,(e.clientX-r.left)*W/r.width))}c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType!=='mouse')pointerX(e)});c.addEventListener('pointerdown',e=>{c.setPointerCapture?.(e.pointerId);pointerX(e);if(state!=='play')start()});addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))left=true;if(['ArrowRight','d','D'].includes(e.key))right=true;if(e.code==='Space'&&state!=='play'){e.preventDefault();start()}});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))left=false;if(['ArrowRight','d','D'].includes(e.key))right=false});function paddleHit(pd,goingDown){const top=pd.y-pd.h/2,bottom=pd.y+pd.h/2;if(goingDown?ball.vy<=0:ball.vy>=0)return false;if(ball.x+ball.r<pd.x-pd.w/2||ball.x-ball.r>pd.x+pd.w/2||ball.y+ball.r<top||ball.y-ball.r>bottom)return false;const offset=(ball.x-pd.x)/(pd.w/2),angle=offset*1.05;ball.speed=Math.min(760,ball.speed+18);const dir=goingDown?-1:1;ball.vx=Math.sin(angle)*ball.speed;ball.vy=dir*Math.cos(angle)*ball.speed;ball.y=goingDown?top-ball.r:bottom+ball.r;return true}function point(who){if(who==='you'){you++;youEl.textContent=you}else{bot++;botEl.textContent=bot}if(you>=7||bot>=7){state='over'}else{state='serve';setTimeout(()=>{if(state==='serve'){state='play';resetBall(who==='you'?1:-1)}},650)}}function update(dt){if(state!=='play')return;if(left)p.x-=520*dt;if(right)p.x+=520*dt;p.x=Math.max(p.w/2,Math.min(W-p.w/2,p.x));const target=ball.x+ball.vx*.11,aiSpeed=360+Math.min(180,(you+bot)*18);ai.x+=Math.max(-aiSpeed*dt,Math.min(aiSpeed*dt,target-ai.x));ai.x=Math.max(ai.w/2,Math.min(W-ai.w/2,ai.x));let remaining=dt;for(let i=0;i<5&&remaining>0;i++){const step=Math.min(remaining,.006);ball.x+=ball.vx*step;ball.y+=ball.vy*step;remaining-=step;if(ball.x-ball.r<18&&ball.vx<0){ball.x=18+ball.r;ball.vx*=-1}if(ball.x+ball.r>W-18&&ball.vx>0){ball.x=W-18-ball.r;ball.vx*=-1}paddleHit(p,true);paddleHit(ai,false);if(ball.y<-40){point('you');break}if(ball.y>H+40){point('bot');break}}}function draw(){const grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#2f1c12');grad.addColorStop(.5,'#160f0b');grad.addColorStop(1,'#3a2114');g.fillStyle=grad;g.fillRect(0,0,W,H);g.strokeStyle='#8b5e39';g.lineWidth=10;g.strokeRect(18,18,W-36,H-36);g.setLineDash([14,18]);g.strokeStyle='#765337';g.lineWidth=3;g.beginPath();g.moveTo(30,H/2);g.lineTo(W-30,H/2);g.stroke();g.setLineDash([]);for(let i=0;i<9;i++){g.globalAlpha=.12;g.strokeStyle='#d49a55';g.beginPath();g.moveTo(25,i*110+20);g.bezierCurveTo(W*.3,i*110+5,W*.7,i*110+45,W-25,i*110+20);g.stroke()}g.globalAlpha=1;function paddle(pd,player){const rg=g.createLinearGradient(pd.x-pd.w/2,0,pd.x+pd.w/2,0);rg.addColorStop(0,'#4a2c1b');rg.addColorStop(.5,player?'#d39a56':'#8e684a');rg.addColorStop(1,'#3a2418');g.fillStyle=rg;g.strokeStyle='#f0d29b';g.lineWidth=3;g.beginPath();g.roundRect(pd.x-pd.w/2,pd.y-pd.h/2,pd.w,pd.h,10);g.fill();g.stroke()}paddle(ai,false);paddle(p,true);g.save();g.shadowColor='#ff8b3d';g.shadowBlur=28;g.fillStyle='#ffb34e';g.beginPath();g.arc(ball.x,ball.y,ball.r,0,Math.PI*2);g.fill();g.fillStyle='#fff3b0';g.beginPath();g.arc(ball.x-4,ball.y-4,4,0,Math.PI*2);g.fill();g.restore();if(state!=='play'){g.fillStyle='#0d0806cf';g.fillRect(0,0,W,H);g.textAlign='center';g.fillStyle='#fff6df';g.font='950 56px system-ui';g.fillText(state==='over'?(you>bot?'YOU WIN!':'PAPA WINS'):'CAMP PONG',W/2,H*.42);g.fillStyle='#e8b95c';g.font='700 22px system-ui';g.fillText(state==='over'?`${you} - ${bot}`:'First to 7 by the fire',W/2,H*.49);g.fillStyle='#d0c1aa';g.font='18px system-ui';g.fillText(state==='over'?'Tap / Space to rematch':'Tap / Space to serve',W/2,H*.56)}}function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script></body></html>
