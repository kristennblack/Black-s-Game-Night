<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Memory Mayhem</title><style>
:root{color-scheme:dark;--ink:#fff7e7;--muted:#baa991;--gold:#e8b95c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#3e2c23,#100d0a 62%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,560px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.09em}.stats{font-size:12px;color:var(--muted)}.stats b{color:var(--gold);font-size:18px}canvas{display:block;width:100%;aspect-ratio:1;background:#201712;border:1px solid #6a5038;border-radius:20px;box-shadow:0 18px 58px #0009;touch-action:manipulation}.foot{display:flex;justify-content:space-between;gap:10px;margin:7px 4px 0;font-size:11px;color:var(--muted)}button{min-height:42px;border:1px solid #6a5038;border-radius:11px;background:#2a2119;color:#f7ecda;font-weight:850;padding:0 13px}a{color:var(--gold);text-decoration:none}</style></head><body><div class="wrap"><div class="head"><div class="brand">MEMORY MAYHEM</div><div class="stats">MOVES <b id="moves">0</b> · TIME <b id="time">0</b> · BEST <b id="best">--</b></div></div><canvas id="game" width="600" height="600" aria-label="Family memory matching game"></canvas><div class="foot"><button id="new">RESHUFFLE</button><span>Match the family pairs</span><a href="/">Back to Lodge</a></div></div><script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),movesEl=document.getElementById('moves'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best');const people=[['JO','John','🔧'],['KR','Kristen','🍺'],['HO','Holly','🧸'],['VA','Vanessa','🤠'],['LI','Lizzy','🩰'],['LO','Logan','🎣'],['KE','Kelsi','🪨'],['GU','Gunner','🦴']];let cards=[],open=[],moves=0,matched=0,startAt=0,elapsed=0,state='ready',lock=false,best=Number(localStorage.getItem('memoryMayhemBest')||0);bestEl.textContent=best||'--';function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function reset(){cards=shuffle([...people,...people].map((p,i)=>({p,id:i,up:false,done:false})));open=[];moves=matched=0;elapsed=0;state='ready';lock=false;movesEl.textContent=0;timeEl.textContent=0}function pick(i){if(lock)return;if(state==='ready'){state='play';startAt=performance.now()}if(state!=='play')return;const card=cards[i];if(!card||card.up||card.done)return;card.up=true;open.push(i);if(open.length===2){moves++;movesEl.textContent=moves;const [a,b]=open.map(k=>cards[k]);if(a.p[0]===b.p[0]){a.done=b.done=true;matched+=2;open=[];if(matched===16){elapsed=Math.floor((performance.now()-startAt)/1000);state='win';if(!best||moves<best){best=moves;localStorage.setItem('memoryMayhemBest',best);bestEl.textContent=best}}}else{lock=true;setTimeout(()=>{a.up=b.up=false;open=[];lock=false},650)}}}c.addEventListener('pointerdown',e=>{if(state==='win'){reset();return}const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*600/r.height,cell=150,col=Math.floor(x/cell),row=Math.floor(y/cell);pick(row*4+col)});document.getElementById('new').addEventListener('click',reset);function draw(){if(state==='play'){elapsed=Math.floor((performance.now()-startAt)/1000);timeEl.textContent=elapsed}g.fillStyle='#211813';g.fillRect(0,0,600,600);for(let i=0;i<16;i++){const x=(i%4)*150,y=Math.floor(i/4)*150,z=cards[i];g.fillStyle=z.done?'#2f5940':z.up?'#7a5534':'#473425';g.beginPath();g.roundRect(x+8,y+8,134,134,16);g.fill();g.strokeStyle=z.up||z.done?'#e8b95c':'#7d6249';g.lineWidth=3;g.stroke();g.textAlign='center';if(z.up||z.done){g.fillStyle='#fff7e7';g.font='36px system-ui';g.fillText(z.p[2],x+75,y+62);g.font='950 24px system-ui';g.fillText(z.p[0],x+75,y+94);g.fillStyle='#f0dcb8';g.font='700 13px system-ui';g.fillText(z.p[1],x+75,y+118)}else{g.fillStyle='#c7aa76';g.font='950 34px Georgia';g.fillText('BF',x+75,y+84)}}if(state==='win'){g.fillStyle='#0a0806dc';g.fillRect(0,0,600,600);g.textAlign='center';g.fillStyle='#fff7e7';g.font='950 48px system-ui';g.fillText('MEMORY MASTER!',300,255);g.fillStyle='#e8b95c';g.font='700 21px system-ui';g.fillText(`${moves} moves · ${elapsed}s`,300,305);g.fillStyle='#d0c2ac';g.font='17px system-ui';g.fillText('Tap to reshuffle',300,350)}}function loop(){draw();requestAnimationFrame(loop)}reset();loop()})();
</script></body></html>
