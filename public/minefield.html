<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Minefield</title><style>
:root{color-scheme:dark;--ink:#f8f1e2;--muted:#bbaa90;--gold:#e8b95c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#373322,#0f0d0a 60%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,580px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.09em}.stats{font-size:12px;color:var(--muted)}.stats b{color:var(--gold);font-size:18px}canvas{display:block;width:100%;aspect-ratio:1;background:#241d16;border:1px solid #65533d;border-radius:18px;box-shadow:0 18px 58px #0009;touch-action:none}.controls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}.controls button{min-height:44px;border:1px solid #67523a;border-radius:12px;background:#2a2119;color:#f7ecd8;font-weight:800;padding:0 13px}.hint{font-size:11px;color:var(--muted)}a{font-size:11px;color:var(--gold);text-decoration:none}</style></head><body><div class="wrap"><div class="head"><div class="brand">MINEFIELD</div><div class="stats">MINES <b id="mines">10</b> · FLAGS <b id="flags">0</b> · TIME <b id="time">0</b></div></div><canvas id="game" width="600" height="600" aria-label="Minefield puzzle"></canvas><div class="controls"><button data-mode="9,10">Easy 9×9</button><button data-mode="12,20">Medium 12×12</button><span class="hint">Tap reveal · hold / right-click flag</span><a href="/">Back to Lodge</a></div></div><script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),minesEl=document.getElementById('mines'),flagsEl=document.getElementById('flags'),timeEl=document.getElementById('time');let N=9,M=10,cells=[],state='ready',started=0,elapsed=0,hold=null,downCell=null;function index(x,y){return y*N+x}function neighbors(x,y){const a=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if((dx||dy)&&x+dx>=0&&y+dy>=0&&x+dx<N&&y+dy<N)a.push([x+dx,y+dy]);return a}function reset(){cells=Array.from({length:N*N},()=>({mine:false,reveal:false,flag:false,n:0}));state='ready';started=0;elapsed=0;minesEl.textContent=M;flagsEl.textContent=0;timeEl.textContent=0}function plant(sx,sy){const banned=new Set([[sx,sy],...neighbors(sx,sy)].map(([x,y])=>index(x,y))),spots=[];for(let i=0;i<N*N;i++)if(!banned.has(i))spots.push(i);for(let k=0;k<M;k++){const j=Math.floor(Math.random()*spots.length),i=spots.splice(j,1)[0];cells[i].mine=true}for(let y=0;y<N;y++)for(let x=0;x<N;x++)cells[index(x,y)].n=neighbors(x,y).filter(([a,b])=>cells[index(a,b)].mine).length;state='play';started=performance.now()}function flood(x,y){const q=[[x,y]],seen=new Set();while(q.length){const [a,b]=q.shift(),i=index(a,b);if(seen.has(i))continue;seen.add(i);const z=cells[i];if(z.flag||z.reveal)continue;z.reveal=true;if(z.n===0&&!z.mine)neighbors(a,b).forEach(p=>q.push(p))}}function reveal(x,y){const z=cells[index(x,y)];if(z.flag||state==='over'||state==='win')return;if(state==='ready')plant(x,y);if(z.mine){z.reveal=true;for(const a of cells)if(a.mine)a.reveal=true;state='over';return}flood(x,y);checkWin()}function flag(x,y){if(state==='over'||state==='win')return;const z=cells[index(x,y)];if(z.reveal)return;z.flag=!z.flag;flagsEl.textContent=cells.filter(a=>a.flag).length}function checkWin(){if(cells.filter(a=>!a.mine).every(a=>a.reveal)){state='win';for(const a of cells)if(a.mine)a.flag=true;flagsEl.textContent=M}}function cellFrom(e){const r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*N/r.width),y=Math.floor((e.clientY-r.top)*N/r.height);return{x:Math.max(0,Math.min(N-1,x)),y:Math.max(0,Math.min(N-1,y))}}c.addEventListener('contextmenu',e=>{e.preventDefault();const p=cellFrom(e);flag(p.x,p.y)});c.addEventListener('pointerdown',e=>{if(state==='over'||state==='win'){reset();return}downCell=cellFrom(e);hold=setTimeout(()=>{if(downCell){flag(downCell.x,downCell.y);downCell=null}},520)});c.addEventListener('pointerup',e=>{clearTimeout(hold);if(!downCell)return;const p=cellFrom(e);if(p.x===downCell.x&&p.y===downCell.y)reveal(p.x,p.y);downCell=null});c.addEventListener('pointercancel',()=>{clearTimeout(hold);downCell=null});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{[N,M]=b.dataset.mode.split(',').map(Number);reset()}));function draw(){if(state==='play')elapsed=Math.floor((performance.now()-started)/1000);timeEl.textContent=elapsed;g.fillStyle='#201810';g.fillRect(0,0,600,600);const S=600/N;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const z=cells[index(x,y)],px=x*S,py=y*S;g.strokeStyle='#17110c';g.lineWidth=1;g.fillStyle=z.reveal?'#c8b18a':'#5a4733';g.fillRect(px+1,py+1,S-2,S-2);g.strokeRect(px+1,py+1,S-2,S-2);if(!z.reveal){g.fillStyle='#80654a';g.fillRect(px+5,py+5,S-10,Math.max(4,S*.12));if(z.flag){g.textAlign='center';g.textBaseline='middle';g.font=`${S*.52}px system-ui`;g.fillText('🚩',px+S/2,py+S/2)}}else if(z.mine){g.textAlign='center';g.textBaseline='middle';g.font=`${S*.52}px system-ui`;g.fillText('💥',px+S/2,py+S/2)}else if(z.n){const cols=['','#2b5d93','#2f7447','#a4473d','#5b3e93','#8e522d','#337c79','#262626','#777'];g.fillStyle=cols[z.n];g.textAlign='center';g.textBaseline='middle';g.font=`900 ${S*.45}px system-ui`;g.fillText(z.n,px+S/2,py+S/2)}}if(state==='over'||state==='win'){g.fillStyle='#0a0806d9';g.fillRect(0,0,600,600);g.textAlign='center';g.fillStyle='#f8f1e2';g.font='950 48px system-ui';g.fillText(state==='win'?'FIELD CLEARED!':'BOOM!',300,260);g.fillStyle='#e8b95c';g.font='700 21px system-ui';g.fillText(state==='win'?`Cleared in ${elapsed}s`:'That square was live',300,310);g.fillStyle='#cec0a8';g.font='17px system-ui';g.fillText('Tap the board to play again',300,355)}}function loop(){draw();requestAnimationFrame(loop)}reset();loop()})();
</script></body></html>
