<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Neon Snake</title><style>
:root{color-scheme:dark;--bg:#050807;--ink:#efffe8;--muted:#9cb5a3;--gold:#efbe62;--green:#66ff9c;--pink:#ff6b9c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#173322,#050807 58%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,620px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:900;letter-spacing:.1em}.stats{font-size:12px;color:var(--muted)}.stats b{color:var(--gold);font-size:18px}canvas{display:block;width:100%;aspect-ratio:1/1;background:#06100a;border:1px solid #31543d;border-radius:18px;box-shadow:0 18px 58px #0009;touch-action:none}.hint{display:flex;justify-content:space-between;gap:10px;margin:7px 5px 0;font-size:11px;color:var(--muted)}.hint a{color:var(--gold);text-decoration:none}</style></head><body><div class="wrap"><div class="head"><div class="brand">NEON SNAKE</div><div class="stats">SCORE <b id="score">0</b> · BEST <b id="best">0</b> · SPEED <b id="speed">1</b></div></div><canvas id="game" width="600" height="600" aria-label="Snake game"></canvas><div class="hint"><span>Arrow keys / WASD · Swipe on phone · speeds up every 5 foods</span><a href="/">Back to Lodge</a></div></div><script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),N=20,C=c.width/N,S=document.getElementById('score'),B=document.getElementById('best'),V=document.getElementById('speed');let best=Number(localStorage.getItem('bfg_snake_best')||0),state='ready',snake,dir,next,queue,food,score=0,last=performance.now(),acc=0,stepTime=.145,touch=null;B.textContent=best;
function rndFood(){let f;do{f={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===f.x&&s.y===f.y));return f}
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};next={...dir};queue=[];food=rndFood();score=0;stepTime=.145;state='play';sync()}
function sync(){S.textContent=score;B.textContent=best;V.textContent=1+Math.floor(score/5)}
function input(d){if(state!=='play'){reset();return}const base=queue.length?queue[queue.length-1]:next;if(d.x===-base.x&&d.y===-base.y)return;if(queue.length<2)queue.push(d)}
function tick(){if(queue.length)next=queue.shift();dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some((s,i)=>i<snake.length-1&&s.x===h.x&&s.y===h.y)){state='over';if(score>best){best=score;localStorage.setItem('bfg_snake_best',String(best));sync()}return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;food=rndFood();stepTime=Math.max(.065,.145-Math.floor(score/5)*.009);sync()}else snake.pop()}
function draw(){g.fillStyle='#051009';g.fillRect(0,0,c.width,c.height);g.strokeStyle='#102719';g.lineWidth=1;for(let i=0;i<=N;i++){g.beginPath();g.moveTo(i*C,0);g.lineTo(i*C,c.height);g.stroke();g.beginPath();g.moveTo(0,i*C);g.lineTo(c.width,i*C);g.stroke()}g.shadowColor='#ff6b9c';g.shadowBlur=18;g.fillStyle='#ff6b9c';g.beginPath();g.arc((food.x+.5)*C,(food.y+.5)*C,C*.28,0,Math.PI*2);g.fill();g.shadowBlur=0;snake.forEach((s,i)=>{const pad=i===0?3:4;g.fillStyle=i===0?'#b8ffd0':'#66ff9c';g.shadowColor='#66ff9c';g.shadowBlur=i===0?14:7;g.beginPath();g.roundRect(s.x*C+pad,s.y*C+pad,C-pad*2,C-pad*2,7);g.fill()});g.shadowBlur=0;if(state!=='play'){g.fillStyle='#031008dc';g.fillRect(0,0,c.width,c.height);g.textAlign='center';g.fillStyle='#efffe8';g.font='900 48px system-ui';g.fillText(state==='over'?'GAME OVER':'NEON SNAKE',c.width/2,c.height*.40);g.fillStyle='#efbe62';g.font='700 22px system-ui';g.fillText(state==='over'?`Score ${score} · Best ${best}`:'20 × 20 grid',c.width/2,c.height*.47);g.fillStyle='#a9bead';g.font='18px system-ui';g.fillText(state==='over'?'Press a direction or tap to restart':'Press an arrow / WASD or tap to start',c.width/2,c.height*.54)}}
function frame(now){let dt=Math.min(.06,(now-last)/1000);last=now;if(state==='play'){acc+=dt;while(acc>=stepTime){tick();acc-=stepTime;if(state!=='play')break}}draw();requestAnimationFrame(frame)}
const map={arrowup:{x:0,y:-1},w:{x:0,y:-1},arrowdown:{x:0,y:1},s:{x:0,y:1},arrowleft:{x:-1,y:0},a:{x:-1,y:0},arrowright:{x:1,y:0},d:{x:1,y:0}};addEventListener('keydown',e=>{const d=map[e.key.toLowerCase()];if(d){e.preventDefault();input(d)}});c.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY};if(state!=='play')reset()});c.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.hypot(dx,dy)<18)return;input(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)})});sync();requestAnimationFrame(frame)})();
</script></body></html>
