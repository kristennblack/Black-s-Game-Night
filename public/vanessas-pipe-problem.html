<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Vanessa's Pipe Problem - Black Family Game Night</title>
<style>
:root{color-scheme:dark;--ink:#fff5e8;--muted:#c3b39e;--gold:#e8b95c;--pink:#ef7cae;--edge:#6c5945}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#493729,#100c09 68%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:9px}.wrap{width:min(100%,760px)}
.head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.06em;line-height:1.02}.brand small{display:block;font-size:10px;color:var(--pink);letter-spacing:.2em;margin-bottom:4px}.stats{font-size:10px;color:var(--muted);text-align:right;line-height:1.35}.stats b{color:var(--gold);font-size:17px}
.stage{position:relative}.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-14px);opacity:0;background:#f3d593;color:#1b120a;padding:9px 13px;border-radius:999px;font-weight:950;font-size:12px;pointer-events:none;transition:.18s;z-index:4;box-shadow:0 8px 28px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}
canvas{display:block;width:100%;aspect-ratio:720/820;background:#19140f;border:1px solid #6c5743;border-radius:22px;box-shadow:0 18px 58px #0009;touch-action:manipulation}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 4px 0;flex-wrap:wrap}.row button{min-height:44px;border:1px solid var(--edge);border-radius:12px;background:#292119;color:var(--ink);font-weight:900;padding:0 14px}.mission{font-size:12px;color:#f2c8d9;font-weight:850;flex:1;text-align:right}.foot{display:flex;justify-content:space-between;gap:8px;margin:7px 4px 0;font-size:11px;color:var(--muted);flex-wrap:wrap}.foot b{color:#e9d6bd}a{color:var(--gold);text-decoration:none}
@media(max-width:520px){body{padding:6px}.brand{font-size:15px}.stats b{font-size:15px}.row button{flex:0 0 auto}.mission{min-width:190px}.foot{font-size:10px}}
</style><link rel="stylesheet" href="/phase-w-platform.css?v=W45-HEADWEAR-SCALE-RECOVERY-63"></head>
<body><main class="wrap"><div class="head"><div class="brand"><small>VANESSA • WORKSITE SERVICE CALL</small>VANESSA'S PIPE PROBLEM</div><div class="stats">JOB <b id="level">1</b> / MOVES <b id="moves">0</b> / TIME <b id="time">0</b><br>REPAIRS <span id="repairs">0</span></div></div><div class="stage"><div class="toast" id="toast"></div><canvas id="game" width="720" height="820" aria-label="Vanessa detailed 3D pipe rotation puzzle with detailed grey GMC wash truck with pink GMC lettering"></canvas></div><div class="row"><button id="new">NEW PROBLEM</button><div class="mission" id="mission">Wash Vanessa's grey GMC</div></div><div class="foot"><span><b>Tap:</b> repair a damaged socket first, then rotate the pipe. Route water from the pump to the grey GMC. Reaching the truck wins the level.</span><a href="/">Back to Lodge</a></div></main>
<script>
const BFGN_PROGRESS_KEY='bfgn_arcade_progress_v1',BFGN_ACH_KEY='bfgn_arcade_achievements_v1';
function bfRead(k,f){try{return JSON.parse(localStorage.getItem(k)||'')||f}catch{return f}}function bfWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function bfPlay(id){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.plays=(p.plays||0)+1;p.games=p.games||{};p.games[id]=(p.games[id]||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfWin(){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.wins=(p.wins||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfUnlock(id,label){const a=bfRead(BFGN_ACH_KEY,{});if(a[id])return false;a[id]={label,at:Date.now()};bfWrite(BFGN_ACH_KEY,a);const t=document.getElementById('toast');if(t){t.textContent='Achievement: '+label;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}return true}
</script>
<script type="module" src="/vanessas-pipe-problem.mjs"></script><script type="module" src="/phase-w-platform.mjs?v=W45-HEADWEAR-SCALE-RECOVERY-63"></script></body></html>
