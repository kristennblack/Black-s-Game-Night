<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Vanessa's Pipe Problem - Black Family Game Night</title><style>
:root{color-scheme:dark;--ink:#fff6e6;--muted:#baa98f;--gold:#e8b95c;--panel:#1b1510;--wood:#2a1b12;--accent:#d4934c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#46301f,#100c09 62%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,600px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.07em;line-height:1.05}.brand small{display:block;font-size:10px;color:var(--gold);letter-spacing:.18em;margin-bottom:3px}.stats{font-size:11px;color:var(--muted);text-align:right}.stats b{color:var(--gold);font-size:18px}.foot{display:flex;justify-content:space-between;align-items:center;gap:9px;margin:7px 4px 0;font-size:11px;color:var(--muted);flex-wrap:wrap}a{color:var(--gold);text-decoration:none}.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-15px);opacity:0;background:#f4d793;color:#20130b;padding:10px 14px;border-radius:999px;font-weight:900;font-size:12px;pointer-events:none;transition:.2s;z-index:4;box-shadow:0 8px 28px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}.stage{position:relative}button{font:inherit}
canvas{display:block;width:100%;aspect-ratio:1;background:#201812;border:1px solid #6a5038;border-radius:20px;box-shadow:0 18px 58px #0009;touch-action:manipulation}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}.row button{min-height:44px;border:1px solid #6b523a;border-radius:11px;background:#2b2119;color:#f7ecd8;font-weight:850;padding:0 14px}.row span{font-size:12px;color:#d9c7a4;font-weight:800}</style><link rel="stylesheet" href="/phase-w-platform.css?v=25"></head><body><div class="wrap"><div class="head"><div class="brand"><small>VANESSA</small>VANESSA'S PIPE PROBLEM</div><div class="stats">JOB <b id="level">1</b> / MOVES <b id="moves">0</b> / TIME <b id="time">0</b></div></div><div class="stage"><div class="toast" id="toast"></div><canvas id="game" width="600" height="600" aria-label="Vanessa pipe rotation puzzle"></canvas></div><div class="row"><button id="new">NEW PROBLEM</button><span id="mission">Wash the GMC</span></div><div class="foot"><span>Tap a pipe to rotate it. Vanessa is already eye-rolling.</span><a href="/">Back to Lodge</a></div></div><script>
const BFGN_PROGRESS_KEY='bfgn_arcade_progress_v1';
const BFGN_ACH_KEY='bfgn_arcade_achievements_v1';
function bfRead(k,fallback){try{return JSON.parse(localStorage.getItem(k)||'')||fallback}catch{return fallback}}
function bfWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function bfPlay(id){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.plays=(p.plays||0)+1;p.games=p.games||{};p.games[id]=(p.games[id]||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfWin(){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.wins=(p.wins||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfUnlock(id,label){const a=bfRead(BFGN_ACH_KEY,{});if(a[id])return false;a[id]={label,at:Date.now()};bfWrite(BFGN_ACH_KEY,a);const t=document.getElementById('toast');if(t){t.textContent='Achievement: '+label;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}return true}

(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),levelEl=document.getElementById('level'),movesEl=document.getElementById('moves'),timeEl=document.getElementById('time'),missionEl=document.getElementById('mission');const N=6,S=100,NORTH=1,EAST=2,SOUTH=4,WEST=8,dirs=[[0,-1,NORTH,SOUTH],[1,0,EAST,WEST],[0,1,SOUTH,NORTH],[-1,0,WEST,EAST]],missions=['Wash the grey GMC','Fill the hot tub','Feed the campsite water line'];let target=[],tiles=[],level=1,moves=0,start=0,elapsed=0,state='play',lit=new Set(),completed=Number(localStorage.getItem('vanessaPipesCompleted')||0),comment='Seriously?';function idx(x,y){return y*N+x}function rot(mask){return ((mask<<1)&15)|((mask>>3)&1)}
function makeMaze(){target=Array(N*N).fill(0);const seen=new Set([0]),stack=[[0,0]];while(stack.length){const [x,y]=stack[stack.length-1],opts=[];for(const [dx,dy,a,b] of dirs){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<N&&ny<N&&!seen.has(idx(nx,ny)))opts.push([nx,ny,a,b])}if(!opts.length){stack.pop();continue}const [nx,ny,a,b]=opts[Math.floor(Math.random()*opts.length)];target[idx(x,y)]|=a;target[idx(nx,ny)]|=b;seen.add(idx(nx,ny));stack.push([nx,ny])}tiles=target.map(m=>{let r=m;const turns=Math.floor(Math.random()*4);for(let i=0;i<turns;i++)r=rot(r);return r});moves=0;elapsed=0;start=0;state='ready';movesEl.textContent=0;timeEl.textContent=0;missionEl.textContent=missions[(level-1)%missions.length];comment=['Seriously?','Who installed this?','John!','Unbelievable.'][Math.floor(Math.random()*4)];trace()}
function trace(){lit=new Set([0]);const q=[[0,0]];while(q.length){const [x,y]=q.shift(),m=tiles[idx(x,y)];for(const [dx,dy,a,b] of dirs)if(m&a){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=N||ny>=N)continue;const ni=idx(nx,ny);if(!(tiles[ni]&b)||lit.has(ni))continue;lit.add(ni);q.push([nx,ny])}}if(lit.size===N*N&&state==='play'){state='win';elapsed=Math.floor((performance.now()-start)/1000);completed++;localStorage.setItem('vanessaPipesCompleted',completed);if(completed>=5)bfUnlock('eye-roll-expert','Eye Roll Expert');bfWin()}}
function turn(x,y){if(state==='ready'){state='play';start=performance.now();bfPlay('vanessas-pipe-problem');return}if(state==='win'){level++;levelEl.textContent=level;makeMaze();return}const i=idx(x,y);tiles[i]=rot(tiles[i]);moves++;movesEl.textContent=moves;trace()}c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*N/r.width),y=Math.floor((e.clientY-r.top)*N/r.height);if(x>=0&&x<N&&y>=0&&y<N)turn(x,y)});document.getElementById('new').addEventListener('click',makeMaze);
function path(mask,cx,cy,on){g.lineCap='round';g.lineWidth=20;g.strokeStyle=on?'#63bfd1':'#8b806f';g.shadowColor=on?'#4bd8f5':'transparent';g.shadowBlur=on?20:0;g.beginPath();for(const [dx,dy,b] of [[0,-1,NORTH],[1,0,EAST],[0,1,SOUTH],[-1,0,WEST]])if(mask&b){g.moveTo(cx,cy);g.lineTo(cx+dx*43,cy+dy*43)}g.stroke();g.shadowBlur=0;g.fillStyle=on?'#dffbff':'#a89a85';g.beginPath();g.arc(cx,cy,13,0,Math.PI*2);g.fill()}
function draw(){if(state==='play'){elapsed=Math.floor((performance.now()-start)/1000);timeEl.textContent=elapsed}g.fillStyle='#211913';g.fillRect(0,0,600,600);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=idx(x,y),px=x*S,py=y*S;g.fillStyle=(x+y)%2?'#3a2c22':'#33261e';g.fillRect(px+2,py+2,S-4,S-4);g.strokeStyle='#5a4433';g.strokeRect(px+2,py+2,S-4,S-4);path(tiles[i],px+50,py+50,lit.has(i));if(i===0){g.fillStyle='#4f8c5f';g.fillRect(px+10,py+10,24,18)}if(i===N*N-1){g.fillStyle='#7c7f83';g.beginPath();g.roundRect(px+57,py+62,30,17,5);g.fill();g.fillStyle='#222';g.beginPath();g.arc(px+63,py+80,5,0,Math.PI*2);g.arc(px+82,py+80,5,0,Math.PI*2);g.fill()}}g.fillStyle='#f1dfb7';g.font='800 15px system-ui';g.textAlign='center';g.fillText(comment,300,22);if(state==='ready'||state==='win'){g.fillStyle='#0a0806df';g.fillRect(0,0,600,600);g.textAlign='center';g.fillStyle='#e8b95c';g.font='800 18px system-ui';g.fillText('VANESSA',300,190);g.fillStyle='#f8f1e2';g.font='950 42px system-ui';g.fillText(state==='win'?'UNBELIEVABLE. IT WORKS.':"VANESSA'S PIPE PROBLEM",300,252);g.fillStyle='#e8b95c';g.font='700 20px system-ui';g.fillText(state==='win'?`${moves} moves / ${elapsed}s`:'Who installed this?',300,305);g.fillStyle='#d0c1aa';g.font='17px system-ui';g.fillText(state==='win'?'Tap any pipe for the next problem.':'Tap the board to start eye-rolling.',300,350)}}function loop(){draw();requestAnimationFrame(loop)}makeMaze();loop()})();
</script><script type="module" src="/phase-w-platform.mjs?v=25"></script></body></html>
