<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Molly's Light Chase - Black Family Game Night</title><style>
:root{color-scheme:dark;--ink:#fff6e6;--muted:#c0b39f;--gold:#e8b95c;--panel:#1b1510}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#513721,#110c08 65%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,620px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.06em;line-height:1.05}.brand small{display:block;font-size:10px;color:var(--gold);letter-spacing:.18em;margin-bottom:3px}.stats{font-size:11px;color:var(--muted);text-align:right}.stats b{color:var(--gold);font-size:18px}.stage{position:relative}.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-15px);opacity:0;background:#f4d793;color:#20130b;padding:10px 14px;border-radius:999px;font-weight:900;font-size:12px;pointer-events:none;transition:.2s;z-index:4;box-shadow:0 8px 28px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}canvas{display:block;width:100%;aspect-ratio:1/1;background:#16120e;border:1px solid #735333;border-radius:22px;box-shadow:0 18px 58px #0009;touch-action:none}.controls{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);justify-content:center;gap:6px;margin-top:9px}.controls button{border:1px solid #8d6a3e;border-radius:12px;background:linear-gradient(#3b2c20,#21170f);color:#f7e7c7;font:950 22px system-ui;box-shadow:0 5px 11px #0008}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.foot{display:flex;justify-content:space-between;align-items:center;gap:9px;margin:8px 4px 0;font-size:11px;color:var(--muted);flex-wrap:wrap}a{color:var(--gold);text-decoration:none}@media(min-width:720px){.controls{display:none}}
</style><link rel="stylesheet" href="/phase-w-platform.css?v=W45-HEADWEAR-SCALE-RECOVERY-63"><script src="/look-reward-runtime.js?v=W55-FULL-FAMILY-390-LOOKS-SHOP-73"></script></head><body><div class="wrap"><div class="head"><div class="brand"><small>MOLLY</small>MOLLY'S LIGHT CHASE</div><div class="stats">LIGHTS <b id="score">0</b> / TRAIL <b id="trail">3</b> / BEST <b id="best">0</b></div></div><div class="stage"><div class="toast" id="toast"></div><canvas id="game" width="640" height="640" aria-label="Steer Molly through the cabin to chase glowing lights"></canvas></div><div class="controls" aria-label="Direction controls"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button></div><div class="foot"><span>Arrow keys / WASD / swipe. Catch lights, grow Molly's glowing trail, don't run into it.</span><a href="/">Back to Lodge</a></div></div><script>
const BFGN_PROGRESS_KEY='bfgn_arcade_progress_v1',BFGN_ACH_KEY='bfgn_arcade_achievements_v1';
function bfRead(k,f){try{return JSON.parse(localStorage.getItem(k)||'')||f}catch{return f}}function bfWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}function bfPlay(id){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.plays=(p.plays||0)+1;p.games=p.games||{};p.games[id]=(p.games[id]||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}function bfUnlock(id,label){const a=bfRead(BFGN_ACH_KEY,{});if(a[id])return;a[id]={label,at:Date.now()};bfWrite(BFGN_ACH_KEY,a);toast('Achievement: '+label)}function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._to);el._to=setTimeout(()=>el.classList.remove('show'),1800)}
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),scoreEl=document.getElementById('score'),trailEl=document.getElementById('trail'),bestEl=document.getElementById('best'),N=20,S=32,mollyImg=new Image(),cabinProps=['home-flagship-h085-dog-treat-station','home-flagship-h009-quilted-reading-chair','home-flagship-h087-stained-glass-pine-window'].map(id=>{const im=new Image();im.src='/cabin-assets/generated/placeables/'+id+'.svg';return im});mollyImg.src='/characters3d/molly.png';let best=Number(localStorage.getItem('mollyLightBest')||0),state='ready',score=0,body=[],dir={x:1,y:0},queued={x:1,y:0},light={x:14,y:10},acc=0,step=.19,last=performance.now(),pulse=0,swipe=null;bestEl.textContent=best;
function randomLight(){for(let tries=0;tries<300;tries++){const q={x:1+Math.floor(Math.random()*(N-2)),y:1+Math.floor(Math.random()*(N-2))};if(!body.some(b=>b.x===q.x&&b.y===q.y)){light=q;return}}}
function start(){state='play';score=0;body=[{x:7,y:10},{x:6,y:10},{x:5,y:10}];dir={x:1,y:0};queued={...dir};step=.19;acc=0;pulse=0;randomLight();scoreEl.textContent='0';trailEl.textContent=body.length;bfPlay('mollys-light-chase')}
function choose(x,y){if(state!=='play'){start();return}if(x===-dir.x&&y===-dir.y)return;queued={x,y}}
function tick(){dir=queued;const h=body[0],n={x:h.x+dir.x,y:h.y+dir.y};if(n.x<0||n.x>=N||n.y<0||n.y>=N||body.some((b,i)=>i<body.length-1&&b.x===n.x&&b.y===n.y)){state='over';toast('Molly got tangled in her light trail');return}body.unshift(n);if(n.x===light.x&&n.y===light.y){score++;scoreEl.textContent=score;trailEl.textContent=body.length;best=Math.max(best,score);bestEl.textContent=best;localStorage.setItem('mollyLightBest',best);pulse=.32;step=Math.max(.075,.19-Math.floor(score/5)*.012);if(score===10){bfUnlock('molly-glow-pup','Glow Pup');BFGNGrantLook('molly','molly-look-06','molly-lights-10')}if(score===25){bfUnlock('molly-loves-lights','Molly Loves Lights');BFGNGrantLook('molly','molly-look-18','molly-lights-25')}if(score===40)BFGNGrantLook('molly','molly-look-30','molly-lights-40');randomLight()}else body.pop()}
function cabin(){const grad=g.createLinearGradient(0,0,640,640);grad.addColorStop(0,'#3b2819');grad.addColorStop(1,'#17100b');g.fillStyle=grad;g.fillRect(0,0,640,640);for(let y=0;y<640;y+=64){g.fillStyle=y%128?'#3a281a55':'#6a452755';g.fillRect(0,y,640,2)}for(let x=0;x<640;x+=128){g.fillStyle='#0b090744';g.fillRect(x,0,2,640)}g.fillStyle='#26371f';g.beginPath();g.ellipse(320,320,245,210,0,0,Math.PI*2);g.fill();g.strokeStyle='#826a48';g.lineWidth=12;g.stroke();g.fillStyle='#201710';g.fillRect(42,42,110,42);g.fillRect(500,510,92,72);g.fillStyle='#6f4a2c';g.fillRect(475,60,118,66);g.fillStyle='#d9aa5a33';g.fillRect(90,510,146,68);if(cabinProps[0].complete)g.drawImage(cabinProps[0],22,28,135,105);if(cabinProps[1].complete)g.drawImage(cabinProps[1],500,30,82,126);if(cabinProps[2].complete)g.drawImage(cabinProps[2],230,500,180,105)}
function paw(x,y,a){g.save();g.globalAlpha=a;g.translate(x*S+S/2,y*S+S/2);g.fillStyle='#f0c86c';g.beginPath();g.ellipse(0,4,8,6,0,0,Math.PI*2);g.fill();for(const [dx,dy] of [[-8,-7],[-3,-11],[4,-11],[9,-6]]){g.beginPath();g.arc(dx,dy,3.2,0,Math.PI*2);g.fill()}g.restore()}
function drawMolly(h){const cx=h.x*S+S/2,cy=h.y*S+S/2,angle=Math.atan2(dir.y,dir.x);g.save();g.translate(cx,cy);g.rotate(angle+Math.PI/2);g.shadowColor='#f4c36a';g.shadowBlur=12;if(mollyImg.complete&&mollyImg.naturalWidth){g.beginPath();g.arc(0,0,24,0,Math.PI*2);g.clip();g.drawImage(mollyImg,-26,-26,52,52)}else{g.fillStyle='#c99a72';g.beginPath();g.arc(0,0,21,0,Math.PI*2);g.fill()}g.restore();g.fillStyle='#ff96aa';g.beginPath();g.ellipse(cx-dir.y*7+dir.x*15,cy+dir.x*7+dir.y*15,4,8,Math.atan2(dir.y,dir.x),0,Math.PI*2);g.fill()}
function draw(){cabin();for(let i=body.length-1;i>=1;i--)paw(body[i].x,body[i].y,Math.max(.22,1-i/(body.length+4)));const lx=light.x*S+S/2,ly=light.y*S+S/2;g.save();g.shadowColor='#fff36a';g.shadowBlur=26+(pulse>0?24:0);g.fillStyle='#fff16b';g.beginPath();g.arc(lx,ly,9+(pulse>0?4:0),0,Math.PI*2);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(lx-3,ly-4,3,0,Math.PI*2);g.fill();g.restore();if(body.length)drawMolly(body[0]);if(state!=='play'){g.fillStyle='#080604dc';g.fillRect(0,0,640,640);g.textAlign='center';g.fillStyle='#e8b95c';g.font='900 17px system-ui';g.fillText('MOLLY',320,205);g.fillStyle='#fff6e6';g.font='950 43px system-ui';g.fillText("MOLLY'S LIGHT CHASE",320,265);g.fillStyle='#dfc8a5';g.font='700 18px system-ui';g.fillText(state==='over'?`Lights caught: ${score} · trail length: ${body.length}`:'Chase the light. Every catch grows your glowing trail.',320,313);g.fillText(state==='over'?'Tap, press a direction, or swipe to chase again':'Tap, press a direction, or swipe to start',320,350);g.fillStyle='#bfae95';g.font='15px system-ui';g.fillText('Do not hit the walls or Molly’s own trail.',320,387)}}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(state==='play'){acc+=dt;pulse=Math.max(0,pulse-dt);while(acc>=step){acc-=step;tick();if(state!=='play')break}}draw();requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(m[k]){e.preventDefault();choose(...m[k])}});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};choose(...m[b.dataset.dir])});c.addEventListener('pointerdown',e=>{swipe={x:e.clientX,y:e.clientY};if(state!=='play')start()});c.addEventListener('pointerup',e=>{if(!swipe)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;swipe=null;if(Math.hypot(dx,dy)<18)return;if(Math.abs(dx)>Math.abs(dy))choose(Math.sign(dx),0);else choose(0,Math.sign(dy))});requestAnimationFrame(loop)})();
</script><script type="module" src="/phase-w-platform.mjs?v=W45-HEADWEAR-SCALE-RECOVERY-63"></script></body></html>
