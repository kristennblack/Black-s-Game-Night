<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Molly's Light Chase - Black Family Game Night</title><style>
:root{color-scheme:dark;--ink:#fff6e6;--muted:#baa98f;--gold:#e8b95c;--panel:#1b1510;--wood:#2a1b12;--accent:#d4934c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#46301f,#100c09 62%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,600px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.07em;line-height:1.05}.brand small{display:block;font-size:10px;color:var(--gold);letter-spacing:.18em;margin-bottom:3px}.stats{font-size:11px;color:var(--muted);text-align:right}.stats b{color:var(--gold);font-size:18px}.foot{display:flex;justify-content:space-between;align-items:center;gap:9px;margin:7px 4px 0;font-size:11px;color:var(--muted);flex-wrap:wrap}a{color:var(--gold);text-decoration:none}.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-15px);opacity:0;background:#f4d793;color:#20130b;padding:10px 14px;border-radius:999px;font-weight:900;font-size:12px;pointer-events:none;transition:.2s;z-index:4;box-shadow:0 8px 28px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}.stage{position:relative}button{font:inherit}
canvas{display:block;width:100%;aspect-ratio:5/6;background:#151527;border:1px solid #5d5877;border-radius:20px;box-shadow:0 18px 58px #0009;touch-action:manipulation}</style><link rel="stylesheet" href="/phase-w-platform.css?v=25"></head><body><div class="wrap"><div class="head"><div class="brand"><small>MOLLY</small>MOLLY'S LIGHT CHASE</div><div class="stats">CAUGHT <b id="score">0</b> / TIME <b id="time">30</b> / BEST <b id="best">0</b></div></div><div class="stage"><div class="toast" id="toast"></div><canvas id="game" width="600" height="720" aria-label="Molly light chase reaction game"></canvas></div><div class="foot"><span>Tap the moving light before Molly loses it.</span><a href="/">Back to Lodge</a></div></div><script>
const BFGN_PROGRESS_KEY='bfgn_arcade_progress_v1';
const BFGN_ACH_KEY='bfgn_arcade_achievements_v1';
function bfRead(k,fallback){try{return JSON.parse(localStorage.getItem(k)||'')||fallback}catch{return fallback}}
function bfWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function bfPlay(id){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.plays=(p.plays||0)+1;p.games=p.games||{};p.games[id]=(p.games[id]||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfWin(){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.wins=(p.wins||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfUnlock(id,label){const a=bfRead(BFGN_ACH_KEY,{});if(a[id])return false;a[id]={label,at:Date.now()};bfWrite(BFGN_ACH_KEY,a);const t=document.getElementById('toast');if(t){t.textContent='Achievement: '+label;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}return true}

(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best');let state='ready',score=0,time=30,last=performance.now(),best=Number(localStorage.getItem('mollyLightBest')||0),dog={x:300,y:620},orb={x:300,y:260,vx:190,vy:155,r:24},burst=0;bestEl.textContent=best;function resetOrb(){orb.x=80+Math.random()*440;orb.y=90+Math.random()*430;const a=Math.random()*Math.PI*2,s=180+Math.random()*120;orb.vx=Math.cos(a)*s;orb.vy=Math.sin(a)*s}function start(){state='play';score=0;time=30;scoreEl.textContent=0;bfPlay('mollys-light-chase');resetOrb()}
c.addEventListener('pointerdown',e=>{if(state!=='play'){start();return}const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*720/r.height;if(Math.hypot(x-orb.x,y-orb.y)<orb.r+24){score++;scoreEl.textContent=score;dog.x=orb.x;dog.y=Math.min(620,orb.y+70);burst=.25;best=Math.max(best,score);localStorage.setItem('mollyLightBest',best);bestEl.textContent=best;if(score>=30)bfUnlock('molly-loves-lights','Molly Loves Lights');resetOrb()}});
function update(dt){if(state!=='play')return;time-=dt;timeEl.textContent=Math.ceil(Math.max(0,time));orb.x+=orb.vx*dt;orb.y+=orb.vy*dt;if(orb.x<45&&orb.vx<0||orb.x>555&&orb.vx>0)orb.vx*=-1;if(orb.y<60&&orb.vy<0||orb.y>520&&orb.vy>0)orb.vy*=-1;burst=Math.max(0,burst-dt);if(time<=0)state='over'}
function drawMolly(){g.save();g.translate(dog.x,dog.y);g.fillStyle='#caa27d';g.beginPath();g.ellipse(0,5,43,27,0,0,Math.PI*2);g.fill();g.beginPath();g.arc(28,-18,25,0,Math.PI*2);g.fill();g.fillStyle='#6d4c35';g.beginPath();g.ellipse(14,-35,12,24,-.5,0,Math.PI*2);g.fill();g.fillStyle='#222';g.beginPath();g.arc(36,-23,3,0,Math.PI*2);g.fill();g.fillStyle='#e58d9a';g.beginPath();g.roundRect(38,-6,10,25,5);g.fill();g.restore()}
function draw(){g.fillStyle='#151527';g.fillRect(0,0,600,720);for(let i=0;i<55;i++){g.fillStyle=`rgba(255,255,255,${.05+(i%5)*.02})`;g.fillRect((i*97)%600,(i*53)%560,2,2)}g.save();g.shadowColor='#fff36a';g.shadowBlur=burst?55:35;g.fillStyle='#fff36a';g.beginPath();g.arc(orb.x,orb.y,orb.r+(burst?8:0),0,Math.PI*2);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(orb.x-7,orb.y-8,6,0,Math.PI*2);g.fill();g.restore();drawMolly();if(state!=='play'){g.fillStyle='#080811df';g.fillRect(0,0,600,720);g.textAlign='center';g.fillStyle='#e8b95c';g.font='800 18px system-ui';g.fillText('MOLLY',300,250);g.fillStyle='#fff6e6';g.font='950 47px system-ui';g.fillText(state==='over'?'TONGUE OUT, LIGHT GONE':"MOLLY'S LIGHT CHASE",300,315);g.fillStyle='#e8b95c';g.font='700 21px system-ui';g.fillText(state==='over'?`Caught ${score} lights`:'Molly loves lights. Catch as many as you can.',300,365);g.fillStyle='#d0c1aa';g.font='17px system-ui';g.fillText(state==='over'?'Tap to chase again':'Tap to start',300,410)}}function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script><script type="module" src="/phase-w-platform.mjs?v=25"></script></body></html>
