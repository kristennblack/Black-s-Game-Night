<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Neon Star Patrol</title><style>
:root{color-scheme:dark;--bg:#05070d;--panel:#101726;--ink:#f7f4e8;--muted:#9fb0c9;--gold:#e8b95c;--cyan:#62e7ff;--pink:#ff6ca8;--green:#6ff2a4}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 10%,#19233c 0,#080b13 42%,#03050a 100%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:12px}.wrap{width:min(100%,760px)}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:0 2px 8px}.brand{font-weight:900;letter-spacing:.08em}.hint{font-size:12px;color:var(--muted);text-align:right}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}.pill{background:#0c1220cc;border:1px solid #31405d;border-radius:13px;padding:8px 10px;text-align:center}.pill b{display:block;font-size:17px;color:var(--gold)}canvas{display:block;width:100%;aspect-ratio:3/4;max-height:78vh;background:#030711;border:1px solid #364567;border-radius:18px;box-shadow:0 18px 60px #0008;touch-action:none}.foot{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;margin:8px 4px 0}.back{color:var(--gold);text-decoration:none}@media(max-width:520px){body{padding:7px}.hud{gap:4px}.pill{padding:6px 4px;font-size:11px}.pill b{font-size:15px}.hint{font-size:10px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">NEON STAR PATROL</div><div class="hint">Move: arrows / WASD · Aim: mouse/touch · Fire: Space / hold pointer</div></div><div class="hud"><div class="pill">SCORE<b id="score">0</b></div><div class="pill">LIVES<b id="lives">3</b></div><div class="pill">WAVE<b id="wave">1</b></div><div class="pill">HEAT<b id="heat">0%</b></div></div><canvas id="game" width="720" height="960" aria-label="Top-down space shooter"></canvas><div class="foot"><span>Retro-vector family arcade · 3 lives · difficulty ramps over time</span><a class="back" href="/">Back to Lodge</a></div></div><script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),waveEl=document.getElementById('wave'),heatEl=document.getElementById('heat');const W=c.width,H=c.height,FIX=1/120;let acc=0,last=performance.now(),state='ready',score=0,lives=3,wave=1,time=0,spawnT=0,fireT=0,inv=0,shake=0,heat=0;const keys=new Set(),bullets=[],enemies=[],particles=[];const stars=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,s:.5+Math.random()*2,v:15+Math.random()*60}));const p={x:W/2,y:H*.78,r:18,speed:310,angle:-Math.PI/2};let aim={x:W/2,y:H/2},pointerDown=false;
function reset(){score=0;lives=3;wave=1;time=0;spawnT=.4;fireT=0;inv=0;shake=0;heat=0;bullets.length=enemies.length=particles.length=0;p.x=W/2;p.y=H*.78;p.angle=-Math.PI/2;state='play';sync()}
function sync(){scoreEl.textContent=score;livesEl.textContent=lives;waveEl.textContent=wave;heatEl.textContent=Math.round(heat*100)+'%'}
function fire(){if(state!=='play'||fireT>0||bullets.length>=55||heat>=1)return;const a=p.angle;bullets.push({x:p.x+Math.cos(a)*25,y:p.y+Math.sin(a)*25,vx:Math.cos(a)*650,vy:Math.sin(a)*650,r:4,life:1.3});fireT=.12;heat=Math.min(1,heat+.085)}
function asteroid(big=true){const edge=Math.floor(Math.random()*3),r=big?24+Math.random()*18:12+Math.random()*10;let ex,ey;if(edge===0){ex=Math.random()*W;ey=-r}else if(edge===1){ex=-r;ey=Math.random()*H*.72}else{ex=W+r;ey=Math.random()*H*.72}const a=Math.atan2(p.y-ey,p.x-ex)+(Math.random()-.5)*.55,s=big?80+wave*6+Math.random()*45:125+wave*7+Math.random()*60;enemies.push({type:'rock',x:ex,y:ey,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r,hp:big?2:1,big,rot:Math.random()*6,rv:(Math.random()-.5)*2})}
function hunter(){const fromLeft=Math.random()<.5,ex=fromLeft?-25:W+25,ey=80+Math.random()*H*.55,a=Math.atan2(p.y-ey,p.x-ex),s=100+wave*8;enemies.push({type:'ship',x:ex,y:ey,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:17,hp:2,shoot:.8+Math.random()*.7,rot:a})}
function spawn(){if(enemies.length>=28)return;Math.random()<Math.min(.18+.035*wave,.5)?hunter():asteroid(true)}
function burst(px,py,col,n=12){for(let i=0;i<n&&particles.length<180;i++){const a=Math.random()*Math.PI*2,s=40+Math.random()*180;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.45,max:.7,col})}}
function hitPlayer(){if(inv>0)return;lives--;inv=1.35;shake=10;burst(p.x,p.y,'#62e7ff',28);if(lives<=0)state='over';sync()}
function circle(a,b){const dx=a.x-b.x,dy=a.y-b.y,rr=a.r+b.r;return dx*dx+dy*dy<=rr*rr}
function step(dt){time+=dt;wave=1+Math.floor(time/22);fireT=Math.max(0,fireT-dt);inv=Math.max(0,inv-dt);heat=Math.max(0,heat-dt*.42);if((keys.has(' ')||pointerDown)&&state==='play')fire();let dx=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0),dy=(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('w')?1:0);if(dx||dy){const l=Math.hypot(dx,dy);p.x+=dx/l*p.speed*dt;p.y+=dy/l*p.speed*dt}p.x=Math.max(24,Math.min(W-24,p.x));p.y=Math.max(75,Math.min(H-28,p.y));p.angle=Math.atan2(aim.y-p.y,aim.x-p.x);spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.22,1.05-wave*.055)*(0.75+Math.random()*.5)}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}for(const e of enemies){e.x+=e.vx*dt;e.y+=e.vy*dt;e.rot+=(e.rv||0)*dt;if(e.type==='ship'){e.shoot-=dt;if(e.shoot<=0&&bullets.length<55){const a=Math.atan2(p.y-e.y,p.x-e.x);bullets.push({enemy:true,x:e.x,y:e.y,vx:Math.cos(a)*270,vy:Math.sin(a)*270,r:5,life:3});e.shoot=Math.max(.45,1.2-wave*.035)+Math.random()*.55}}}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];if(b.life<=0||b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){bullets.splice(i,1);continue}if(b.enemy){if(circle(b,p)&&inv<=0){bullets.splice(i,1);hitPlayer()}continue}for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(circle(b,e)){bullets.splice(i,1);e.hp--;burst(b.x,b.y,e.type==='rock'?'#e8b95c':'#ff6ca8',5);if(e.hp<=0){enemies.splice(j,1);score+=e.type==='rock'?(e.big?25:10):40;burst(e.x,e.y,e.type==='rock'?'#e8b95c':'#ff6ca8',18);if(e.type==='rock'&&e.big){for(let k=0;k<2;k++){const a=Math.random()*Math.PI*2,s=125+Math.random()*70;enemies.push({type:'rock',x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:e.r*.48,hp:1,big:false,rot:0,rv:(Math.random()-.5)*4})}}sync()}break}}}
for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(circle(e,p)){enemies.splice(j,1);hitPlayer()}else if(e.y>H+90||e.x<-100||e.x>W+100)enemies.splice(j,1)}for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.985;q.vy*=.985;q.life-=dt;if(q.life<=0)particles.splice(i,1)}sync()}
function poly(cx,cy,r,n,rot){x.beginPath();for(let i=0;i<n;i++){const a=rot+i*Math.PI*2/n,rr=r*(.78+.28*((i*17)%5)/4),px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}
function draw(){x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.84}x.fillStyle='#030711';x.fillRect(0,0,W,H);for(const s of stars){s.y+=s.v/60;if(s.y>H)s.y=0;x.globalAlpha=.3+s.s*.18;x.fillStyle='#d9f7ff';x.fillRect(s.x,s.y,s.s,s.s)}x.globalAlpha=1;x.strokeStyle='#17314b';x.lineWidth=1;for(let gx=0;gx<W;gx+=60){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke()}for(let gy=0;gy<H;gy+=60){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke()}
for(const e of enemies){if(e.type==='rock'){poly(e.x,e.y,e.r,9,e.rot);x.fillStyle='#17151b';x.fill();x.strokeStyle='#e8b95c';x.lineWidth=2;x.stroke()}else{x.save();x.translate(e.x,e.y);x.rotate(e.rot+Math.PI/2);x.strokeStyle='#ff6ca8';x.lineWidth=3;x.beginPath();x.moveTo(0,-19);x.lineTo(14,16);x.lineTo(0,10);x.lineTo(-14,16);x.closePath();x.stroke();x.restore()}}
for(const b of bullets){x.fillStyle=b.enemy?'#ff6ca8':'#62e7ff';x.shadowColor=x.fillStyle;x.shadowBlur=14;x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.fill();x.shadowBlur=0}for(const q of particles){x.globalAlpha=Math.max(0,q.life/q.max);x.fillStyle=q.col;x.fillRect(q.x,q.y,3,3)}x.globalAlpha=1;if(!(inv>0&&Math.floor(inv*10)%2)){x.save();x.translate(p.x,p.y);x.rotate(p.angle+Math.PI/2);x.strokeStyle='#62e7ff';x.lineWidth=4;x.shadowColor='#62e7ff';x.shadowBlur=15;x.beginPath();x.moveTo(0,-25);x.lineTo(17,18);x.lineTo(0,10);x.lineTo(-17,18);x.closePath();x.stroke();x.fillStyle='#e8b95c';x.fillRect(-4,16,8,14);x.restore()}x.restore();if(state!=='play'){x.fillStyle='#02050bdc';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#f7f4e8';x.font='900 48px system-ui';x.fillText(state==='over'?'MISSION OVER':'NEON STAR PATROL',W/2,H*.42);x.fillStyle='#e8b95c';x.font='700 24px system-ui';x.fillText(state==='over'?`Final score ${score}`:'Survive the waves',W/2,H*.48);x.fillStyle='#9fb0c9';x.font='18px system-ui';x.fillText('Tap / click / Space to start',W/2,H*.55)}}
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;acc+=dt;while(acc>=FIX){if(state==='play')step(FIX);acc-=FIX}draw();requestAnimationFrame(frame)}
function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}c.addEventListener('pointermove',e=>{aim=pos(e);if(e.pointerType==='touch'){p.x=Math.max(24,Math.min(W-24,aim.x));p.y=Math.max(75,Math.min(H-28,aim.y+120))}});c.addEventListener('pointerdown',e=>{aim=pos(e);if(state!=='play'){reset();return}pointerDown=true;fire();c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointerup',()=>pointerDown=false);c.addEventListener('pointercancel',()=>pointerDown=false);addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d'].includes(k))e.preventDefault();keys.add(k);if(state!=='play'&&(k===' '||k==='enter'))reset()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));sync();requestAnimationFrame(frame)})();
</script></body></html>
