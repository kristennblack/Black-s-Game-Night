<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Kelsi's Rock 'n' Roll Rescue - Black Family Game Night</title><style>
:root{color-scheme:dark;--ink:#fff4dc;--gold:#efc56f;--pink:#d9799d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#53683a,#17120c 70%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:9px}.wrap{width:min(100%,700px)}.head{display:flex;justify-content:space-between;align-items:end;margin:0 5px 8px}.brand{font-weight:1000;letter-spacing:.06em}.brand small{display:block;color:var(--pink);font-size:10px}.stats{font-size:10px;color:#d5c7ad}.stats b{color:var(--gold);font-size:18px}canvas{display:block;width:100%;aspect-ratio:700/760;background:#263421;border:1px solid #806843;border-radius:22px;box-shadow:0 20px 62px #000b;touch-action:none}.foot{display:flex;justify-content:space-between;gap:8px;margin:7px 4px;font-size:11px;color:#c8baa2}.foot a{color:var(--gold);text-decoration:none}</style><link rel="stylesheet" href="/phase-w-platform.css?v=31"></head><body><main class="wrap"><div class="head"><div class="brand"><small>KELSI • IMPORTANT ROCK DEPARTMENT</small>KELSI'S ROCK 'N' ROLL RESCUE</div><div class="stats">SCORE <b id="score">0</b> · LEVEL <b id="level">1</b><br>BEST <span id="best">0</span></div></div><canvas id="game" width="700" height="760" aria-label="Move Kelsi to catch rolling rocks and avoid mud clumps"></canvas><div class="foot"><span>Drag Kelsi left and right. Rocks +1 · shiny rocks +3 · heart rocks +5 · mud −3.</span><a href="/">Back to Lodge</a></div></main><script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),bestEl=document.getElementById('best');let state='ready',score=0,level=1,best=Number(localStorage.getItem('kelsiRockRollBest')||0),dogX=350,items=[],spawn=0,last=performance.now(),startAt=0;bestEl.textContent=best;
function reset(){state='play';score=0;level=1;dogX=350;items=[];spawn=0;startAt=performance.now();sync()}function sync(){scoreEl.textContent=score;levelEl.textContent=level;best=Math.max(best,score);bestEl.textContent=best;localStorage.setItem('kelsiRockRollBest',String(best))}
function addItem(){const r=Math.random(),kind=r<.12?'mud':r<.24?'heart':r<.48?'shiny':'rock';items.push({x:45+Math.random()*610,y:-35,v:120+level*11+Math.random()*65,spin:Math.random()*6.28,kind,size:kind==='heart'?17:18+Math.random()*9})}
function pointer(e){const r=c.getBoundingClientRect();dogX=Math.max(62,Math.min(638,(e.clientX-r.left)*700/r.width));if(state!=='play')reset()}c.addEventListener('pointerdown',pointer);c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointer(e)});
function dog(){g.save();g.translate(dogX,676);g.shadowColor='#000a';g.shadowBlur=12;g.fillStyle='#5a351e';g.beginPath();g.ellipse(0,22,50,38,0,0,Math.PI*2);g.fill();g.shadowBlur=0;const fur=g.createRadialGradient(-13,-12,5,0,0,48);fur.addColorStop(0,'#8b542b');fur.addColorStop(.55,'#673b21');fur.addColorStop(1,'#3d2418');g.fillStyle=fur;g.beginPath();g.arc(0,-12,43,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(-37,-18,18,31,-.35,0,Math.PI*2);g.ellipse(37,-18,18,31,.35,0,Math.PI*2);g.fill();g.fillStyle='#25160f';g.beginPath();g.arc(-15,-17,5,0,Math.PI*2);g.arc(15,-17,5,0,Math.PI*2);g.fill();g.fillStyle='#16100c';g.beginPath();g.ellipse(0,2,10,7,0,0,Math.PI*2);g.fill();g.strokeStyle='#d9799d';g.lineWidth=7;g.beginPath();g.arc(0,18,33,.2,Math.PI-.2);g.stroke();g.fillStyle='#d9799d';g.beginPath();g.roundRect(-28,35,56,18,8);g.fill();g.fillStyle='#fff2d5';g.font='900 10px system-ui';g.textAlign='center';g.fillText('ROCKS!',0,48);g.restore()}
function item(o){g.save();g.translate(o.x,o.y);g.rotate(o.spin);g.shadowColor='#0008';g.shadowBlur=7;if(o.kind==='mud'){g.fillStyle='#57391f';for(const [x,y,r] of [[0,0,o.size],[-12,4,10],[11,6,9]]){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}}else if(o.kind==='heart'){g.fillStyle='#e581a7';g.beginPath();g.moveTo(0,18);g.bezierCurveTo(-28,-2,-17,-28,0,-13);g.bezierCurveTo(17,-28,28,-2,0,18);g.fill()}else{const grd=g.createRadialGradient(-8,-10,3,0,0,o.size);grd.addColorStop(0,o.kind==='shiny'?'#fff3ae':'#d9c9a5');grd.addColorStop(.45,o.kind==='shiny'?'#d7ae52':'#96836a');grd.addColorStop(1,'#4b4033');g.fillStyle=grd;g.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4,rr=o.size*(k%2?.83:1);const x=Math.cos(a)*rr,y=Math.sin(a)*rr;k?g.lineTo(x,y):g.moveTo(x,y)}g.closePath();g.fill();if(o.kind==='shiny'){g.fillStyle='#fff8c5';g.beginPath();g.arc(-6,-7,4,0,Math.PI*2);g.fill()}}g.restore()}
function update(dt){if(state!=='play')return;spawn-=dt;if(spawn<=0){spawn=Math.max(.24,.7-level*.035);addItem()}level=1+Math.floor((performance.now()-startAt)/12000);for(const o of items){o.y+=o.v*dt;o.spin+=dt*1.7;if(o.y>625&&o.y<720&&Math.abs(o.x-dogX)<62){score+=o.kind==='mud'?-3:o.kind==='heart'?5:o.kind==='shiny'?3:1;o.dead=true;window.BFGNReaction?.(o.kind==='mud'?'Kelsi says that is not a rock.':o.kind==='heart'?'Kelsi found a treasure rock!':'Important rock acquired.','Kelsi')}else if(o.y>780)o.dead=true}items=items.filter(o=>!o.dead);score=Math.max(0,score);sync()}
function draw(){const sky=g.createLinearGradient(0,0,0,760);sky.addColorStop(0,'#546b45');sky.addColorStop(.45,'#415b36');sky.addColorStop(1,'#2c261b');g.fillStyle=sky;g.fillRect(0,0,700,760);g.fillStyle='#263720';g.beginPath();g.moveTo(0,250);g.lineTo(100,165);g.lineTo(210,240);g.lineTo(340,135);g.lineTo(470,235);g.lineTo(590,155);g.lineTo(700,240);g.lineTo(700,460);g.lineTo(0,460);g.fill();g.fillStyle='#5e5139';g.beginPath();g.moveTo(0,430);g.quadraticCurveTo(350,365,700,430);g.lineTo(700,760);g.lineTo(0,760);g.fill();g.strokeStyle='#887354';g.lineWidth=4;for(let y=470;y<630;y+=54){g.beginPath();g.moveTo(0,y);g.bezierCurveTo(220,y-30,480,y+20,700,y-15);g.stroke()}items.forEach(item);dog();if(state!=='play'){g.fillStyle='#100d09dd';g.fillRect(0,0,700,760);g.textAlign='center';g.fillStyle='#fff4dc';g.font='950 42px system-ui';g.fillText("KELSI'S ROCK 'N' ROLL RESCUE",350,315);g.fillStyle='#efc56f';g.font='700 20px system-ui';g.fillText('Catch the good rocks. Mud is definitely not treasure.',350,360);g.fillStyle='#d9ccb5';g.font='17px system-ui';g.fillText('Tap or drag to start',350,405)}}function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script><script type="module" src="/phase-w-platform.mjs?v=31"></script></body></html>
