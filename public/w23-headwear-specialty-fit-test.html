<!doctype html><meta charset='utf-8'><title>W23 Specialty Headwear Fit Test</title>
<style>
body{margin:0;background:#0b1118;color:#f5ead5;font-family:Arial,sans-serif}.wrap{padding:18px}.title{padding:8px 0 14px;border-bottom:1px solid #445}.title h1{margin:0;font-size:28px}.sub{color:#b9c4cf;margin-top:5px}.grid{display:grid;grid-template-columns:155px repeat(3,230px);gap:10px;margin-top:14px}.hdr{background:#172331;border:1px solid #52657b;padding:10px;border-radius:8px;text-align:center;font-weight:700}.avatar-name{display:flex;align-items:center;font-weight:700;font-size:16px}.card{background:#151e28;border:1px solid #42556b;border-radius:10px;padding:6px}.stage{position:relative;width:216px;height:270px;overflow:hidden;border-radius:8px;background:#222;border:2px solid #997743}.stage>img.avatar-base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.avatar-cosmetic{position:absolute;z-index:10;pointer-events:none;left:var(--cx);top:var(--cy);width:var(--cw);height:var(--ch,auto);max-width:none;object-fit:contain;transform:translate(-50%,-50%) rotate(var(--cr));transform-origin:50% 50%;filter:drop-shadow(0 2px 4px #000b)}.meta{font-size:11px;color:#b9c4cf;text-align:center;margin-top:4px}.semantic{font-size:12px;color:#87e6d0;margin-top:3px;text-align:center}
</style>
<div class=wrap><div class=title><h1>W23 Specialty Headwear Actual-Avatar Fit Test</h1><div class=sub>Semantic-anchor correction pass • 3 pending items × 13 actual app avatars • geometry proof only, not final art approval</div></div><div id=root class=grid></div></div>
<script type=module>
import {COSMETIC_BY_ID,fitProfileForAvatar} from './avatar-cosmetics.mjs';
const avatars=[
 ['john','John','/john-home-approved.jpg'],['kristen','Kristen','/avatars/kristen.png'],['holly','Holly','/avatars/holly.png'],['vanessa','Vanessa','/avatars/vanessa.png'],['elizabeth','Elizabeth / Lizzy','/avatars/elizabeth.png'],['logan','Logan','/avatars/logan.png'],['james','James','/avatars/james.png'],['dorothy','Dorothy','/avatars/dorothy.png'],['papa','Papa','/avatars/papa.png'],['nana','Nana','/avatars/nana.png'],['kelsi','Kelsi','/avatars/kelsi.png'],['molly','Molly','/avatars/molly.png'],['gunner','Gunner','/avatars/gunner.png']
];
const ids=['wear-flagship-w033-faux-fur-earmuffs','wear-flagship-w034-ballet-ribbon-bun-accessory','wear-hats-headwear-0078-work-crew-embroidered-teal-headband'];
const root=document.querySelector('#root');root.innerHTML='<div class=hdr>Actual avatar</div>'+ids.map(id=>{const i=COSMETIC_BY_ID[id];return `<div class=hdr>${i.name}<div class=semantic>${i.fitAnchor} anchor</div></div>`}).join('');
for(const [key,name,src] of avatars){root.insertAdjacentHTML('beforeend',`<div class=avatar-name>${name}</div>`);for(const id of ids){const item=COSMETIC_BY_ID[id];const f=fitProfileForAvatar(key,item.slot,item,0);root.insertAdjacentHTML('beforeend',`<div class=card><div class=stage><img class=avatar-base src="${src}"><img class=avatar-cosmetic src="${item.asset}" style="--cx:${f.x}%;--cy:${f.y}%;--cw:${f.w}%;--ch:${Number.isFinite(f.h)?f.h+'%':'auto'};--cr:${f.r||0}deg"></div><div class=meta>x ${f.x.toFixed(1)} • y ${f.y.toFixed(1)} • w ${f.w.toFixed(1)} • r ${(f.r||0).toFixed(1)}</div></div>`);}}
</script>
