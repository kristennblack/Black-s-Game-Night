<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Gunner's Snack Attack - Black Family Game Night</title><style>
:root{color-scheme:dark;--ink:#fff6e6;--muted:#baa98f;--gold:#e8b95c;--panel:#1b1510;--wood:#2a1b12;--accent:#d4934c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#46301f,#100c09 62%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,600px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.07em;line-height:1.05}.brand small{display:block;font-size:10px;color:var(--gold);letter-spacing:.18em;margin-bottom:3px}.stats{font-size:11px;color:var(--muted);text-align:right}.stats b{color:var(--gold);font-size:18px}.foot{display:flex;justify-content:space-between;align-items:center;gap:9px;margin:7px 4px 0;font-size:11px;color:var(--muted);flex-wrap:wrap}a{color:var(--gold);text-decoration:none}.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-15px);opacity:0;background:#f4d793;color:#20130b;padding:10px 14px;border-radius:999px;font-weight:900;font-size:12px;pointer-events:none;transition:.2s;z-index:4;box-shadow:0 8px 28px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}.stage{position:relative}button{font:inherit}
canvas{display:block;width:100%;aspect-ratio:5/6;background:#2d3f2a;border:1px solid #6b593d;border-radius:20px;box-shadow:0 18px 58px #0009;touch-action:none}.dpad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.dpad button{min-height:44px;border:1px solid #6a5038;border-radius:11px;background:#2b2119;color:#f7ecd8;font-weight:900;font-size:10px}</style><link rel="stylesheet" href="/phase-w-platform.css?v=33"></head><body><div class="wrap"><div class="head"><div class="brand"><small>GUNNER BONUS</small>GUNNER'S SNACK ATTACK</div><div class="stats">SNACKS <b id="score">0</b> / TIME <b id="time">45</b> / BEST <b id="best">0</b></div></div><div class="stage"><div class="toast" id="toast"></div><canvas id="game" width="600" height="720" aria-label="Gunner snack collection game"></canvas></div><div class="dpad"><button data-d="0,-1">UP</button><button data-d="-1,0">LEFT</button><button data-d="0,1">DOWN</button><button data-d="1,0">RIGHT</button></div><div class="foot"><span>Arrows / WASD / swipe. Snacks good. Chores bad.</span><a href="/">Back to Lodge</a></div></div><script>
const BFGN_PROGRESS_KEY='bfgn_arcade_progress_v1';
const BFGN_ACH_KEY='bfgn_arcade_achievements_v1';
function bfRead(k,fallback){try{return JSON.parse(localStorage.getItem(k)||'')||fallback}catch{return fallback}}
function bfWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function bfPlay(id){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.plays=(p.plays||0)+1;p.games=p.games||{};p.games[id]=(p.games[id]||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfWin(){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.wins=(p.wins||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfUnlock(id,label){const a=bfRead(BFGN_ACH_KEY,{});if(a[id])return false;a[id]={label,at:Date.now()};bfWrite(BFGN_ACH_KEY,a);const t=document.getElementById('toast');if(t){t.textContent='Achievement: '+label;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}return true}

(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best');const COL=8,ROW=9,S=70,OX=20,OY=45;let state='ready',score=0,time=45,last=performance.now(),best=Number(localStorage.getItem('gunnerSnackBest')||0),moveCooldown=0;const dog={x:3,y:7};let snack={x:2,y:2},chores=[];bestEl.textContent=best;function freeCell(){let x,y;do{x=Math.floor(Math.random()*COL);y=Math.floor(Math.random()*ROW)}while((x===dog.x&&y===dog.y)||chores.some(q=>q.x===x&&q.y===y));return{x,y}}function resetObjects(){snack=freeCell();chores=[];for(let i=0;i<6;i++){const q=freeCell();chores.push(q)}}function start(){state='play';score=0;time=45;dog.x=3;dog.y=7;scoreEl.textContent=0;bfPlay('gunners-snack-attack');resetObjects()}
function move(dx,dy){if(state!=='play'){start();return}if(moveCooldown>0)return;moveCooldown=.07;dog.x=Math.max(0,Math.min(COL-1,dog.x+dx));dog.y=Math.max(0,Math.min(ROW-1,dog.y+dy));if(dog.x===snack.x&&dog.y===snack.y){score++;scoreEl.textContent=score;best=Math.max(best,score);localStorage.setItem('gunnerSnackBest',best);bestEl.textContent=best;if(score>=20)bfUnlock('gunner-snack-attack','Snack Attack');snack=freeCell()}if(chores.some(q=>q.x===dog.x&&q.y===dog.y)){score=Math.max(0,score-1);scoreEl.textContent=score;dog.x=3;dog.y=7}}
addEventListener('keydown',e=>{const d={ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0],ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1]}[e.key];if(d){e.preventDefault();move(...d)}});document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('pointerdown',()=>move(...b.dataset.d.split(',').map(Number))));let sx=0,sy=0;c.addEventListener('pointerdown',e=>{if(state!=='play'){start();return}sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{if(state!=='play')return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy))});
function update(dt){moveCooldown=Math.max(0,moveCooldown-dt);if(state!=='play')return;time-=dt;timeEl.textContent=Math.ceil(Math.max(0,time));if(time<=0)state='over'}
function drawDog(){const x=OX+dog.x*S+S/2,y=OY+dog.y*S+S/2;g.fillStyle='#6a4c37';g.beginPath();g.ellipse(x,y+4,28,20,0,0,Math.PI*2);g.fill();g.beginPath();g.arc(x+6,y-18,19,0,Math.PI*2);g.fill();g.fillStyle='#e58d9a';g.fillRect(x+18,y-8,8,18)}
function draw(){g.fillStyle='#2d3f2a';g.fillRect(0,0,600,720);for(let y=0;y<ROW;y++)for(let x=0;x<COL;x++){g.fillStyle=(x+y)%2?'#42563b':'#394d34';g.fillRect(OX+x*S,OY+y*S,S-3,S-3)}for(const q of chores){const x=OX+q.x*S+S/2,y=OY+q.y*S+S/2;g.strokeStyle='#bf8b53';g.lineWidth=5;g.beginPath();g.moveTo(x-16,y+20);g.lineTo(x+16,y-20);g.stroke();g.fillStyle='#9e4c3f';g.fillRect(x-22,y+14,25,9)}{const x=OX+snack.x*S+S/2,y=OY+snack.y*S+S/2;g.fillStyle='#d9bc78';g.beginPath();g.arc(x-9,y,9,0,Math.PI*2);g.arc(x+9,y,9,0,Math.PI*2);g.fill();g.fillRect(x-9,y-5,18,10)}drawDog();if(state!=='play'){g.fillStyle='#090806df';g.fillRect(0,0,600,720);g.textAlign='center';g.fillStyle='#e8b95c';g.font='800 18px system-ui';g.fillText('GUNNER BONUS',300,250);g.fillStyle='#fff6e6';g.font='950 46px system-ui';g.fillText(state==='over'?'WORK AVOIDED':"GUNNER'S SNACK ATTACK",300,315);g.fillStyle='#e8b95c';g.font='700 21px system-ui';g.fillText(state==='over'?`Snacks collected: ${score}`:'Collect snacks while avoiding actual work.',300,365);g.fillStyle='#d0c1aa';g.font='17px system-ui';g.fillText(state==='over'?'Tap to snack again':'Tap or press a direction to start',300,410)}}function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}resetObjects();requestAnimationFrame(loop)})();
</script><script type="module" src="/phase-w-platform.mjs?v=33"></script></body></html>
