<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>John's Shop Bomber - Black Family Game Night</title><style>
:root{color-scheme:dark;--ink:#fff6e6;--muted:#baa98f;--gold:#e8b95c;--panel:#1b1510;--wood:#2a1b12;--accent:#d4934c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#46301f,#100c09 62%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,600px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.07em;line-height:1.05}.brand small{display:block;font-size:10px;color:var(--gold);letter-spacing:.18em;margin-bottom:3px}.stats{font-size:11px;color:var(--muted);text-align:right}.stats b{color:var(--gold);font-size:18px}.foot{display:flex;justify-content:space-between;align-items:center;gap:9px;margin:7px 4px 0;font-size:11px;color:var(--muted);flex-wrap:wrap}a{color:var(--gold);text-decoration:none}.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-15px);opacity:0;background:#f4d793;color:#20130b;padding:10px 14px;border-radius:999px;font-weight:900;font-size:12px;pointer-events:none;transition:.2s;z-index:4;box-shadow:0 8px 28px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}.stage{position:relative}button{font:inherit}
canvas{display:block;width:100%;aspect-ratio:13/15;background:#21170f;border:1px solid #6d5137;border-radius:18px;box-shadow:0 18px 58px #0009}.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:8px}.dpad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:44px 44px;gap:4px}.dpad button,.charge{border:1px solid #6a5035;background:#2a2018;color:#fff3da;border-radius:12px;font-weight:900;min-height:44px;touch-action:manipulation;font-size:9px}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.charge{justify-self:end;padding:0 14px;background:#9b4f31;font-size:10px}</style><link rel="stylesheet" href="/phase-w-platform.css?v=25"></head><body><div class="wrap"><div class="head"><div class="brand"><small>JOHN</small>JOHN'S SHOP BOMBER</div><div class="stats">SCORE <b id="score">0</b> / LIVES <b id="lives">3</b> / ROOM <b id="room">1</b></div></div><div class="stage"><div class="toast" id="toast"></div><canvas id="game" width="650" height="750" aria-label="John shop blaster maze game"></canvas></div><div class="controls"><div class="dpad"><button class="up" data-d="0,-1">UP</button><button class="left" data-d="-1,0">LEFT</button><button class="down" data-d="0,1">DOWN</button><button class="right" data-d="1,0">RIGHT</button></div><span></span><button class="charge" id="charge">SPARK CHARGE</button></div><div class="foot"><span>Arrows / WASD. Space places a safe spark charge.</span><a href="/">Back to Lodge</a></div></div><script>
const BFGN_PROGRESS_KEY='bfgn_arcade_progress_v1';
const BFGN_ACH_KEY='bfgn_arcade_achievements_v1';
function bfRead(k,fallback){try{return JSON.parse(localStorage.getItem(k)||'')||fallback}catch{return fallback}}
function bfWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function bfPlay(id){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.plays=(p.plays||0)+1;p.games=p.games||{};p.games[id]=(p.games[id]||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfWin(){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.wins=(p.wins||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfUnlock(id,label){const a=bfRead(BFGN_ACH_KEY,{});if(a[id])return false;a[id]={label,at:Date.now()};bfWrite(BFGN_ACH_KEY,a);const t=document.getElementById('toast');if(t){t.textContent='Achievement: '+label;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}return true}

(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),COL=13,ROW=15,S=50,scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),roomEl=document.getElementById('room');let state='ready',score=0,lives=3,room=1,last=performance.now(),grid=[],charges=[],blasts=[],enemies=[],enemyClock=0,inv=0,msg='John fixes the shop. The shop disagrees.';const player={x:1,y:13};const key=(x,y)=>y*COL+x;function solid(x,y){return x<0||y<0||x>=COL||y>=ROW||grid[key(x,y)]===1||grid[key(x,y)]===2||charges.some(b=>b.x===x&&b.y===y)}
function makeRoom(){grid=Array(COL*ROW).fill(0);for(let y=0;y<ROW;y++)for(let x=0;x<COL;x++){if(x===0||y===0||x===COL-1||y===ROW-1||(x%2===0&&y%2===0))grid[key(x,y)]=1;else if(Math.random()<.30)grid[key(x,y)]=2}for(const [x,y] of [[1,13],[1,12],[2,13],[11,1],[10,1],[11,2],[11,13],[10,13],[11,12],[1,1],[1,2],[2,1]])grid[key(x,y)]=0;player.x=1;player.y=13;charges=[];blasts=[];const spots=[[11,1],[11,13],[1,1],[7,1],[11,7]];enemies=spots.slice(0,Math.min(3+Math.floor((room-1)/2),5)).map((e,i)=>({x:e[0],y:e[1],kind:['tire','vac','toolbox'][i%3],dead:false}));inv=1}
function begin(){if(state==='over'){score=0;lives=3;room=1;scoreEl.textContent=0;livesEl.textContent=3;roomEl.textContent=1}state='play';msg='';bfPlay('johns-shop-bomber');makeRoom()}
function move(dx,dy){if(state!=='play'){begin();return}const nx=player.x+dx,ny=player.y+dy;if(!solid(nx,ny)){player.x=nx;player.y=ny}}
function place(){if(state!=='play'){begin();return}if(charges.length>=2||charges.some(b=>b.x===player.x&&b.y===player.y))return;charges.push({x:player.x,y:player.y,t:1.55})}
function explode(b){const cells=[[b.x,b.y]];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])for(let r=1;r<=2;r++){const x=b.x+dx*r,y=b.y+dy*r;if(x<0||y<0||x>=COL||y>=ROW||grid[key(x,y)]===1)break;cells.push([x,y]);if(grid[key(x,y)]===2){grid[key(x,y)]=0;score+=5;scoreEl.textContent=score;break}}for(const [x,y] of cells)blasts.push({x,y,t:.32});for(const e of enemies)if(!e.dead&&cells.some(q=>q[0]===e.x&&q[1]===e.y)){e.dead=true;score+=100;scoreEl.textContent=score}if(cells.some(q=>q[0]===player.x&&q[1]===player.y))hurt()}
function hurt(){if(inv>0)return;lives--;livesEl.textContent=lives;msg='John: I can fix that.';if(lives<=0)state='over';else{player.x=1;player.y=13;inv=1.2}}
function enemyMove(){const dirs=[[1,0],[-1,0],[0,1],[0,-1]];for(const e of enemies){if(e.dead)continue;const ranked=dirs.map(d=>({d,s:Math.abs(player.x-(e.x+d[0]))+Math.abs(player.y-(e.y+d[1]))+Math.random()*3})).sort((a,b)=>a.s-b.s);for(const q of ranked){const nx=e.x+q.d[0],ny=e.y+q.d[1];if(!solid(nx,ny)&&!enemies.some(o=>o!==e&&!o.dead&&o.x===nx&&o.y===ny)){e.x=nx;e.y=ny;break}}if(e.x===player.x&&e.y===player.y)hurt()}}
function update(dt){if(state!=='play')return;inv=Math.max(0,inv-dt);enemyClock+=dt;if(enemyClock>.42){enemyClock=0;enemyMove()}for(const b of charges)b.t-=dt;for(const b of charges.filter(x=>x.t<=0))explode(b);charges=charges.filter(x=>x.t>0);for(const b of blasts)b.t-=dt;blasts=blasts.filter(x=>x.t>0);for(const e of enemies)if(!e.dead&&blasts.some(b=>b.x===e.x&&b.y===e.y)){e.dead=true;score+=100;scoreEl.textContent=score}if(enemies.length&&enemies.every(e=>e.dead)){room++;roomEl.textContent=room;score+=250;scoreEl.textContent=score;if(room>=4)bfUnlock('john-fix-it','John Fix-It');makeRoom()}}
addEventListener('keydown',e=>{const d={ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0],ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1]}[e.key];if(d){e.preventDefault();move(...d)}if(e.code==='Space'){e.preventDefault();place()}});document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('pointerdown',()=>move(...b.dataset.d.split(',').map(Number))));document.getElementById('charge').addEventListener('pointerdown',place);c.addEventListener('pointerdown',()=>{if(state!=='play')begin()});
function drawJohn(x,y){const px=x*S+S/2,py=y*S+S/2;g.save();g.translate(px,py);g.fillStyle='#caa06a';g.beginPath();g.arc(0,-7,12,0,Math.PI*2);g.fill();g.fillStyle='#7b3d32';g.fillRect(-14,5,28,22);g.strokeStyle='#e2c5a0';g.lineWidth=2;for(let q=-10;q<=10;q+=10){g.beginPath();g.moveTo(q,5);g.lineTo(q,27);g.stroke()}g.beginPath();g.moveTo(-14,13);g.lineTo(14,13);g.stroke();g.fillStyle='#34271f';g.fillRect(-12,27,9,13);g.fillRect(3,27,9,13);g.strokeStyle='#d9b15c';g.lineWidth=4;g.beginPath();g.moveTo(15,5);g.lineTo(26,-8);g.stroke();g.beginPath();g.arc(28,-10,5,0,Math.PI*2);g.stroke();g.restore()}
function drawEnemy(e){const px=e.x*S+S/2,py=e.y*S+S/2;g.save();g.translate(px,py);if(e.kind==='tire'){g.strokeStyle='#222';g.lineWidth=10;g.beginPath();g.arc(0,0,14,0,Math.PI*2);g.stroke();g.strokeStyle='#777';g.lineWidth=3;g.stroke()}else if(e.kind==='vac'){g.fillStyle='#5c6a70';g.beginPath();g.roundRect(-15,-18,30,36,8);g.fill();g.strokeStyle='#aaa';g.beginPath();g.moveTo(8,-15);g.quadraticCurveTo(24,-25,22,5);g.stroke()}else{g.fillStyle='#b34f3e';g.fillRect(-18,-13,36,27);g.fillStyle='#d8bd87';g.fillRect(-7,-20,14,7)}g.restore()}
function draw(){g.fillStyle='#23180f';g.fillRect(0,0,c.width,c.height);for(let y=0;y<ROW;y++)for(let x=0;x<COL;x++){const t=grid[key(x,y)],px=x*S,py=y*S;g.strokeStyle='#1a120c';g.strokeRect(px,py,S,S);if(t===1){g.fillStyle='#4b3728';g.fillRect(px+3,py+3,S-6,S-6);g.fillStyle='#755238';g.fillRect(px+8,py+8,S-16,8)}else if(t===2){g.fillStyle='#8d5e32';g.fillRect(px+6,py+6,S-12,S-12);g.strokeStyle='#c18d51';g.strokeRect(px+6,py+6,S-12,S-12);g.beginPath();g.moveTo(px+8,py+8);g.lineTo(px+S-8,py+S-8);g.moveTo(px+S-8,py+8);g.lineTo(px+8,py+S-8);g.stroke()}}for(const b of charges){const px=b.x*S+S/2,py=b.y*S+S/2;g.fillStyle='#45535d';g.beginPath();g.roundRect(px-14,py-14,28,28,6);g.fill();g.strokeStyle=b.t<.5?'#ffb34d':'#e8b95c';g.lineWidth=4;g.strokeRect(px-17,py-17,34,34)}for(const b of blasts){g.fillStyle='#ff9d36';g.globalAlpha=Math.min(1,b.t/.15);g.beginPath();g.arc(b.x*S+S/2,b.y*S+S/2,23,0,Math.PI*2);g.fill();g.globalAlpha=1}if(!(inv>0&&Math.floor(inv*12)%2))drawJohn(player.x,player.y);for(const e of enemies)if(!e.dead)drawEnemy(e);if(state!=='play'){g.fillStyle='#0b0806de';g.fillRect(0,0,c.width,c.height);g.textAlign='center';g.fillStyle='#e8b95c';g.font='800 18px system-ui';g.fillText('JOHN',c.width/2,c.height*.33);g.fillStyle='#f8f1e3';g.font='950 46px system-ui';g.fillText(state==='over'?'SHOP CLOSED':"JOHN'S SHOP BOMBER",c.width/2,c.height*.41);g.fillStyle='#e8b95c';g.font='700 20px system-ui';g.fillText(state==='over'?`Final score ${score}`:'Clear runaway shop junk with safe spark charges.',c.width/2,c.height*.48);g.fillStyle='#cbbdab';g.font='17px system-ui';g.fillText(state==='over'?msg:'Tap or press a direction to start',c.width/2,c.height*.54)}}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}makeRoom();requestAnimationFrame(loop)})();
</script><script type="module" src="/phase-w-platform.mjs?v=25"></script></body></html>
