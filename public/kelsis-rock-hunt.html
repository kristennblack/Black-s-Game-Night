<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Kelsi's Rock Hunt - Black Family Game Night</title><style>
:root{color-scheme:dark;--ink:#fff6e6;--muted:#baa98f;--gold:#e8b95c;--panel:#1b1510;--wood:#2a1b12;--accent:#d4934c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#46301f,#100c09 62%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,600px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.07em;line-height:1.05}.brand small{display:block;font-size:10px;color:var(--gold);letter-spacing:.18em;margin-bottom:3px}.stats{font-size:11px;color:var(--muted);text-align:right}.stats b{color:var(--gold);font-size:18px}.foot{display:flex;justify-content:space-between;align-items:center;gap:9px;margin:7px 4px 0;font-size:11px;color:var(--muted);flex-wrap:wrap}a{color:var(--gold);text-decoration:none}.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-15px);opacity:0;background:#f4d793;color:#20130b;padding:10px 14px;border-radius:999px;font-weight:900;font-size:12px;pointer-events:none;transition:.2s;z-index:4;box-shadow:0 8px 28px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}.stage{position:relative}button{font:inherit}
canvas{display:block;width:100%;aspect-ratio:5/6;background:#35452c;border:1px solid #6a5c3e;border-radius:20px;box-shadow:0 18px 58px #0009;touch-action:manipulation}</style><link rel="stylesheet" href="/phase-w-platform.css?v=25"></head><body><div class="wrap"><div class="head"><div class="brand"><small>KELSI</small>KELSI'S ROCK HUNT</div><div class="stats">ROCKS <b id="score">0</b> / TIME <b id="time">45</b> / BEST <b id="best">0</b></div></div><div class="stage"><div class="toast" id="toast"></div><canvas id="game" width="600" height="720" aria-label="Kelsi rock hunt reaction game"></canvas></div><div class="foot"><span>Tap shiny rocks. Prized rocks are worth 5.</span><a href="/">Back to Lodge</a></div></div><script>
const BFGN_PROGRESS_KEY='bfgn_arcade_progress_v1';
const BFGN_ACH_KEY='bfgn_arcade_achievements_v1';
function bfRead(k,fallback){try{return JSON.parse(localStorage.getItem(k)||'')||fallback}catch{return fallback}}
function bfWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function bfPlay(id){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.plays=(p.plays||0)+1;p.games=p.games||{};p.games[id]=(p.games[id]||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfWin(){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.wins=(p.wins||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfUnlock(id,label){const a=bfRead(BFGN_ACH_KEY,{});if(a[id])return false;a[id]={label,at:Date.now()};bfWrite(BFGN_ACH_KEY,a);const t=document.getElementById('toast');if(t){t.textContent='Achievement: '+label;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}return true}

(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best');let state='ready',score=0,time=45,last=performance.now(),rocks=[],spawn=0,best=Number(localStorage.getItem('kelsiRockBest')||0),total=Number(localStorage.getItem('kelsiRocksTotal')||0);bestEl.textContent=best;function start(){state='play';score=0;time=45;rocks=[];spawn=0;bfPlay('kelsis-rock-hunt')}
function add(){const r=Math.random(),type=r<.12?'prize':r<.7?'shiny':'plain';rocks.push({x:45+Math.random()*510,y:90+Math.random()*555,r:20+Math.random()*12,type,life:2.5+Math.random()*2})}
c.addEventListener('pointerdown',e=>{if(state!=='play'){start();return}const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*720/r.height;let hit=-1;for(let i=rocks.length-1;i>=0;i--)if(Math.hypot(x-rocks[i].x,y-rocks[i].y)<rocks[i].r+10){hit=i;break}if(hit>=0){const z=rocks.splice(hit,1)[0],pts=z.type==='prize'?5:z.type==='shiny'?2:1;score+=pts;total+=pts;localStorage.setItem('kelsiRocksTotal',total);scoreEl.textContent=score;best=Math.max(best,score);localStorage.setItem('kelsiRockBest',best);bestEl.textContent=best;if(total>=25)bfUnlock('rock-princess','Rock Princess')}});
function update(dt){if(state!=='play')return;time-=dt;timeEl.textContent=Math.ceil(Math.max(0,time));spawn-=dt;if(spawn<=0){spawn=.42+Math.random()*.4;add()}for(const r of rocks)r.life-=dt;rocks=rocks.filter(r=>r.life>0);if(time<=0){time=0;state='over'}}
function drawDog(){g.fillStyle='#eee6d4';g.beginPath();g.ellipse(300,665,58,31,0,0,Math.PI*2);g.fill();g.beginPath();g.arc(335,638,27,0,Math.PI*2);g.fill();g.fillStyle='#d9b65b';g.beginPath();g.moveTo(323,616);g.lineTo(333,596);g.lineTo(342,617);g.fill();g.fillStyle='#222';g.beginPath();g.arc(343,636,3,0,Math.PI*2);g.fill();g.fillStyle='#d79ab1';g.fillRect(355,650,9,19)}
function draw(){g.fillStyle='#35452c';g.fillRect(0,0,600,720);for(let i=0;i<70;i++){const x=(i*83)%600,y=50+((i*137)%570);g.fillStyle=i%3?'#6a6658':'#777162';g.beginPath();g.ellipse(x,y,13+(i%7),9+(i%4),.2,0,Math.PI*2);g.fill()}for(const r of rocks){g.save();if(r.type!=='plain'){g.shadowColor=r.type==='prize'?'#ffd76a':'#a7e8ff';g.shadowBlur=r.type==='prize'?28:16}g.fillStyle=r.type==='prize'?'#d6a73e':r.type==='shiny'?'#9ab8c0':'#746e61';g.beginPath();g.ellipse(r.x,r.y,r.r,r.r*.72,.25,0,Math.PI*2);g.fill();if(r.type==='prize'){g.fillStyle='#fff4b8';g.beginPath();g.arc(r.x-7,r.y-6,5,0,Math.PI*2);g.fill()}g.restore()}drawDog();if(state!=='play'){g.fillStyle='#090806dd';g.fillRect(0,0,600,720);g.textAlign='center';g.fillStyle='#e8b95c';g.font='800 18px system-ui';g.fillText('KELSI',300,250);g.fillStyle='#fff6e6';g.font='950 48px system-ui';g.fillText(state==='over'?'ROCK PRINCESS':"KELSI'S ROCK HUNT",300,315);g.fillStyle='#e8b95c';g.font='700 21px system-ui';g.fillText(state==='over'?`Found ${score} points of rocks`:'Find the best rocks before time runs out.',300,365);g.fillStyle='#d0c1aa';g.font='17px system-ui';g.fillText(state==='over'?'Tap to hunt again':'Tap to start',300,410)}}function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();
</script><script type="module" src="/phase-w-platform.mjs?v=25"></script></body></html>
