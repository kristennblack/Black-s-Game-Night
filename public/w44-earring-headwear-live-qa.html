<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W44 Earring + Headwear Live QA</title>
<link rel="stylesheet" href="/styles.css?v=W45-HEADWEAR-SCALE-RECOVERY-63"><link rel="stylesheet" href="/phase-w-platform.css?v=W45-HEADWEAR-SCALE-RECOVERY-63">
<style>
html,body{margin:0;background:#0d0907;color:#f7e4b9;font-family:system-ui,sans-serif}.wrap{max-width:1680px;margin:auto;padding:14px}.bar{position:sticky;top:0;z-index:30;background:#0d0907f2;border-bottom:1px solid #77552f;padding:10px 0}.bar h1{margin:0;font-size:26px}.bar p{margin:5px 0;color:#c7b99d}.switch{display:flex;gap:8px}.switch a{color:#ffe0a0;text-decoration:none;border:1px solid #74512d;border-radius:999px;padding:6px 10px}.switch a.active{background:#5c3b1d}.grid{display:grid;gap:10px;margin-top:12px}.grid.earrings{grid-template-columns:repeat(4,minmax(210px,1fr))}.grid.headwear{grid-template-columns:repeat(3,minmax(230px,1fr))}.card{border:1px solid #6f4f2d;background:#18110d;border-radius:10px;overflow:hidden}.stage{position:relative;aspect-ratio:1;overflow:hidden;background:#241a13}.stage>.avatar-base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.meta{padding:7px 8px;font-size:11px;min-height:50px}.meta b{display:block;font-size:13px;color:#f0ca7b}.ok{color:#9de2a6}.blocked{display:grid;place-items:center;position:absolute;inset:0;background:#331a18aa;color:#ffd2c9;font-weight:900;text-align:center;padding:20px;z-index:20}.point{position:absolute;width:7px;height:7px;border-radius:50%;background:#32f0a0;box-shadow:0 0 0 1px #001,0 0 6px #32f0a0;transform:translate(-50%,-50%);z-index:25}.avatar-cosmetic{position:absolute!important;left:var(--cx)!important;top:var(--cy)!important;width:var(--cw)!important;height:var(--ch,auto)!important;max-width:none!important;object-fit:contain!important;transform:translate(var(--ctx,-50%),var(--cty,-50%)) rotate(var(--cr)) skewX(var(--cskew,0deg)) scale(var(--csx,1),var(--csy,1))!important;transform-origin:50% 50%!important;animation:none!important;filter:drop-shadow(0 2px 3px #000b)!important}.avatar-cosmetic-hat{z-index:12!important}.avatar-cosmetic-earrings{z-index:11!important}@media(max-width:900px){.grid.earrings,.grid.headwear{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><header class="bar"><h1>W44 · ACTUAL LIVE PORTRAIT ANCHOR QA</h1><p>Exact app portrait sources · real shop/card renderer · W44 head + earlobe landmarks · production/3D-derived assets</p><nav class="switch"><a id="earLink" href="?kind=earrings">Earrings</a><a id="hatLink" href="?kind=headwear">Headwear</a></nav></header><main id="grid"></main></div>
<script type="module">
import {COSMETIC_BY_ID,cosmeticOverlayHTML} from './avatar-cosmetics.mjs?v=W45-HEADWEAR-SCALE-RECOVERY-63';
import {portraitStyleAsset,portraitAnchorProfile,portraitEarringFits,portraitHeadwearFit,portraitAnchorDebugPoints} from './portrait-accessory-anchors.mjs?v=W45-HEADWEAR-SCALE-RECOVERY-63';
const people=[['john','John',0],['kristen','Kristen',0],['holly','Holly',0],['vanessa','Vanessa',0],['elizabeth','Elizabeth',0],['logan','Logan',0]];
const earringIds=['wear-jewelry-0032-vanessa-modern-woven-beaded-stud-earrings','wear-jewelry-0036-vanessa-modern-curved-beaded-hoop-earrings','wear-jewelry-0041-retro-closet-woven-plaid-drop-earrings','wear-jewelry-0055-retro-closet-slatted-turquoise-drop-earrings'];
const hatIds=['cowboy-hat','firefighter-helmet','birthday-crown','tiara','legendary-top-hat','mexican-train-cap'];
const params=new URLSearchParams(location.search),kind=params.get('kind')==='headwear'?'headwear':'earrings';
document.querySelector('#earLink').classList.toggle('active',kind==='earrings');document.querySelector('#hatLink').classList.toggle('active',kind==='headwear');
const ids=kind==='headwear'?hatIds:earringIds,grid=document.querySelector('#grid');grid.className='grid '+kind;
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
for(const [avatar,name,variant] of people){for(const id of ids){const item=COSMETIC_BY_ID[id];const eq={[item.slot]:id};const p=portraitAnchorProfile(avatar,variant);let fit=kind==='headwear'?portraitHeadwearFit(avatar,variant,item):portraitEarringFits(avatar,variant,item);const blocked=!fit||fit.blocked;let points=[];if(kind==='headwear'){points=portraitAnchorDebugPoints(avatar,variant).filter(x=>['headTop','headLeft','headRight'].includes(x.name));}else if(!blocked){for(const side of ['left','right']){const f=fit[side];if(f?.landmark)points.push({name:side+'Lobe',x:f.landmark.x,y:f.landmark.y})}}const pointHTML=points.map(q=>`<span class="point" title="${q.name}" style="left:${q.x}%;top:${q.y}%"></span>`).join('');const overlay=blocked?'':cosmeticOverlayHTML(eq,avatar,variant);const reason=blocked?(fit?.reason||'blocked'):(kind==='headwear'?`${fit.anchorMode} · w ${fit.w.toFixed(1)}% · rot ${fit.r.toFixed(1)}°`:`${fit.anchorMode} · ${fit.kind}`);grid.insertAdjacentHTML('beforeend',`<article class="card"><div class="stage avatar-frame"><img class="avatar-base" src="${portraitStyleAsset(avatar,variant)}">${overlay}${pointHTML}${blocked?`<div class="blocked">BLOCKED ON PURPOSE<br><small>${esc(reason)}</small></div>`:''}</div><div class="meta"><b>${name} · ${esc(item?.name||id)}</b><span class="${blocked?'':'ok'}">${esc(reason)}</span><br>${p?.portraitStyleKey||''}</div></article>`);}}
</script></body></html>
