<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Papa's Pipes</title><style>
:root{color-scheme:dark;--ink:#f8f1e2;--muted:#b9aa92;--gold:#e8b95c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#3c3026,#100d0a 62%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,580px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.09em}.stats{font-size:12px;color:var(--muted)}.stats b{color:var(--gold);font-size:18px}canvas{display:block;width:100%;aspect-ratio:1;background:#201812;border:1px solid #6a5038;border-radius:20px;box-shadow:0 18px 58px #0009;touch-action:manipulation}.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 4px 0;font-size:11px;color:var(--muted)}button{min-height:44px;border:1px solid #6b523a;border-radius:11px;background:#2b2119;color:#f7ecd8;font-weight:850;padding:0 14px}a{color:var(--gold);text-decoration:none}</style></head><body><div class="wrap"><div class="head"><div class="brand">PAPA'S PIPES</div><div class="stats">LEVEL <b id="level">1</b> · MOVES <b id="moves">0</b> · TIME <b id="time">0</b></div></div><canvas id="game" width="600" height="600" aria-label="Pipe rotation puzzle"></canvas><div class="foot"><button id="new">NEW PIPE JOB</button><span>Tap a pipe to rotate it · light the whole system</span><a href="/">Back to Lodge</a></div></div><script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),levelEl=document.getElementById('level'),movesEl=document.getElementById('moves'),timeEl=document.getElementById('time');const N=6,S=100,NORTH=1,EAST=2,SOUTH=4,WEST=8,dirs=[[0,-1,NORTH,SOUTH],[1,0,EAST,WEST],[0,1,SOUTH,NORTH],[-1,0,WEST,EAST]];let target=[],tiles=[],level=1,moves=0,start=0,elapsed=0,state='play',lit=new Set();function idx(x,y){return y*N+x}function rot(mask){return ((mask<<1)&15)|((mask>>3)&1)}function makeMaze(){target=Array(N*N).fill(0);const seen=new Set([0]),stack=[[0,0]];while(stack.length){const [x,y]=stack[stack.length-1],opts=[];for(const [dx,dy,a,b] of dirs){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<N&&ny<N&&!seen.has(idx(nx,ny)))opts.push([nx,ny,a,b])}if(!opts.length){stack.pop();continue}const [nx,ny,a,b]=opts[Math.floor(Math.random()*opts.length)];target[idx(x,y)]|=a;target[idx(nx,ny)]|=b;seen.add(idx(nx,ny));stack.push([nx,ny])}tiles=target.map(m=>{let r=m;const turns=Math.floor(Math.random()*4);for(let i=0;i<turns;i++)r=rot(r);return r});moves=0;elapsed=0;start=performance.now();state='play';movesEl.textContent=0;timeEl.textContent=0;trace()}function trace(){lit=new Set([0]);const q=[[0,0]];while(q.length){const [x,y]=q.shift(),m=tiles[idx(x,y)];for(const [dx,dy,a,b] of dirs)if(m&a){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=N||ny>=N)continue;const ni=idx(nx,ny);if(!(tiles[ni]&b)||lit.has(ni))continue;lit.add(ni);q.push([nx,ny])}}if(lit.size===N*N&&state==='play'){state='win';elapsed=Math.floor((performance.now()-start)/1000);setTimeout(()=>{},0)}}function turn(x,y){if(state==='win'){level++;levelEl.textContent=level;makeMaze();return}const i=idx(x,y);tiles[i]=rot(tiles[i]);moves++;movesEl.textContent=moves;trace()}c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*N/r.width),y=Math.floor((e.clientY-r.top)*N/r.height);if(x>=0&&x<N&&y>=0&&y<N)turn(x,y)});document.getElementById('new').addEventListener('click',makeMaze);function path(mask,cx,cy,on){g.lineCap='round';g.lineWidth=20;g.strokeStyle=on?'#f1c75c':'#8b806f';g.shadowColor=on?'#ffb733':'transparent';g.shadowBlur=on?22:0;g.beginPath();for(const [dx,dy,b] of [[0,-1,NORTH],[1,0,EAST],[0,1,SOUTH],[-1,0,WEST]])if(mask&b){g.moveTo(cx,cy);g.lineTo(cx+dx*43,cy+dy*43)}g.stroke();g.shadowBlur=0;g.fillStyle=on?'#fff0a6':'#a89a85';g.beginPath();g.arc(cx,cy,13,0,Math.PI*2);g.fill()}function draw(){if(state==='play'){elapsed=Math.floor((performance.now()-start)/1000);timeEl.textContent=elapsed}g.fillStyle='#211913';g.fillRect(0,0,600,600);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=idx(x,y),px=x*S,py=y*S;g.fillStyle=(x+y)%2?'#3a2c22':'#33261e';g.fillRect(px+2,py+2,S-4,S-4);g.strokeStyle='#5a4433';g.strokeRect(px+2,py+2,S-4,S-4);path(tiles[i],px+50,py+50,lit.has(i));if(i===0){g.fillStyle='#5aa36f';g.beginPath();g.arc(px+22,py+22,12,0,Math.PI*2);g.fill()}if(i===N*N-1){g.fillStyle='#cf674f';g.beginPath();g.arc(px+78,py+78,12,0,Math.PI*2);g.fill()}}if(state==='win'){g.fillStyle='#0a0806dc';g.fillRect(0,0,600,600);g.textAlign='center';g.fillStyle='#f8f1e2';g.font='950 46px system-ui';g.fillText('WATER ON!',300,255);g.fillStyle='#e8b95c';g.font='700 21px system-ui';g.fillText(`${moves} moves · ${elapsed}s`,300,305);g.fillStyle='#d0c1aa';g.font='17px system-ui';g.fillText('Tap any pipe for the next job',300,350)}}function loop(){draw();requestAnimationFrame(loop)}makeMaze();loop()})();
</script></body></html>
