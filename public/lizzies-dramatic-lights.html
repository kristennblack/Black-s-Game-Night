<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Lizzy's Dramatic Lights - Black Family Game Night</title><style>
:root{color-scheme:dark;--ink:#fff6e6;--muted:#baa98f;--gold:#e8b95c;--panel:#1b1510;--wood:#2a1b12;--accent:#d4934c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#46301f,#100c09 62%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,600px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.07em;line-height:1.05}.brand small{display:block;font-size:10px;color:var(--gold);letter-spacing:.18em;margin-bottom:3px}.stats{font-size:11px;color:var(--muted);text-align:right}.stats b{color:var(--gold);font-size:18px}.foot{display:flex;justify-content:space-between;align-items:center;gap:9px;margin:7px 4px 0;font-size:11px;color:var(--muted);flex-wrap:wrap}a{color:var(--gold);text-decoration:none}.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-15px);opacity:0;background:#f4d793;color:#20130b;padding:10px 14px;border-radius:999px;font-weight:900;font-size:12px;pointer-events:none;transition:.2s;z-index:4;box-shadow:0 8px 28px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}.stage{position:relative}button{font:inherit}
canvas{display:block;width:100%;aspect-ratio:1;background:#170d18;border:1px solid #76536f;border-radius:22px;box-shadow:0 18px 58px #0009;touch-action:manipulation}</style><link rel="stylesheet" href="/phase-w-platform.css?v=W45-HEADWEAR-SCALE-RECOVERY-63"></head><body><div class="wrap"><div class="head"><div class="brand"><small>LIZZIE</small>LIZZIE'S DRAMATIC LIGHTS</div><div class="stats">ROUND <b id="round">0</b> / BEST <b id="best">0</b></div></div><div class="stage"><div class="toast" id="toast"></div><canvas id="game" width="600" height="600" aria-label="Lizzy dramatic sequence memory game"></canvas></div><div class="foot"><span>Tap the stage pads in order. Keys 1-4 also work.</span><a href="/">Back to Lodge</a></div></div><script>
const BFGN_PROGRESS_KEY='bfgn_arcade_progress_v1';
const BFGN_ACH_KEY='bfgn_arcade_achievements_v1';
function bfRead(k,fallback){try{return JSON.parse(localStorage.getItem(k)||'')||fallback}catch{return fallback}}
function bfWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function bfPlay(id){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.plays=(p.plays||0)+1;p.games=p.games||{};p.games[id]=(p.games[id]||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfWin(){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.wins=(p.wins||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfUnlock(id,label){const a=bfRead(BFGN_ACH_KEY,{});if(a[id])return false;a[id]={label,at:Date.now()};bfWrite(BFGN_ACH_KEY,a);const t=document.getElementById('toast');if(t){t.textContent='Achievement: '+label;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}return true}
async function bfGrantElizabethLook(itemId,rewardKey){try{const key='bfgn_elizabeth_looks_v1',p=bfRead('gn_profile_v1',{}),local=bfRead(key,{});if(!local[itemId]){local[itemId]={unlockedAt:Date.now(),source:'reward',rewardKey};bfWrite(key,local)}const cache=bfRead('bfgn_arcade_phase_w_v1',{});cache.elizabethLooks=local;bfWrite('bfgn_arcade_phase_w_v1',cache);if(!p.profileId)return;await fetch('/api/arcade/look',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profileId:p.profileId,name:p.name||'Family Player',character:'elizabeth',action:'grant',itemId,rewardKey})})}catch{}}

(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),roundEl=document.getElementById('round'),bestEl=document.getElementById('best');const spots=[{x:180,y:210,col:'#d65470',freq:261.6,label:'SPIN'},{x:420,y:210,col:'#d9a047',freq:329.6,label:'POSE'},{x:180,y:430,col:'#6a78c7',freq:392,label:'TWIRL'},{x:420,y:430,col:'#9f6bc4',freq:523.3,label:'BOW'}];let seq=[],input=0,state='ready',active=-1,best=Number(localStorage.getItem('lizzieLightsBest')||0),audio=null,msg='Obviously, nail the sequence.';bestEl.textContent=best;
function ensureAudio(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}function tone(i,d=.17){ensureAudio();const o=audio.createOscillator(),gain=audio.createGain();o.frequency.value=spots[i].freq;o.type='triangle';gain.gain.setValueAtTime(.001,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.13,audio.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(gain).connect(audio.destination);o.start();o.stop(audio.currentTime+d+.02)}function flash(i,ms=320){active=i;tone(i,ms/1000*.75);setTimeout(()=>{if(active===i)active=-1},ms)}function start(){seq=[];input=0;state='show';bfPlay('lizzies-dramatic-lights');nextRound()}function nextRound(){seq.push(Math.floor(Math.random()*4));roundEl.textContent=seq.length;input=0;state='show';msg=['Again!','Make it dramatic.','Do not ruin the entrance.','Obviously I nailed it.'][Math.floor(Math.random()*4)];let k=0;const delay=Math.max(350,650-seq.length*18);function step(){if(k>=seq.length){state='input';return}flash(seq[k++],Math.max(210,delay*.55));setTimeout(step,delay)}setTimeout(step,480)}function press(i){if(state==='ready'||state==='over'){start();return}if(state!=='input')return;flash(i,180);if(seq[input]!==i){state='over';best=Math.max(best,seq.length-1);localStorage.setItem('lizzieLightsBest',best);bestEl.textContent=best;msg='A tragic performance.';return}input++;if(input===seq.length){best=Math.max(best,seq.length);localStorage.setItem('lizzieLightsBest',best);bestEl.textContent=best;if(seq.length>=5)bfGrantElizabethLook('elizabeth-look-08','lizzy-lights-5');if(seq.length>=10)bfGrantElizabethLook('elizabeth-look-27','lizzy-lights-10');if(seq.length>=15){bfUnlock('drama-queen','Drama Queen');bfGrantElizabethLook('elizabeth-look-30','drama-queen')};state='pause';setTimeout(nextRound,590)}}
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*600/r.height;if(state==='ready'||state==='over'){press(0);return}let bi=-1,dist=1e9;spots.forEach((s,i)=>{const d=Math.hypot(x-s.x,y-s.y);if(d<dist){dist=d;bi=i}});if(dist<98)press(bi)});addEventListener('keydown',e=>{const i=Number(e.key)-1;if(i>=0&&i<4){e.preventDefault();press(i)}if(e.code==='Space'&&(state==='ready'||state==='over')){e.preventDefault();press(0)}});
function draw(){g.fillStyle='#170d18';g.fillRect(0,0,600,600);const stage=g.createRadialGradient(300,300,20,300,300,330);stage.addColorStop(0,'#a33d7b20');stage.addColorStop(1,'#0000');g.fillStyle=stage;g.fillRect(0,0,600,600);g.fillStyle='#3b243c';g.fillRect(70,85,460,455);g.strokeStyle='#a36c9f';g.lineWidth=6;g.strokeRect(70,85,460,455);for(let i=0;i<spots.length;i++){const s=spots[i],on=active===i;g.save();g.shadowColor=s.col;g.shadowBlur=on?52:12;g.fillStyle=on?s.col:'#332d38';g.strokeStyle=on?'#fff0d0':s.col;g.lineWidth=5;g.beginPath();g.arc(s.x,s.y,82,0,Math.PI*2);g.fill();g.stroke();g.fillStyle=on?'#fff':'#d6c4d4';g.textAlign='center';g.font='950 20px system-ui';g.fillText(s.label,s.x,s.y+7);g.restore()}g.fillStyle='#d9a7bc';g.beginPath();g.arc(300,316,18,0,Math.PI*2);g.fill();g.strokeStyle='#d9a7bc';g.lineWidth=7;g.beginPath();g.moveTo(300,335);g.lineTo(300,380);g.moveTo(300,347);g.lineTo(270,365);g.moveTo(300,347);g.lineTo(330,365);g.moveTo(300,380);g.lineTo(278,416);g.moveTo(300,380);g.lineTo(322,416);g.stroke();if(state==='ready'||state==='over'){g.fillStyle='#090609df';g.fillRect(0,0,600,600);g.textAlign='center';g.fillStyle='#e8b95c';g.font='800 18px system-ui';g.fillText('LIZZIE',300,180);g.fillStyle='#fff6e8';g.font='950 43px system-ui';g.fillText(state==='over'?'A TRAGIC PERFORMANCE':"LIZZIE'S DRAMATIC LIGHTS",300,245);g.fillStyle='#e8b95c';g.font='700 20px system-ui';g.fillText(state==='over'?`Reached round ${Math.max(0,seq.length-1)}`:'Watch the stage. Copy every dramatic cue.',300,300);g.fillStyle='#d0c1cf';g.font='17px system-ui';g.fillText(state==='over'?msg:'Tap / Space to begin',300,345)}}function loop(){draw();requestAnimationFrame(loop)}loop()})();
</script><script type="module" src="/phase-w-platform.mjs?v=W45-HEADWEAR-SCALE-RECOVERY-63"></script></body></html>
