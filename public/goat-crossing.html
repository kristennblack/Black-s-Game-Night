<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Goat Crossing</title><style>
:root{color-scheme:dark;--ink:#f6f3e7;--muted:#b9b29f;--gold:#e8b95c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(#102216,#0d0b08);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,560px)}.head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.09em}.stats{font-size:12px;color:var(--muted)}.stats b{color:var(--gold);font-size:19px}canvas{display:block;width:100%;aspect-ratio:3/5;background:#17371f;border:1px solid #5d5131;border-radius:20px;box-shadow:0 18px 58px #0009;touch-action:none}.foot{display:flex;justify-content:space-between;gap:10px;margin:7px 5px 0;font-size:11px;color:var(--muted)}a{color:var(--gold);text-decoration:none}</style></head><body><div class="wrap"><div class="head"><div class="brand">GOAT CROSSING</div><div class="stats">SCORE <b id="score">0</b> · LIVES <b id="lives">3</b> · LEVEL <b id="level">1</b></div></div><canvas id="game" width="600" height="1000" aria-label="Goat crossing arcade game"></canvas><div class="foot"><span>Arrows / WASD · swipe on phone · reach the hay</span><a href="/">Back to Lodge</a></div></div><script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),W=c.width,H=c.height,scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),levelEl=document.getElementById('level');const laneH=100;let state='ready',score=0,lives=3,level=1,last=performance.now(),inv=0,startX=300,startY=930;const goat={x:startX,y:startY,r:23};let movers=[];const lanes=[{type:'goal',y:50},{type:'grass',y:150},{type:'water',y:250,dir:1,spd:78},{type:'water',y:350,dir:-1,spd:92},{type:'grass',y:450},{type:'road',y:550,dir:1,spd:120},{type:'road',y:650,dir:-1,spd:150},{type:'road',y:750,dir:1,spd:175},{type:'road',y:850,dir:-1,spd:112},{type:'start',y:950}];function rebuild(){movers=[];for(const l of lanes){if(l.type==='road'){for(let i=0;i<4;i++){movers.push({type:'car',lane:l,x:i*190+(Math.random()*40),y:l.y,w:86,h:48,dir:l.dir,spd:l.spd*(1+.13*(level-1))})}}if(l.type==='water'){for(let i=0;i<3;i++){movers.push({type:'log',lane:l,x:i*230+Math.random()*60,y:l.y,w:145,h:42,dir:l.dir,spd:l.spd*(1+.1*(level-1))})}}}}function resetGoat(){goat.x=startX;goat.y=startY;inv=.8}function begin(){if(state==='over'){score=0;lives=3;level=1;scoreEl.textContent=0;livesEl.textContent=3;levelEl.textContent=1}state='play';rebuild();resetGoat()}function move(dx,dy){if(state!=='play'){begin();return}goat.x=Math.max(30,Math.min(W-30,goat.x+dx*60));goat.y=Math.max(50,Math.min(950,goat.y+dy*100))}addEventListener('keydown',e=>{const m={ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0],ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1]}[e.key];if(m){e.preventDefault();move(...m)}if(e.code==='Space'&&state!=='play')begin()});let sx=0,sy=0;c.addEventListener('pointerdown',e=>{if(state!=='play'){begin();return}sx=e.clientX;sy=e.clientY;c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointerup',e=>{if(state!=='play')return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)<18&&Math.abs(dy)<18){move(0,-1);return}Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy))});function laneAt(y){return lanes.reduce((a,b)=>Math.abs(b.y-y)<Math.abs(a.y-y)?b:a,lanes[0])}function hitRect(o){return Math.abs(goat.x-o.x)<o.w/2+goat.r*.72&&Math.abs(goat.y-o.y)<o.h/2+goat.r*.72}function lose(){if(inv>0)return;lives--;livesEl.textContent=lives;if(lives<=0){state='over'}else resetGoat()}function update(dt){if(state!=='play')return;inv=Math.max(0,inv-dt);for(const o of movers){o.x+=o.spd*o.dir*dt;if(o.dir>0&&o.x-o.w/2>W+30)o.x=-o.w/2-30;if(o.dir<0&&o.x+o.w/2<-30)o.x=W+o.w/2+30}const lane=laneAt(goat.y);if(lane.type==='road'){for(const o of movers)if(o.lane===lane&&o.type==='car'&&hitRect(o)){lose();break}}if(lane.type==='water'){let log=null;for(const o of movers)if(o.lane===lane&&o.type==='log'&&hitRect(o)){log=o;break}if(log){goat.x+=log.spd*log.dir*dt;if(goat.x<15||goat.x>W-15)lose()}else lose()}if(goat.y<=70&&state==='play'){score+=100*level;level++;scoreEl.textContent=score;levelEl.textContent=level;rebuild();resetGoat()}}function drawGoat(){if(inv>0&&Math.floor(inv*12)%2)return;g.save();g.translate(goat.x,goat.y);g.fillStyle='#f3efe3';g.strokeStyle='#6a5846';g.lineWidth=3;g.beginPath();g.ellipse(0,6,26,18,0,0,Math.PI*2);g.fill();g.stroke();g.beginPath();g.arc(0,-18,17,0,Math.PI*2);g.fill();g.stroke();g.fillStyle='#8a745c';g.beginPath();g.moveTo(-9,-33);g.lineTo(-18,-48);g.lineTo(-6,-37);g.moveTo(9,-33);g.lineTo(18,-48);g.lineTo(6,-37);g.stroke();g.fillStyle='#201913';g.beginPath();g.arc(-6,-21,2.5,0,Math.PI*2);g.arc(6,-21,2.5,0,Math.PI*2);g.fill();g.restore()}function draw(){g.fillStyle='#254f2e';g.fillRect(0,0,W,H);for(const l of lanes){const top=l.y-laneH/2;if(l.type==='road'){g.fillStyle='#292c2b';g.fillRect(0,top,W,laneH);g.strokeStyle='#d9b35f';g.setLineDash([28,28]);g.beginPath();g.moveTo(0,l.y);g.lineTo(W,l.y);g.stroke();g.setLineDash([])}else if(l.type==='water'){g.fillStyle='#20516c';g.fillRect(0,top,W,laneH);for(let x=0;x<W;x+=80){g.strokeStyle='#ffffff24';g.beginPath();g.arc(x+20,l.y+12,25,Math.PI,Math.PI*2);g.stroke()}}else if(l.type==='goal'){g.fillStyle='#3f6c32';g.fillRect(0,top,W,laneH);g.fillStyle='#d8b256';for(let x=55;x<W;x+=120){g.beginPath();g.moveTo(x-28,l.y+30);g.lineTo(x,l.y-26);g.lineTo(x+28,l.y+30);g.closePath();g.fill()}}else{g.fillStyle=l.type==='start'?'#365a2f':'#3d6935';g.fillRect(0,top,W,laneH)}}for(const o of movers){if(o.type==='car'){g.fillStyle=o.dir>0?'#b14f3e':'#536d9a';g.beginPath();g.roundRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h,12);g.fill();g.fillStyle='#dce7e8';g.fillRect(o.x-22,o.y-o.h/2+7,44,11);g.fillStyle='#161616';g.beginPath();g.arc(o.x-o.w*.3,o.y+o.h/2,9,0,Math.PI*2);g.arc(o.x+o.w*.3,o.y+o.h/2,9,0,Math.PI*2);g.fill()}else{g.fillStyle='#6e4326';g.strokeStyle='#a6784f';g.lineWidth=3;g.beginPath();g.roundRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h,20);g.fill();g.stroke();g.fillStyle='#4d2f1c';for(let k=-1;k<=1;k++){g.beginPath();g.arc(o.x+k*45,o.y,8,0,Math.PI*2);g.stroke()}}}drawGoat();if(state!=='play'){g.fillStyle='#0c1009d8';g.fillRect(0,0,W,H);g.textAlign='center';g.fillStyle='#f6f3e7';g.font='950 50px system-ui';g.fillText(state==='over'?'GOAT DOWN!':'GOAT CROSSING',W/2,H*.40);g.fillStyle='#e8b95c';g.font='700 22px system-ui';g.fillText(state==='over'?`Final score ${score}`:'Get the little goat to the hay',W/2,H*.47);g.fillStyle='#d0c7b5';g.font='18px system-ui';g.fillText(state==='over'?'Tap / Space to restart':'Tap / press a direction to start',W/2,H*.54)}}function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}rebuild();requestAnimationFrame(loop)})();
</script></body></html>
