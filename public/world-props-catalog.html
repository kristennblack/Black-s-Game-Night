<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Props Catalog · Black Family Game Night</title><style>
:root{--bg:#0e0b08;--panel:#1c140e;--line:#7f6039;--gold:#e3bd70;--ink:#f4e5c5;--muted:#baa98b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2c2118,#0d0907 60%);color:var(--ink);font-family:system-ui,sans-serif}.wrap{max-width:1500px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top h1{font-family:Georgia,serif;margin:0}.top a{color:#fff0c7;text-decoration:none;border:1px solid var(--line);padding:10px 13px;border-radius:10px;background:#2a1e14}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px;margin:16px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:#17100c}.filters input,.filters select{width:100%;padding:10px;border-radius:9px;border:1px solid #6e5231;background:#0e0a07;color:#f8eac8}.meta{color:var(--gold);font-weight:800;margin:7px 0 13px}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.card{background:linear-gradient(180deg,#24180f,#130d09);border:1px solid #6d4f2d;border-radius:13px;overflow:hidden}.card img{display:block;width:100%;aspect-ratio:1.06;object-fit:contain;background:#0c0907}.copy{padding:8px}.copy b{display:block;font-family:Georgia,serif;font-size:.83rem}.copy small{display:block;color:var(--muted);font-size:.65rem;margin-top:3px}.tags{font-size:.58rem;color:#d8b66d;margin-top:5px}.flag{display:inline-block;margin-top:5px;border-radius:999px;padding:3px 6px;background:#664f25;color:#ffe5a5;font-size:.55rem;font-weight:900}.pager{display:flex;gap:8px;justify-content:center;margin:18px}.pager button{padding:10px 17px;border:1px solid #9a7341;border-radius:9px;background:#2f2116;color:#ffe7b3;font-weight:900}@media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.top h1{font-size:1.4rem}}
</style></head><body><main class="wrap"><header class="top"><div><small>W21 · SHARED 3D WORLD LIBRARY</small><h1>2,000 World Props</h1></div><div><a href="/">Lodge</a> <a href="/cabin.html">Cabin</a></div></header><section class="filters"><input id="q" placeholder="Search prop, collection, tag…"><select id="cat"></select><select id="map"></select><select id="rar"></select></section><div id="meta" class="meta"></div><section id="grid" class="grid"></section><div class="pager"><button id="prev">← Previous</button><button id="next">Next →</button></div></main><script type="module">
import {WORLD_PROP_CATALOG} from '/world-prop-catalog.mjs';
const $=s=>document.querySelector(s),q=$('#q'),cat=$('#cat'),map=$('#map'),rar=$('#rar'),grid=$('#grid'),meta=$('#meta');let page=0;const PAGE=72,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fill=(el,label,vals)=>el.innerHTML=`<option value="">${label}</option>`+[...new Set(vals)].sort().map(x=>`<option>${esc(x)}</option>`).join('');fill(cat,'All categories',WORLD_PROP_CATALOG.map(x=>x.Category));fill(map,'All maps',WORLD_PROP_CATALOG.map(x=>x['Primary Map']));fill(rar,'All rarity',WORLD_PROP_CATALOG.map(x=>x.Rarity));
function filtered(){const needle=q.value.trim().toLowerCase();return WORLD_PROP_CATALOG.filter(x=>(!cat.value||x.Category===cat.value)&&(!map.value||x['Primary Map']===map.value)&&(!rar.value||x.Rarity===rar.value)&&(!needle||`${x['Prop Name']} ${x.Collection} ${x.Tags} ${x.Subcategory}`.toLowerCase().includes(needle)))}
function draw(){const a=filtered(),pages=Math.max(1,Math.ceil(a.length/PAGE));page=Math.min(page,pages-1);const b=a.slice(page*PAGE,(page+1)*PAGE);meta.textContent=`${a.length.toLocaleString()} matching props · page ${page+1}/${pages} · ${WORLD_PROP_CATALOG.filter(x=>x.Flagship==='Yes').length} flagship art-review concepts`;grid.innerHTML=b.map(x=>`<article class="card"><img loading="lazy" src="${x['Art Path']}" alt="${esc(x['Prop Name'])}"><div class="copy"><b>${esc(x['Prop Name'])}</b><small>${esc(x.Category)} · ${esc(x.Collection)}</small><small>${esc(x['Primary Map'])}</small><div class="tags">${esc(x.Tags)}</div>${x.Flagship==='Yes'?`<span class="flag">FLAGSHIP ${esc(x['Preview Batch'])}</span>`:''}</div></article>`).join('');$('#prev').disabled=page<=0;$('#next').disabled=page>=pages-1}
for(const el of [q,cat,map,rar])el.addEventListener(el===q?'input':'change',()=>{page=0;draw()});$('#prev').onclick=()=>{page=Math.max(0,page-1);draw()};$('#next').onclick=()=>{page++;draw()};draw();
</script></body></html>
