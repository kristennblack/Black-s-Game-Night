<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Birthday Challenge - Black Family Game Night</title><style>body{margin:0;background:radial-gradient(circle at 50% -10%,#6b3c56,#21130f 55%,#0e0b09);color:#fff5df;font-family:system-ui;padding:18px}.wrap{max-width:860px;margin:auto}.card{background:#1b1410e8;border:1px solid #a07156;border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 14px 36px #0007}.hero{text-align:center}.hero img{width:116px;height:116px;border-radius:50%;object-fit:cover;border:4px solid #f0ca76}.messages{display:grid;gap:9px}.msg{display:flex;gap:10px;align-items:center;background:#2c2019;border-radius:16px;padding:10px}.msg img{width:46px;height:46px;border-radius:50%;object-fit:cover}.challenge{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.challenge button{min-height:60px;border:1px solid #967148;border-radius:14px;background:#3b291d;color:#ffe9b5;font-weight:900}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.memory{background:#2b211a;border-radius:14px;padding:10px}.memory img{width:100%;max-height:220px;object-fit:cover;border-radius:10px}input,textarea{width:100%;box-sizing:border-box;border:1px solid #75583c;border-radius:12px;background:#120e0b;color:#fff;padding:10px;margin:5px 0}button{cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button,a.btn{border:1px solid #95704b;border-radius:12px;background:#3d2a1c;color:#ffe8b5;font-weight:900;padding:11px 14px;text-decoration:none}@media(max-width:620px){.challenge{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="card hero"><small>BIRTHDAY EVENT</small><img id="heroImg"><h1 id="title"></h1><p id="count"></p><div class="actions" style="justify-content:center"><button id="play">START BIRTHDAY CHALLENGE</button><a class="btn" href="/">Back to Lodge</a></div></section><section class="card"><h2>Birthday Messages</h2><div class="messages" id="messages"></div></section><section class="card" id="challengeCard" hidden><h2 id="challengeTitle">Birthday Challenge</h2><p>Find the birthday star three times. It moves faster every round.</p><div class="challenge" id="challenge"></div><p id="result"></p></section><section class="card"><h2>Photo + Memory Gallery</h2><p>Only memories your family adds appear here.</p><input id="photo" type="file" accept="image/*"><textarea id="caption" placeholder="Add a short caption or memory"></textarea><button id="add">Add Memory</button><div class="gallery" id="gallery"></div></section></main><script>const people={james:['James',2,2],logan:['Logan',3,17],holly:['Holly',3,28],dorothy:['Dorothy',4,6],kristen:['Kristen',4,15],papa:['Papa',7,19],nana:['Nana',8,18],elizabeth:['Lizzy',8,27],john:['John',9,28],vanessa:['Vanessa',10,6]};const q=new URL(location.href).searchParams,person=q.get('person')||'john',info=people[person]||people.john;heroImg.src=`/avatars/styles/${person==='john'?'john-look-02':person+'-cute'}.jpg`;title.textContent=`${info[0]}'s Birthday Challenge`;const now=new Date(),d=new Date(now.getFullYear(),info[1]-1,info[2],12),days=Math.round((d-now)/86400000);count.textContent=days>0?`${days} day${days===1?'':'s'} until the birthday`:days===0?'HAPPY BIRTHDAY!':`${Math.abs(days)} day${Math.abs(days)===1?'':'s'} into birthday week`;const family=['john','kristen','james','dorothy','vanessa','elizabeth','logan','holly','papa','nana','kelsi','molly','gunner'].filter(x=>x!==person);const lines={nana:"Have a good birthday. And behave yourself.",papa:'Happy birthday. I fixed nothing for this message.',john:'Happy birthday. We are doing this properly.',vanessa:'Happy birthday. Try not to make it weird.',elizabeth:'This birthday deserves a full production.',logan:'Happy birthday. Yes, I showed up.',holly:'Happy birthday! I hope it is the best day.',kristen:'Happy birthday. The whole game night is yours today.',james:'Happy birthday. Have a good one.',dorothy:'Happy birthday. Save me some cake.'};messages.innerHTML=family.map(x=>`<div class="msg"><img src="/avatars/styles/${x==='john'?'john-look-02':x+'-cute'}.jpg"><div><b>${x[0].toUpperCase()+x.slice(1)}</b><div>${lines[x]||(['kelsi','molly','gunner'].includes(x)?'🐾 Birthday dog reaction activated.':'Happy birthday!')}</div></div></div>`).join('');let hits=0;function renderChallenge(){challenge.innerHTML='';for(let i=0;i<6;i++){const b=document.createElement('button');b.textContent='?';b.onclick=()=>{if(Number(b.dataset.win)){hits++;b.textContent='★';result.textContent=`${hits}/3 birthday stars found`;if(hits>=3){result.textContent='Birthday challenge complete! Permanent birthday badge unlocked.';localStorage.setItem(`bfgn_bday_${person}_${new Date().getFullYear()}`,'complete')}else setTimeout(renderChallenge,350)}else{b.textContent='NOPE';setTimeout(renderChallenge,350)}};challenge.append(b)}challenge.children[Math.floor(Math.random()*6)].dataset.win='1'}play.onclick=()=>{challengeCard.hidden=false;renderChallenge();challengeCard.scrollIntoView({behavior:'smooth'})};const gkey=`bfgn_memories_${person}`;let memories=JSON.parse(localStorage.getItem(gkey)||'[]');function drawGallery(){gallery.innerHTML=memories.map(m=>`<article class="memory">${m.image?`<img src="${m.image}">`:''}<b>${m.year||''}</b><p>${m.caption||''}</p></article>`).join('')||'<p>No memories added yet.</p>'}add.onclick=()=>{const f=photo.files[0],finish=image=>{const cap=caption.value.trim();if(!cap&&!image)return;memories.unshift({image,caption:cap,year:new Date().getFullYear(),at:Date.now()});localStorage.setItem(gkey,JSON.stringify(memories.slice(0,40)));caption.value='';photo.value='';drawGallery()};if(f){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish('')};drawGallery();</script>
<style>
.birthday-greeting-overlay{position:fixed;inset:0;z-index:9999;background:rgba(10,8,6,.92);display:grid;place-items:center;padding:20px}.birthday-greeting-card{width:min(92vw,540px);padding:24px;border-radius:24px;background:linear-gradient(145deg,#3b2417,#15100d);border:1px solid #d8aa63;box-shadow:0 24px 80px #000a;text-align:center}.birthday-greeting-card img{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid #e6bc78}.birthday-greeting-card h2{margin:12px 0 8px}.birthday-greeting-card p{min-height:3em;line-height:1.45}.birthday-greeting-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.birthday-greeting-actions button{padding:10px 16px;border-radius:999px;border:1px solid #d8aa63;background:#2b1b12;color:#fff6e5;font-weight:800}.birthday-replay{margin-top:10px}
</style>
<script type="module" data-birthday-greeting-overlay>
(()=>{
 const q=new URLSearchParams(location.search),person=(q.get('person')||'').toLowerCase(); if(!person)return;
 const year=new Date().getFullYear(),key=`bfgn_birthday_greeting_seen_${person}_${year}`;
 const names=['james','logan','holly','dorothy','kristen','papa','nana','elizabeth','john','vanessa'];
 const label={james:'James',logan:'Logan',holly:'Holly',dorothy:'Dorothy',kristen:'Kristen',papa:'Papa',nana:'Nana',elizabeth:'Lizzy',john:'John',vanessa:'Vanessa'};
 const lines={james:'Quiet birthday approval. That is basically a standing ovation from James.',logan:'Happy birthday. Yes, I showed up. No, do not make it weird.',holly:'Happy birthday! I picked the cutest possible birthday energy.',dorothy:'Happy birthday. The garden can wait five minutes.',kristen:'Happy birthday! Today somebody else can organize the chaos.',papa:'Happy birthday. I checked it twice. It is probably fixed.',nana:"Happy birthday. Getting older is not a sin. Probably.",elizabeth:'Happy birthday! This entrance needed more drama.',john:'Happy birthday. I brought tools in case the cake needs repairs.',vanessa:'Happy birthday. Obviously this message is the best one.'};
 const order=names.filter(n=>n!==person); let i=0;
 function show(force=false){if(!force&&localStorage.getItem(key))return; const ov=document.createElement('div');ov.className='birthday-greeting-overlay';ov.innerHTML='<div class="birthday-greeting-card"><img alt="Family character"><h2></h2><p></p><div class="birthday-greeting-actions"><button data-next>Next</button><button data-skip>Skip</button></div></div>';document.body.append(ov);const img=ov.querySelector('img'),h=ov.querySelector('h2'),txt=ov.querySelector('p');function paint(){const n=order[i];img.src=`/avatars/styles/${n==='john'?'john-look-02':n+'-cute'}.jpg`;h.textContent=label[n]||n;txt.textContent=lines[n]||'Happy birthday!';ov.querySelector('[data-next]').textContent=i===order.length-1?'Finish':'Next'}paint();ov.querySelector('[data-next]').onclick=()=>{if(i<order.length-1){i++;paint()}else{localStorage.setItem(key,'1');ov.remove()}};ov.querySelector('[data-skip]').onclick=()=>{localStorage.setItem(key,'1');ov.remove()}}
 window.addEventListener('load',()=>show(false),{once:true});
 const b=document.createElement('button');b.className='birthday-replay';b.textContent='Replay family birthday messages';b.onclick=()=>{i=0;show(true)};document.querySelector('main,.wrap,.shell')?.append(b);
})();
</script>
</body></html>
