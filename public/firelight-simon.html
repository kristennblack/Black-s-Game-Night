<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Firelight Simon</title><style>
:root{color-scheme:dark;--ink:#fff6e4;--muted:#b9aa92;--gold:#e8b95c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 10%,#4a2518,#100c09 62%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,560px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.09em}.stats{font-size:12px;color:var(--muted)}.stats b{color:var(--gold);font-size:19px}canvas{display:block;width:100%;aspect-ratio:1;background:#170f0b;border:1px solid #65452f;border-radius:22px;box-shadow:0 18px 58px #0009;touch-action:manipulation}.foot{display:flex;justify-content:space-between;gap:10px;margin:7px 4px 0;font-size:11px;color:var(--muted)}a{color:var(--gold);text-decoration:none}</style></head><body><div class="wrap"><div class="head"><div class="brand">FIRELIGHT SIMON</div><div class="stats">ROUND <b id="round">0</b> · BEST <b id="best">0</b></div></div><canvas id="game" width="600" height="600" aria-label="Firelight memory sequence game"></canvas><div class="foot"><span>Tap the glowing stones in order · keys 1–4 also work</span><a href="/">Back to Lodge</a></div></div><script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),roundEl=document.getElementById('round'),bestEl=document.getElementById('best');const spots=[{x:190,y:200,col:'#c44c3d',freq:261.6,label:'1'},{x:410,y:200,col:'#d59a3c',freq:329.6,label:'2'},{x:190,y:420,col:'#4d8f70',freq:392,label:'3'},{x:410,y:420,col:'#567ca8',freq:523.3,label:'4'}];let seq=[],input=0,state='ready',active=-1,best=Number(localStorage.getItem('firelightSimonBest')||0),audio=null;bestEl.textContent=best;function ensureAudio(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}function tone(i,d=.17){ensureAudio();const o=audio.createOscillator(),gain=audio.createGain();o.frequency.value=spots[i].freq;o.type='sine';gain.gain.setValueAtTime(.001,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.13,audio.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(gain).connect(audio.destination);o.start();o.stop(audio.currentTime+d+.02)}function flash(i,ms=320){active=i;tone(i,ms/1000*.75);setTimeout(()=>{if(active===i)active=-1},ms)}function start(){seq=[];input=0;state='show';nextRound()}function nextRound(){seq.push(Math.floor(Math.random()*4));roundEl.textContent=seq.length;input=0;state='show';let k=0;const delay=Math.max(360,650-seq.length*18);function step(){if(k>=seq.length){state='input';return}flash(seq[k++],Math.max(220,delay*.55));setTimeout(step,delay)}setTimeout(step,500)}function press(i){if(state==='ready'||state==='over'){start();return}if(state!=='input')return;flash(i,180);if(seq[input]!==i){state='over';best=Math.max(best,seq.length-1);localStorage.setItem('firelightSimonBest',best);bestEl.textContent=best;return}input++;if(input===seq.length){best=Math.max(best,seq.length);localStorage.setItem('firelightSimonBest',best);bestEl.textContent=best;state='pause';setTimeout(nextRound,620)}}c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*600/r.height;if(state==='ready'||state==='over'){press(0);return}let bestI=-1,dist=1e9;spots.forEach((s,i)=>{const d=Math.hypot(x-s.x,y-s.y);if(d<dist){dist=d;bestI=i}});if(dist<95)press(bestI)});addEventListener('keydown',e=>{const i=Number(e.key)-1;if(i>=0&&i<4){e.preventDefault();press(i)}if(e.code==='Space'&&(state==='ready'||state==='over')){e.preventDefault();press(0)}});function draw(){g.fillStyle='#170f0b';g.fillRect(0,0,600,600);const fire=g.createRadialGradient(300,310,20,300,310,260);fire.addColorStop(0,'#ff8d3b35');fire.addColorStop(1,'#ff8d3b00');g.fillStyle=fire;g.fillRect(0,0,600,600);g.fillStyle='#6d3d22';g.save();g.translate(300,310);g.rotate(.62);g.fillRect(-65,-9,130,18);g.rotate(-1.24);g.fillRect(-65,-9,130,18);g.restore();for(let i=0;i<spots.length;i++){const s=spots[i],on=active===i;g.save();g.shadowColor=s.col;g.shadowBlur=on?48:8;g.fillStyle=on?s.col:'#3b342f';g.strokeStyle=on?'#fff0c7':s.col;g.lineWidth=5;g.beginPath();g.arc(s.x,s.y,78,0,Math.PI*2);g.fill();g.stroke();g.fillStyle=on?'#fff7e7':'#c9b99e';g.textAlign='center';g.font='950 34px system-ui';g.fillText(s.label,s.x,s.y+12);g.restore()}g.fillStyle='#ff9f43';g.beginPath();g.moveTo(300,260);g.bezierCurveTo(245,335,282,390,300,405);g.bezierCurveTo(348,358,350,312,300,260);g.fill();g.fillStyle='#ffd065';g.beginPath();g.moveTo(300,300);g.bezierCurveTo(278,340,294,370,302,380);g.bezierCurveTo(328,350,325,324,300,300);g.fill();if(state==='ready'||state==='over'){g.fillStyle='#090604d9';g.fillRect(0,0,600,600);g.textAlign='center';g.fillStyle='#fff6e4';g.font='950 46px system-ui';g.fillText(state==='over'?'SEQUENCE LOST':'FIRELIGHT SIMON',300,250);g.fillStyle='#e8b95c';g.font='700 21px system-ui';g.fillText(state==='over'?`Reached round ${Math.max(0,seq.length-1)}`:'Watch the stones, then copy them',300,305);g.fillStyle='#d0c1aa';g.font='17px system-ui';g.fillText(state==='over'?'Tap / Space to try again':'Tap / Space to start',300,350)}}function loop(){draw();requestAnimationFrame(loop)}loop()})();
</script></body></html>
