<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Holly's Memory Mayhem - Black Family Game Night</title><style>
:root{color-scheme:dark;--ink:#fff6e6;--muted:#baa98f;--gold:#e8b95c;--panel:#1b1510;--wood:#2a1b12;--accent:#d4934c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#46301f,#100c09 62%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,600px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.07em;line-height:1.05}.brand small{display:block;font-size:10px;color:var(--gold);letter-spacing:.18em;margin-bottom:3px}.stats{font-size:11px;color:var(--muted);text-align:right}.stats b{color:var(--gold);font-size:18px}.foot{display:flex;justify-content:space-between;align-items:center;gap:9px;margin:7px 4px 0;font-size:11px;color:var(--muted);flex-wrap:wrap}a{color:var(--gold);text-decoration:none}.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-15px);opacity:0;background:#f4d793;color:#20130b;padding:10px 14px;border-radius:999px;font-weight:900;font-size:12px;pointer-events:none;transition:.2s;z-index:4;box-shadow:0 8px 28px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}.stage{position:relative}button{font:inherit}
canvas{display:block;width:100%;aspect-ratio:1;background:#201712;border:1px solid #76576d;border-radius:20px;box-shadow:0 18px 58px #0009;touch-action:manipulation}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}.row button{min-height:42px;border:1px solid #76576d;border-radius:11px;background:#2f202a;color:#f7ecda;font-weight:850;padding:0 11px}.modes{display:flex;gap:5px}.modes button.active{background:#8b5f79;color:#fff}</style></head><body><div class="wrap"><div class="head"><div class="brand"><small>HOLLY</small>HOLLY'S MEMORY MAYHEM</div><div class="stats">MOVES <b id="moves">0</b> / TIME <b id="time">0</b> / BEST <b id="best">--</b></div></div><div class="stage"><div class="toast" id="toast"></div><canvas id="game" width="600" height="600" aria-label="Holly memory matching game"></canvas></div><div class="row"><div class="modes"><button data-mode="easy">EASY</button><button data-mode="medium" class="active">MEDIUM</button><button data-mode="hard">HARD</button></div><button id="new">RESHUFFLE</button></div><div class="foot"><span>Match Holly favorites: squishies, dogs, hoodies and treats.</span><a href="/">Back to Lodge</a></div></div><script>
const BFGN_PROGRESS_KEY='bfgn_arcade_progress_v1';
const BFGN_ACH_KEY='bfgn_arcade_achievements_v1';
function bfRead(k,fallback){try{return JSON.parse(localStorage.getItem(k)||'')||fallback}catch{return fallback}}
function bfWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function bfPlay(id){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.plays=(p.plays||0)+1;p.games=p.games||{};p.games[id]=(p.games[id]||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfWin(){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.wins=(p.wins||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfUnlock(id,label){const a=bfRead(BFGN_ACH_KEY,{});if(a[id])return false;a[id]={label,at:Date.now()};bfWrite(BFGN_ACH_KEY,a);const t=document.getElementById('toast');if(t){t.textContent='Achievement: '+label;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}return true}

(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),movesEl=document.getElementById('moves'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best');const pool=[['SQ','Squishy','#d88db2'],['DOG','Dog','#9b765d'],['HOOD','Hoodie','#6b86ad'],['CAKE','Cupcake','#d89b78'],['STAR','Star Toy','#d7b64f'],['SHOE','Comfy Shoes','#8e76a8'],['HEART','Heart','#c95d68'],['BONE','Dog Bone','#d9c28e'],['BOW','Bow','#c784a9'],['POP','Pop Toy','#65a89c']];let mode='medium',cards=[],open=[],moves=0,matched=0,startAt=0,elapsed=0,state='ready',lock=false;let best=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function cfg(){return mode==='easy'?{cols:4,rows:3,pairs:6}:mode==='hard'?{cols:5,rows:4,pairs:10}:{cols:4,rows:4,pairs:8}}
function bestKey(){return 'hollyMemoryBest_'+mode}
function reset(){best=Number(localStorage.getItem(bestKey())||0);bestEl.textContent=best||'--';const q=cfg(),chosen=pool.slice(0,q.pairs);cards=shuffle([...chosen,...chosen].map((p,i)=>({p,id:i,up:false,done:false})));open=[];moves=matched=0;elapsed=0;state='ready';lock=false;movesEl.textContent=0;timeEl.textContent=0}
function pick(i){if(lock)return;if(state==='ready'){state='play';startAt=performance.now();bfPlay('hollys-memory-mayhem')}if(state!=='play')return;const card=cards[i];if(!card||card.up||card.done)return;card.up=true;open.push(i);if(open.length===2){moves++;movesEl.textContent=moves;const [a,b]=open.map(k=>cards[k]);if(a.p[0]===b.p[0]){a.done=b.done=true;matched+=2;open=[];if(matched===cards.length){elapsed=Math.floor((performance.now()-startAt)/1000);state='win';if(!best||moves<best){best=moves;localStorage.setItem(bestKey(),best);bestEl.textContent=best}if(mode==='medium'&&moves<=14)bfUnlock('holly-memory-star','Holly Memory Star');bfWin()}}else{lock=true;setTimeout(()=>{a.up=b.up=false;open=[];lock=false},650)}}}
c.addEventListener('pointerdown',e=>{if(state==='win'){reset();return}const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*600/r.height,q=cfg(),cw=600/q.cols,ch=600/q.rows,col=Math.floor(x/cw),row=Math.floor(y/ch);pick(row*q.cols+col)});document.getElementById('new').addEventListener('click',reset);document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));reset()}));
function draw(){if(state==='play'){elapsed=Math.floor((performance.now()-startAt)/1000);timeEl.textContent=elapsed}g.fillStyle='#2b1b24';g.fillRect(0,0,600,600);const q=cfg(),cw=600/q.cols,ch=600/q.rows;for(let i=0;i<cards.length;i++){const x=(i%q.cols)*cw,y=Math.floor(i/q.cols)*ch,z=cards[i];g.fillStyle=z.done?'#395d50':z.up?z.p[2]:'#4a2f42';g.beginPath();g.roundRect(x+7,y+7,cw-14,ch-14,15);g.fill();g.strokeStyle=z.up||z.done?'#f1d09b':'#7e5970';g.lineWidth=3;g.stroke();g.textAlign='center';if(z.up||z.done){g.fillStyle='#fff7e7';g.font=`950 ${Math.min(25,cw*.17)}px system-ui`;g.fillText(z.p[0],x+cw/2,y+ch*.48);g.fillStyle='#f0dcb8';g.font=`700 ${Math.min(13,cw*.09)}px system-ui`;g.fillText(z.p[1],x+cw/2,y+ch*.68)}else{g.fillStyle='#d9a8c0';g.font=`950 ${Math.min(34,cw*.22)}px Georgia`;g.fillText('H',x+cw/2,y+ch*.58)}}if(state==='ready'||state==='win'){g.fillStyle='#0a0709dc';g.fillRect(0,0,600,600);g.textAlign='center';g.fillStyle='#e8b95c';g.font='800 18px system-ui';g.fillText('HOLLY',300,188);g.fillStyle='#fff7e7';g.font='950 45px system-ui';g.fillText(state==='win'?'YAY! ALL MATCHED':"HOLLY'S MEMORY MAYHEM",300,250);g.fillStyle='#e8b95c';g.font='700 20px system-ui';g.fillText(state==='win'?`${moves} moves / ${elapsed}s`:'Find the matching cozy things.',300,305);g.fillStyle='#d0c2ac';g.font='17px system-ui';g.fillText(state==='win'?'Tap to reshuffle':'Tap a card to start',300,350)}}function loop(){draw();requestAnimationFrame(loop)}reset();loop()})();
</script></body></html>
