<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Cabin Breakout · Black Family Game Night</title>
<style>
  :root{
    color-scheme:dark;
    --ink:#f6ead1;
    --muted:#c8b897;
    --gold:#e4b85d;
    --ember:#d9663d;
    --wood:#2b1b14;
    --wood2:#4b2e20;
    --panel:rgba(24,15,12,.86);
    --line:rgba(239,203,137,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:
    radial-gradient(circle at 50% 0%,rgba(209,111,55,.18),transparent 42%),
    linear-gradient(180deg,#1a110e 0%,#261712 48%,#120c0a 100%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{padding:max(12px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom));display:flex;justify-content:center}
  .wrap{width:min(100%,760px)}
  .topbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-bottom:10px}
  .back,.restart{min-height:44px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#4a3023,#2d1c16);color:var(--ink);font-weight:800;padding:9px 12px;text-decoration:none;cursor:pointer}
  .title{text-align:center;min-width:0}
  .title small{display:block;color:var(--gold);font-size:.68rem;letter-spacing:.15em;font-weight:900}
  .title strong{display:block;font-size:clamp(1.05rem,4vw,1.45rem);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .hud-card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .hud-card span{display:block;font-size:.64rem;color:var(--muted);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  .hud-card b{display:block;font-size:1.1rem;margin-top:2px}
  .stage{position:relative;width:100%;aspect-ratio:3/4;border-radius:18px;padding:8px;background:linear-gradient(145deg,#5e3c29,#2a1913 45%,#7c5232);box-shadow:0 18px 40px rgba(0,0,0,.34),inset 0 0 0 1px rgba(255,226,175,.16),inset 0 0 28px rgba(0,0,0,.45)}
  canvas{display:block;width:100%;height:100%;border-radius:12px;background:#0e1613;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:inset 0 0 25px rgba(0,0,0,.75)}
  .tips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .tip{border:1px solid var(--line);border-radius:12px;background:rgba(31,20,16,.75);padding:9px 11px;color:var(--muted);font-size:.78rem;line-height:1.35}
  .tip strong{color:var(--ink)}
  @media(max-width:480px){
    body{padding-left:8px;padding-right:8px}
    .topbar{grid-template-columns:auto 1fr auto;gap:6px}
    .back,.restart{padding:8px 9px;font-size:.78rem}
    .hud{gap:5px}.hud-card{padding:7px 5px}.hud-card b{font-size:1rem}
    .stage{border-radius:14px;padding:6px}.tips{grid-template-columns:1fr}
  }
</style>
<style data-phase-w-inline>
:root{--pw-gold:#efc56f;--pw-ink:#fff6df;--pw-panel:rgba(20,15,11,.88);--pw-line:rgba(241,203,132,.28)}
body.phase-w-arcade{overflow-x:hidden;background-attachment:fixed}
body.phase-w-arcade:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -15%,rgba(255,196,92,.12),transparent 38%),linear-gradient(180deg,rgba(255,255,255,.02),transparent 35%);z-index:-1}
.phase-w-frame{position:fixed;inset:0;pointer-events:none;z-index:120;box-shadow:inset 0 0 90px rgba(0,0,0,.42)}
.phase-w-status{position:fixed;z-index:140;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));display:flex;gap:7px;align-items:center;padding:7px 9px;border:1px solid var(--pw-line);border-radius:999px;background:rgba(12,9,7,.78);backdrop-filter:blur(10px);box-shadow:0 7px 20px #0006;font-size:10px;font-weight:900;letter-spacing:.05em;color:var(--pw-ink)}
.phase-w-status b{color:var(--pw-gold);font-size:11px}.phase-w-status button{border:0;border-radius:999px;background:#3c2a1a;color:#ffe8b0;font:inherit;padding:5px 8px}
.phase-w-avatar-stage{position:fixed;z-index:130;right:max(9px,env(safe-area-inset-right));top:max(9px,env(safe-area-inset-top));width:92px;min-height:112px;display:grid;justify-items:center;align-content:start;gap:5px;padding:8px;border:1px solid var(--pw-line);border-radius:18px;background:linear-gradient(160deg,rgba(43,28,18,.92),rgba(13,10,8,.9));box-shadow:0 12px 28px #0007;pointer-events:none;transform:perspective(520px) rotateY(-4deg)}
.phase-w-avatar-stage img{width:68px;height:68px;object-fit:cover;border-radius:50%;border:2px solid #d8aa5d;box-shadow:inset 0 0 0 2px #fff2,0 7px 16px #0008;animation:pwIdle 3.2s ease-in-out infinite}
.phase-w-avatar-stage strong{font-size:10px;line-height:1;text-align:center;color:#ffeac0}.phase-w-avatar-stage small{font-size:8px;line-height:1.2;text-align:center;color:#c8b99e}
@keyframes pwIdle{50%{transform:translateY(-2px) rotate(-1deg)}}

.phase-w-reaction.show{opacity:1;transform:translate(-50%,0) scale(1)}.phase-w-reaction b{display:block;color:#f2c56e;font-size:10px;letter-spacing:.16em}.phase-w-reaction strong{display:block;font-size:22px;margin-top:5px}.phase-w-reaction span{display:block;font-size:12px;color:#d6c5aa;margin-top:4px}
.phase-w-event-ribbon{position:fixed;z-index:125;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);max-width:min(92vw,620px);padding:7px 12px;border:1px solid var(--pw-line);border-radius:999px;background:rgba(17,12,9,.78);backdrop-filter:blur(8px);color:#eadbbf;font-size:9px;text-align:center;pointer-events:none}.phase-w-event-ribbon strong{color:#ffd37c}
.phase-w-arcade canvas{transform:perspective(1100px) rotateX(1.2deg);transform-origin:50% 30%;filter:saturate(1.08) contrast(1.03);box-shadow:0 22px 70px #000a!important}
.phase-w-arcade .wrap,.phase-w-arcade main{position:relative;z-index:2}
.phase-w-arcade .wrap:after,.phase-w-arcade main:after{content:"";position:absolute;z-index:-1;inset:12% -3% -3%;border-radius:28px;background:radial-gradient(circle at 50% 20%,rgba(240,177,78,.11),transparent 62%);filter:blur(14px);pointer-events:none}
.phase-w-particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}.phase-w-particles i{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffd078;opacity:.35;animation:pwFloat var(--d) linear infinite;left:var(--x);top:105%}@keyframes pwFloat{to{transform:translate3d(var(--drift),-115vh,0);opacity:0}}
.phase-w-quality{position:fixed;left:10px;bottom:max(8px,env(safe-area-inset-bottom));z-index:145;display:flex;gap:4px}.phase-w-quality button{border:1px solid #6c5438;border-radius:10px;background:#1c1510dd;color:#dbc9a8;font-size:9px;padding:6px 8px}.phase-w-quality button.active{background:#5b4025;color:#fff0bd;border-color:#c99a53}
@media(max-width:680px){.phase-w-avatar-stage{width:78px;min-height:94px;padding:6px}.phase-w-avatar-stage img{width:54px;height:54px}.phase-w-status{max-width:62vw;overflow:hidden;white-space:nowrap}.phase-w-reaction{top:16%}.phase-w-arcade canvas{transform:perspective(900px) rotateX(.7deg)}}
@media(max-height:620px) and (orientation:landscape){.phase-w-avatar-stage{top:6px;right:6px;width:68px;min-height:72px}.phase-w-avatar-stage img{width:42px;height:42px}.phase-w-avatar-stage small{display:none}.phase-w-event-ribbon{display:none}.phase-w-status{top:6px;left:6px}.phase-w-quality{display:none}}
@media(prefers-reduced-motion:reduce){.phase-w-avatar-stage img,.phase-w-particles i{animation:none!important}.phase-w-reaction{transition:none!important}}
.phase-w-scene{position:fixed;inset:0;z-index:0;pointer-events:none;perspective:900px;overflow:hidden}.phase-w-scene span{position:absolute;left:calc(7% + var(--i)*27%);top:calc(18% + (var(--i)%2)*48%);transform:translateZ(calc(-40px + var(--i)*12px)) rotate(calc(-7deg + var(--i)*4deg));font:1000 clamp(20px,4vw,58px) Georgia,serif;letter-spacing:.08em;color:#f0c87410;text-shadow:0 12px 28px #0009;white-space:nowrap}.phase-w-scene:after{content:"";position:absolute;inset:auto -10% -14% -10%;height:42%;background:linear-gradient(180deg,transparent,#0008),repeating-linear-gradient(90deg,#4d321b55 0 8px,#65412344 8px 20px);transform:perspective(700px) rotateX(68deg);transform-origin:50% 100%}
body[data-arcade-game="dorothys-garden-merge"] .phase-w-scene{background:radial-gradient(circle at 50% 75%,#658f4d22,transparent 42%)}body[data-arcade-game="lizzies-dramatic-lights"] .phase-w-scene{background:radial-gradient(circle at 50% 10%,#b16fd22d,transparent 32%)}body[data-arcade-game="space-shooter"] .phase-w-scene,body[data-arcade-game="neon-snake"] .phase-w-scene{background:radial-gradient(circle at 50% 40%,#4e64d326,transparent 40%)}body[data-arcade-game="gunners-goat-run"] .phase-w-scene,body[data-arcade-game="gunners-snack-attack"] .phase-w-scene{background:radial-gradient(circle at 50% 78%,#7f91552c,transparent 42%)}

</style></head>
<body>
<main class="wrap">
  <div class="topbar">
    <a class="back" href="/?game=breakout" aria-label="Back to game list">← Lodge</a>
    <div class="title"><small>ARCADE CORNER</small><strong>Cabin Breakout</strong></div>
    <button class="restart" id="restartBtn" type="button">Restart</button>
  </div>
  <section class="hud" aria-label="Game status">
    <div class="hud-card"><span>Score</span><b id="score">0</b></div>
    <div class="hud-card"><span>Lives</span><b id="lives">3</b></div>
    <div class="hud-card"><span>Bricks</span><b id="bricks">60</b></div>
  </section>
  <div class="stage">
    <canvas id="game" width="720" height="960" aria-label="Playable brick breaker game"></canvas>
  </div>
  <div class="tips">
    <div class="tip"><strong>Move:</strong> mouse, touch/drag, or ← → arrow keys.</div>
    <div class="tip"><strong>Launch:</strong> tap/click the game or press Space. Catch the glowing MULTI orb for extra balls.</div>
  </div>
</main>
<script>
(()=>{
  'use strict';
  const canvas=document.getElementById('game');
  const ctx=canvas.getContext('2d');
  const scoreEl=document.getElementById('score');
  const livesEl=document.getElementById('lives');
  const bricksEl=document.getElementById('bricks');
  const restartBtn=document.getElementById('restartBtn');
  const W=canvas.width,H=canvas.height;
  const ROWS=6,COLS=10,START_LIVES=3;
  const palette=['#d75c3c','#e58a3f','#e2b84f','#7da75c','#3f8b84','#516fa8'];
  const game={state:'ready',score:0,lives:START_LIVES,level:1,last:performance.now(),keys:new Set(),pointerX:W/2,pointerActive:false,bricks:[],balls:[],powerups:[],shake:0,flash:0};
  const paddle={x:W/2-72,y:H-84,w:144,h:22,speed:720,targetX:W/2};
  const brick={gap:8,left:34,right:34,top:118,h:38};
  brick.w=(W-brick.left-brick.right-brick.gap*(COLS-1))/COLS;

  function makeBricks(){
    const out=[];
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)out.push({
      r,c,x:brick.left+c*(brick.w+brick.gap),y:brick.top+r*(brick.h+brick.gap),w:brick.w,h:brick.h,alive:true,color:palette[r%palette.length],points:(ROWS-r)*10
    });
    return out;
  }
  function makeBall(attached=true,x=paddle.x+paddle.w/2,y=paddle.y-15,vx=0,vy=0){return{x,y,r:10,vx,vy,attached,trail:[]}}
  function resetBall(){game.balls=[makeBall(true)];game.powerups=[];game.state='ready'}
  function resetGame(){
    game.score=0;game.lives=START_LIVES;game.state='ready';game.bricks=makeBricks();game.powerups=[];game.shake=0;game.flash=0;
    paddle.w=144;paddle.x=W/2-paddle.w/2;paddle.targetX=W/2;
    resetBall();syncHud();
  }
  function syncHud(){scoreEl.textContent=game.score;livesEl.textContent=game.lives;bricksEl.textContent=game.bricks.filter(b=>b.alive).length}
  function launch(){
    if(game.state==='won'||game.state==='gameover'){resetGame();return}
    const attached=game.balls.find(b=>b.attached);if(!attached)return;
    const angle=(-Math.PI/2)+(Math.random()-.5)*.55,speed=520;
    attached.attached=false;attached.vx=Math.cos(angle)*speed;attached.vy=Math.sin(angle)*speed;game.state='playing';
  }

  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function reflect(ball,nx,ny){const dot=ball.vx*nx+ball.vy*ny;ball.vx-=2*dot*nx;ball.vy-=2*dot*ny}
  function rayExpandedAabb(px,py,dx,dy,rect,r){
    const minX=rect.x-r,maxX=rect.x+rect.w+r,minY=rect.y-r,maxY=rect.y+rect.h+r;
    let tx1=-Infinity,tx2=Infinity,ty1=-Infinity,ty2=Infinity;
    if(Math.abs(dx)<1e-9){if(px<minX||px>maxX)return null}else{tx1=(minX-px)/dx;tx2=(maxX-px)/dx;if(tx1>tx2)[tx1,tx2]=[tx2,tx1]}
    if(Math.abs(dy)<1e-9){if(py<minY||py>maxY)return null}else{ty1=(minY-py)/dy;ty2=(maxY-py)/dy;if(ty1>ty2)[ty1,ty2]=[ty2,ty1]}
    const enter=Math.max(tx1,ty1),exit=Math.min(tx2,ty2);if(enter>exit||exit<0||enter>1||enter<0)return null;
    let nx=0,ny=0;
    if(tx1>ty1)nx=dx>0?-1:1;else ny=dy>0?-1:1;
    return{t:enter,nx,ny};
  }
  function earliestCollision(ball,dt){
    const dx=ball.vx*dt,dy=ball.vy*dt;let best=null;
    const add=(t,nx,ny,type,obj=null)=>{if(t>=0&&t<=1&&(!best||t<best.t))best={t,nx,ny,type,obj}};
    if(dx<0)add((ball.r-ball.x)/dx,1,0,'wall');
    if(dx>0)add((W-ball.r-ball.x)/dx,-1,0,'wall');
    if(dy<0)add((ball.r-ball.y)/dy,0,1,'wall');
    if(dy>0)add((H+ball.r-ball.y)/dy,0,-1,'miss');
    if(ball.vy>0){const hit=rayExpandedAabb(ball.x,ball.y,dx,dy,paddle,ball.r);if(hit)add(hit.t,hit.nx,hit.ny,'paddle',paddle)}
    for(const b of game.bricks){if(!b.alive)continue;const hit=rayExpandedAabb(ball.x,ball.y,dx,dy,b,ball.r);if(hit)add(hit.t,hit.nx,hit.ny,'brick',b)}
    return best;
  }
  function maybeDropPowerup(b){
    if(Math.random()<.14&&game.powerups.length<2)game.powerups.push({x:b.x+b.w/2,y:b.y+b.h/2,vy:185,r:15,alive:true,spin:0});
  }
  function splitBalls(){
    const source=game.balls.find(b=>!b.attached);if(!source)return;
    const speed=Math.hypot(source.vx,source.vy)||520,base=Math.atan2(source.vy,source.vx);
    for(const off of[-.45,.45]){if(game.balls.length>=5)break;const a=base+off;game.balls.push(makeBall(false,source.x,source.y,Math.cos(a)*speed,Math.sin(a)*speed))}
    game.flash=1;game.shake=5;
  }
  function hitBrick(b){
    if(!b.alive)return;b.alive=false;game.score+=b.points;maybeDropPowerup(b);game.flash=.45;game.shake=Math.max(game.shake,2.8);syncHud();
    if(game.bricks.every(x=>!x.alive)){game.state='won';game.balls=[];game.powerups=[]}
  }
  function paddleBounce(ball){
    const center=paddle.x+paddle.w/2,rel=clamp((ball.x-center)/(paddle.w/2),-1,1),maxAngle=70*Math.PI/180;
    const speed=clamp(Math.hypot(ball.vx,ball.vy)*1.012,500,760),a=-Math.PI/2+rel*maxAngle;
    ball.vx=Math.cos(a)*speed;ball.vy=Math.sin(a)*speed;ball.y=paddle.y-ball.r-.7;
  }
  function advanceBall(ball,dt){
    let remain=dt,iterations=0;
    while(remain>1e-5&&iterations++<10&&game.state==='playing'){
      const hit=earliestCollision(ball,remain);
      if(!hit){ball.x+=ball.vx*remain;ball.y+=ball.vy*remain;break}
      const moveT=remain*hit.t;ball.x+=ball.vx*moveT;ball.y+=ball.vy*moveT;
      if(hit.type==='miss'){ball.dead=true;break}
      if(hit.type==='brick')hitBrick(hit.obj);
      if(hit.type==='paddle')paddleBounce(ball);else reflect(ball,hit.nx,hit.ny);
      ball.x+=hit.nx*.35;ball.y+=hit.ny*.35;
      remain*=Math.max(0,1-hit.t);
      if(hit.t<.0001)remain*=.82;
    }
    ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>7)ball.trail.shift();
  }
  function updatePowerups(dt){
    for(const p of game.powerups){if(!p.alive)continue;p.y+=p.vy*dt;p.spin+=dt*5;
      if(p.y+p.r>=paddle.y&&p.y-p.r<=paddle.y+paddle.h&&p.x>=paddle.x-p.r&&p.x<=paddle.x+paddle.w+p.r){p.alive=false;splitBalls()}
      else if(p.y-p.r>H)p.alive=false;
    }
    game.powerups=game.powerups.filter(p=>p.alive);
  }
  function update(dt){
    dt=Math.min(dt,.035);
    let move=0;if(game.keys.has('ArrowLeft')||game.keys.has('a'))move--;if(game.keys.has('ArrowRight')||game.keys.has('d'))move++;
    if(move)paddle.x+=move*paddle.speed*dt;
    else if(game.pointerActive){const desired=game.pointerX-paddle.w/2;paddle.x+=(desired-paddle.x)*Math.min(1,dt*15)}
    paddle.x=clamp(paddle.x,10,W-paddle.w-10);
    for(const b of game.balls)if(b.attached){b.x=paddle.x+paddle.w/2;b.y=paddle.y-b.r-5}
    if(game.state==='playing'){
      for(const b of game.balls)advanceBall(b,dt);
      game.balls=game.balls.filter(b=>!b.dead);
      updatePowerups(dt);
      if(!game.balls.length&&game.state==='playing'){
        game.lives--;syncHud();
        if(game.lives<=0){game.state='gameover';game.powerups=[]}else resetBall();
      }
    }
    game.shake=Math.max(0,game.shake-dt*12);game.flash=Math.max(0,game.flash-dt*2.4);
  }

  function roundRect(x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.roundRect(x,y,w,h,rr)}
  function drawBackground(){
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#13241f');g.addColorStop(.55,'#0f1a17');g.addColorStop(1,'#09110f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(219,177,104,.055)';ctx.lineWidth=1;for(let y=22;y<H;y+=34){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+12);ctx.stroke()}
    const glow=ctx.createRadialGradient(W/2,H*.12,0,W/2,H*.12,W*.65);glow.addColorStop(0,'rgba(228,131,63,.14)');glow.addColorStop(1,'rgba(228,131,63,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
  }
  function drawBricks(){
    for(const b of game.bricks){if(!b.alive)continue;
      ctx.save();ctx.shadowColor='rgba(0,0,0,.48)';ctx.shadowBlur=10;ctx.shadowOffsetY=5;
      roundRect(b.x,b.y,b.w,b.h,8);ctx.fillStyle=b.color;ctx.fill();ctx.shadowColor='transparent';
      const hi=ctx.createLinearGradient(b.x,b.y,b.x,b.y+b.h);hi.addColorStop(0,'rgba(255,255,255,.24)');hi.addColorStop(.48,'rgba(255,255,255,.02)');hi.addColorStop(1,'rgba(0,0,0,.18)');ctx.fillStyle=hi;roundRect(b.x+2,b.y+2,b.w-4,b.h-4,7);ctx.fill();
      ctx.strokeStyle='rgba(255,234,199,.22)';ctx.lineWidth=1;roundRect(b.x+.5,b.y+.5,b.w-1,b.h-1,8);ctx.stroke();ctx.restore();
    }
  }
  function drawPaddle(){
    ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=16;ctx.shadowOffsetY=7;
    const g=ctx.createLinearGradient(paddle.x,paddle.y,paddle.x,paddle.y+paddle.h);g.addColorStop(0,'#f3cf79');g.addColorStop(.45,'#c78b32');g.addColorStop(1,'#75451e');ctx.fillStyle=g;roundRect(paddle.x,paddle.y,paddle.w,paddle.h,10);ctx.fill();
    ctx.strokeStyle='rgba(255,239,183,.55)';roundRect(paddle.x+.8,paddle.y+.8,paddle.w-1.6,paddle.h-1.6,9);ctx.stroke();ctx.restore();
  }
  function drawBalls(){
    for(const ball of game.balls){
      for(let i=0;i<ball.trail.length;i++){const p=ball.trail[i],a=(i+1)/ball.trail.length*.12;ctx.fillStyle=`rgba(255,224,149,${a})`;ctx.beginPath();ctx.arc(p.x,p.y,ball.r*(.35+i/ball.trail.length*.35),0,Math.PI*2);ctx.fill()}
      ctx.save();ctx.shadowColor='rgba(255,197,93,.75)';ctx.shadowBlur=16;const g=ctx.createRadialGradient(ball.x-3,ball.y-4,1,ball.x,ball.y,ball.r);g.addColorStop(0,'#fff9dc');g.addColorStop(.35,'#f3d786');g.addColorStop(1,'#a76b28');ctx.fillStyle=g;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.restore();
    }
  }
  function drawPowerups(){
    for(const p of game.powerups){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.spin);ctx.shadowColor='#e8b15c';ctx.shadowBlur=18;ctx.fillStyle='#f0bd58';ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();ctx.shadowColor='transparent';ctx.fillStyle='#2a1c15';ctx.font='900 10px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('MULTI',0,0);ctx.restore()}
  }
  function overlay(title,subtitle,prompt){
    ctx.fillStyle='rgba(4,8,7,.72)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#e5bb62';ctx.font='900 22px system-ui';ctx.fillText('BLACK FAMILY ARCADE',W/2,H*.41-54);
    ctx.fillStyle='#fff1d2';ctx.font='900 52px system-ui';ctx.fillText(title,W/2,H*.41);
    ctx.fillStyle='#d1c1a3';ctx.font='700 21px system-ui';ctx.fillText(subtitle,W/2,H*.41+42);
    ctx.fillStyle='#f0c76f';ctx.font='800 19px system-ui';ctx.fillText(prompt,W/2,H*.41+94);
  }
  function draw(){
    ctx.save();if(game.shake){ctx.translate((Math.random()-.5)*game.shake,(Math.random()-.5)*game.shake)}
    drawBackground();drawBricks();drawPowerups();drawPaddle();drawBalls();ctx.restore();
    if(game.flash){ctx.fillStyle=`rgba(255,205,111,${game.flash*.09})`;ctx.fillRect(0,0,W,H)}
    if(game.state==='ready')overlay('READY?','Aim with the paddle. Clear all 60 bricks.','Tap / click or press Space to launch');
    if(game.state==='won')overlay('YOU WIN!',`Final score: ${game.score}`,'Tap / click or press Space to restart');
    if(game.state==='gameover')overlay('GAME OVER',`Final score: ${game.score}`,'Tap / click or press Space to restart');
  }
  function frame(now){const dt=(now-game.last)/1000;game.last=now;update(dt);draw();requestAnimationFrame(frame)}

  function pointerToCanvas(e){const r=canvas.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width*W,0,W)}
  canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture?.(e.pointerId);game.pointerActive=true;game.pointerX=pointerToCanvas(e);if(game.state==='ready'||game.state==='won'||game.state==='gameover')launch()});
  canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||game.pointerActive){game.pointerActive=true;game.pointerX=pointerToCanvas(e)}});
  canvas.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')game.pointerActive=false});
  canvas.addEventListener('pointercancel',()=>game.pointerActive=false);
  window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','Spacebar'].includes(e.key))e.preventDefault();game.keys.add(e.key);if(e.key===' '||e.code==='Space')launch()},{passive:false});
  window.addEventListener('keyup',e=>game.keys.delete(e.key));
  restartBtn.addEventListener('click',resetGame);
  resetGame();requestAnimationFrame(t=>{game.last=t;requestAnimationFrame(frame)});
})();
</script>
