<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Logan's Minefield - Black Family Game Night</title><style>
:root{color-scheme:dark;--ink:#fff6e6;--muted:#baa98f;--gold:#e8b95c;--panel:#1b1510;--wood:#2a1b12;--accent:#d4934c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#46301f,#100c09 62%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,600px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.07em;line-height:1.05}.brand small{display:block;font-size:10px;color:var(--gold);letter-spacing:.18em;margin-bottom:3px}.stats{font-size:11px;color:var(--muted);text-align:right}.stats b{color:var(--gold);font-size:18px}.foot{display:flex;justify-content:space-between;align-items:center;gap:9px;margin:7px 4px 0;font-size:11px;color:var(--muted);flex-wrap:wrap}a{color:var(--gold);text-decoration:none}.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-15px);opacity:0;background:#f4d793;color:#20130b;padding:10px 14px;border-radius:999px;font-weight:900;font-size:12px;pointer-events:none;transition:.2s;z-index:4;box-shadow:0 8px 28px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}.stage{position:relative}button{font:inherit}
canvas{display:block;width:100%;aspect-ratio:1;background:#243725;border:1px solid #6b593d;border-radius:20px;box-shadow:0 18px 58px #0009;touch-action:none}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}.row button{min-height:44px;border:1px solid #6a5038;border-radius:11px;background:#2b2119;color:#f7ecd8;font-weight:900;padding:0 13px}.row span{font-size:11px;color:var(--muted)}</style><link rel="stylesheet" href="/phase-w-platform.css?v=25"></head><body><div class="wrap"><div class="head"><div class="brand"><small>LOGAN</small>LOGAN'S MINEFIELD</div><div class="stats">SAFE <b id="safe">0</b> / FLAGS <b id="flags">0</b> / BEST <b id="best">--</b></div></div><div class="stage"><div class="toast" id="toast"></div><canvas id="game" width="600" height="600" aria-label="Logan outdoor hazard clearing puzzle"></canvas></div><div class="row"><button id="new">NEW PATH</button><span>Tap to clear. Hold or right-click to flag.</span></div><div class="foot"><span>Avoid mud, hooks, rocks and the angry goose.</span><a href="/">Back to Lodge</a></div></div><script>
const BFGN_PROGRESS_KEY='bfgn_arcade_progress_v1';
const BFGN_ACH_KEY='bfgn_arcade_achievements_v1';
function bfRead(k,fallback){try{return JSON.parse(localStorage.getItem(k)||'')||fallback}catch{return fallback}}
function bfWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function bfPlay(id){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.plays=(p.plays||0)+1;p.games=p.games||{};p.games[id]=(p.games[id]||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfWin(){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.wins=(p.wins||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfUnlock(id,label){const a=bfRead(BFGN_ACH_KEY,{});if(a[id])return false;a[id]={label,at:Date.now()};bfWrite(BFGN_ACH_KEY,a);const t=document.getElementById('toast');if(t){t.textContent='Achievement: '+label;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}return true}

(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),safeEl=document.getElementById('safe'),flagsEl=document.getElementById('flags'),bestEl=document.getElementById('best');const N=10,M=14,S=60;let board=[],state='ready',safe=0,flags=0,start=0,elapsed=0,pressTimer=0,longFired=false,msg='Logan knew this was a bad idea.';let best=Number(localStorage.getItem('loganMineBest')||0);bestEl.textContent=best?best+'s':'--';
function neighbors(i){const x=i%N,y=Math.floor(i/N),a=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy){const nx=x+dx,ny=y+dy;if(nx>=0&&ny>=0&&nx<N&&ny<N)a.push(ny*N+nx)}return a}
function reset(){board=Array.from({length:N*N},()=>({mine:false,open:false,flag:false,n:0,kind:0}));const ids=[...Array(N*N).keys()];for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}for(const i of ids.slice(0,M)){board[i].mine=true;board[i].kind=Math.floor(Math.random()*4)}for(let i=0;i<N*N;i++)board[i].n=neighbors(i).filter(j=>board[j].mine).length;state='ready';safe=0;flags=0;elapsed=0;safeEl.textContent=0;flagsEl.textContent=0}
function open(i){if(state==='over'||state==='win')return;if(state==='ready'){state='play';start=performance.now();bfPlay('logans-minefield')}const z=board[i];if(!z||z.open||z.flag)return;if(z.mine){z.open=true;state='over';msg=['Logan knew this was a bad idea.','Should have gone fishing.','John is definitely yelling now.'][Math.floor(Math.random()*3)];return}z.open=true;safe++;safeEl.textContent=safe;if(z.n===0)for(const j of neighbors(i))if(!board[j].open&&!board[j].flag)open(j);if(safe===N*N-M){state='win';elapsed=Math.floor((performance.now()-start)/1000);if(!best||elapsed<best){best=elapsed;localStorage.setItem('loganMineBest',best);bestEl.textContent=best+'s'}bfUnlock('logan-safe-path','Logan Found a Safe Path');bfWin()}}
function flag(i){if(state==='over'||state==='win')return;if(state==='ready'){state='play';start=performance.now();bfPlay('logans-minefield')}const z=board[i];if(!z||z.open)return;z.flag=!z.flag;flags+=z.flag?1:-1;flagsEl.textContent=flags}
function hitIndex(e){const r=c.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*N/r.width),y=Math.floor((e.clientY-r.top)*N/r.height);return y*N+x}
c.addEventListener('contextmenu',e=>{e.preventDefault();flag(hitIndex(e))});c.addEventListener('pointerdown',e=>{longFired=false;const i=hitIndex(e);pressTimer=setTimeout(()=>{longFired=true;flag(i)},480)});c.addEventListener('pointerup',e=>{clearTimeout(pressTimer);if(!longFired)open(hitIndex(e))});c.addEventListener('pointercancel',()=>clearTimeout(pressTimer));document.getElementById('new').addEventListener('click',reset);
function hazard(z,x,y){const labels=['MUD','HOOK','ROCK','GOOSE'];g.fillStyle=['#684934','#b89b4d','#77736a','#d9d5c8'][z.kind];g.beginPath();g.arc(x,y,19,0,Math.PI*2);g.fill();g.fillStyle='#1c1611';g.font='800 8px system-ui';g.textAlign='center';g.fillText(labels[z.kind],x,y+3)}
function draw(){if(state==='play')elapsed=Math.floor((performance.now()-start)/1000);g.fillStyle='#273c28';g.fillRect(0,0,600,600);for(let i=0;i<N*N;i++){const x=(i%N)*S,y=Math.floor(i/N)*S,z=board[i];g.fillStyle=z.open?'#bdad8a':'#4f6540';g.fillRect(x+2,y+2,S-4,S-4);g.strokeStyle='#293923';g.strokeRect(x+2,y+2,S-4,S-4);if(z.flag&&!z.open){g.fillStyle='#d7b45b';g.beginPath();g.moveTo(x+20,y+44);g.lineTo(x+20,y+14);g.lineTo(x+44,y+24);g.lineTo(x+20,y+31);g.fill()}if(z.open&&z.mine)hazard(z,x+30,y+30);else if(z.open&&z.n){g.fillStyle=['#5b6f9e','#588359','#ac7145','#a44b4b','#7e5d91','#9c774a','#555','#222'][z.n-1];g.font='950 24px system-ui';g.textAlign='center';g.fillText(z.n,x+30,y+39)}}g.fillStyle='#ffffffbb';g.font='700 12px system-ui';g.textAlign='left';g.fillText('TIME '+elapsed+'s',10,18);if(state==='ready'||state==='over'||state==='win'){g.fillStyle='#0b0a08df';g.fillRect(0,0,600,600);g.textAlign='center';g.fillStyle='#e8b95c';g.font='800 18px system-ui';g.fillText('LOGAN',300,190);g.fillStyle='#fff6e6';g.font='950 45px system-ui';g.fillText(state==='win'?'LOGAN MADE IT':state==='over'?"LOGAN'S DONE":"LOGAN'S MINEFIELD",300,250);g.fillStyle='#e8b95c';g.font='700 20px system-ui';g.fillText(state==='win'?`Safe in ${elapsed}s`:state==='over'?msg:'Clear a safe path without stepping in trouble.',300,305);g.fillStyle='#d0c1aa';g.font='17px system-ui';g.fillText(state==='ready'?'Tap a square to start':'Tap NEW PATH to play again',300,350)}}function loop(){draw();requestAnimationFrame(loop)}reset();loop()})();
</script><script type="module" src="/phase-w-platform.mjs?v=25"></script></body></html>
