<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Nana's Goat Whack - Black Family Game Night</title><style>
:root{color-scheme:dark;--ink:#fff7e7;--muted:#bcae98;--gold:#e8b95c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#314425,#100d09 62%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,560px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.09em}.stats{font-size:12px;color:var(--muted)}.stats b{color:var(--gold);font-size:18px}canvas{display:block;width:100%;aspect-ratio:1;background:#2c3b22;border:1px solid #6d5b37;border-radius:20px;box-shadow:0 18px 58px #0009;touch-action:manipulation}.foot{display:flex;justify-content:space-between;gap:10px;margin:7px 4px 0;font-size:11px;color:var(--muted)}a{color:var(--gold);text-decoration:none}.brand small{display:block;font-size:10px;color:#e8b95c;letter-spacing:.18em;margin-bottom:3px}</style><link rel="stylesheet" href="/phase-w-platform.css?v=25"></head><body><div class="wrap"><div class="head"><div class="brand"><small>NANA</small>NANA'S GOAT WHACK</div><div class="stats">SCORE <b id="score">0</b> · COMBO <b id="combo">0</b> · TIME <b id="time">30</b></div></div><canvas id="game" width="600" height="600" aria-label="Nana goat pen reaction game"></canvas><div class="foot"><span>Tap goats, pigs and chickens. Avoid the red toolbox. 30 seconds.</span><a href="/">Back to Lodge</a></div></div><script>
(()=>{const BFGN_PROGRESS_KEY='bfgn_arcade_progress_v1',BFGN_ACH_KEY='bfgn_arcade_achievements_v1';function bfRead(k,f){try{return JSON.parse(localStorage.getItem(k)||'')||f}catch{return f}}function bfWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}function bfPlay(id){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.plays=(p.plays||0)+1;p.games=p.games||{};p.games[id]=(p.games[id]||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}function bfUnlock(id,label){const a=bfRead(BFGN_ACH_KEY,{});if(a[id])return;a[id]={label,at:Date.now()};bfWrite(BFGN_ACH_KEY,a);}
const c=document.getElementById('game'),g=c.getContext('2d'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),timeEl=document.getElementById('time');let nanaLine='That is a sin.',state='ready',score=0,combo=0,best=Number(localStorage.getItem('nanaGoatWhackBest')||0),time=30,last=performance.now(),spawnClock=0,targets=[];const spots=Array.from({length:9},(_,i)=>({x:100+(i%3)*200,y:110+Math.floor(i/3)*190}));function start(){bfPlay('nanas-goat-whack');nanaLine='Keep those animals under control.';state='play';score=0;combo=0;time=30;targets=[];spawnClock=0;sync()}function sync(){scoreEl.textContent=score;comboEl.textContent=combo;timeEl.textContent=Math.ceil(time)}function spawn(){const used=new Set(targets.map(t=>t.i)),avail=spots.map((_,i)=>i).filter(i=>!used.has(i));if(!avail.length)return;const i=avail[Math.floor(Math.random()*avail.length)],r=Math.random(),type=r<.12?'tool':r<.32?'pig':r<.48?'chicken':'goat';targets.push({i,type,age:0,life:.65+Math.random()*.55,hit:false})}function tap(e){if(state!=='play'){start();return}const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*600/r.height;let hit=false;for(const t of targets){const p=spots[t.i];if(!t.hit&&Math.hypot(x-p.x,y-p.y)<72){t.hit=true;hit=true;if(t.type==='tool'){score=Math.max(0,score-5);combo=0;nanaLine='Absolutely not.'}else{combo++;score+=(t.type==='pig'?2:t.type==='chicken'?2:1)+Math.floor(combo/5);nanaLine=['That is a sin.','Get out of there!','Papa!','Absolutely not.'][Math.floor(Math.random()*4)];best=Math.max(best,score);localStorage.setItem('nanaGoatWhackBest',best);if(score>=25)bfUnlock('thats-a-sin','That is a Sin')}sync();break}}if(!hit){combo=0;sync()}}c.addEventListener('pointerdown',tap);function update(dt){if(state!=='play')return;time-=dt;if(time<=0){time=0;state='over';sync();return}spawnClock-=dt;const rate=Math.max(.22,.62-(30-time)*.012);if(spawnClock<=0){spawnClock=rate;spawn()}for(const t of targets)t.age+=dt;for(const t of targets)if(!t.hit&&t.age>t.life&&t.type!=='tool')combo=0;targets=targets.filter(t=>!t.hit&&t.age<t.life+.08);sync()}function drawTarget(t){const p=spots[t.i],rise=Math.min(1,t.age/.12)*Math.min(1,(t.life-t.age)/.12),y=p.y+65*(1-Math.max(0,rise));g.save();g.translate(p.x,y);if(t.type==='tool'){g.fillStyle='#b44435';g.fillRect(-45,-28,90,55);g.strokeStyle='#f1c69b';g.lineWidth=4;g.strokeRect(-45,-28,90,55);g.fillStyle='#f1c69b';g.fillRect(-16,-42,32,14);g.restore();return}g.fillStyle=t.type==='pig'?'#dc9695':t.type==='chicken'?'#e5c65b':'#efe9da';g.strokeStyle='#5a493c';g.lineWidth=4;g.beginPath();g.ellipse(0,4,50,42,0,0,Math.PI*2);g.fill();g.stroke();if(t.type==='goat'){g.beginPath();g.moveTo(-22,-24);g.lineTo(-35,-48);g.lineTo(-12,-31);g.moveTo(22,-24);g.lineTo(35,-48);g.lineTo(12,-31);g.stroke()}else if(t.type==='pig'){g.fillStyle='#d27f82';g.beginPath();g.arc(0,15,17,0,Math.PI*2);g.fill()}else{g.fillStyle='#c34835';g.beginPath();g.moveTo(0,-10);g.lineTo(8,-24);g.lineTo(14,-8);g.fill()}g.fillStyle='#211811';g.beginPath();g.arc(-15,-8,4,0,Math.PI*2);g.arc(15,-8,4,0,Math.PI*2);g.fill();g.restore()}function draw(){g.fillStyle='#354a29';g.fillRect(0,0,600,600);for(const p of spots){g.fillStyle='#17120d';g.beginPath();g.ellipse(p.x,p.y+42,75,34,0,0,Math.PI*2);g.fill();g.strokeStyle='#6f5133';g.lineWidth=10;g.stroke()}for(const t of targets)drawTarget(t);g.fillStyle='#ffffffbb';g.font='700 14px system-ui';g.textAlign='left';g.fillText(`BEST ${best}`,18,28);g.textAlign='center';g.fillStyle='#f5e2b7';g.font='800 16px system-ui';g.fillText(nanaLine,300,34);if(state!=='play'){g.fillStyle='#0a0906dc';g.fillRect(0,0,600,600);g.textAlign='center';g.fillStyle='#fff7e7';g.font='950 50px system-ui';g.fillText(state==='over'?"THAT'S A SIN":"NANA'S GOAT WHACK",300,250);g.fillStyle='#e8b95c';g.font='700 22px system-ui';g.fillText(state==='over'?`Score ${score} · Best ${best}`:'Nana is keeping this farm under control',300,300);g.fillStyle='#d2c4ae';g.font='17px system-ui';g.fillText(state==='over'?'Tap to go again':'Tap to start',300,350)}}function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}sync();requestAnimationFrame(loop)})();
</script><script type="module" src="/phase-w-platform.mjs?v=25"></script></body></html>
