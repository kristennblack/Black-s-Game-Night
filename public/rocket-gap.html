<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Campfire Rocket</title><style>
:root{color-scheme:dark;--ink:#fff5df;--gold:#efbd63;--ember:#ff7a4a;--sky:#0b1730}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(#0d1830,#15100d);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,560px)}.head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:0 4px 8px}.head b{letter-spacing:.08em}.score{font-size:14px;color:#d6c5ad}.score strong{color:var(--gold);font-size:20px}canvas{display:block;width:100%;aspect-ratio:9/14;max-height:82vh;background:#09162d;border:1px solid #55432f;border-radius:20px;box-shadow:0 18px 55px #0008;touch-action:manipulation}.foot{display:flex;justify-content:space-between;font-size:11px;color:#b9aa98;margin:7px 5px}.foot a{color:var(--gold);text-decoration:none}</style></head><body><div class="wrap"><div class="head"><b>CAMPFIRE ROCKET</b><div class="score">SCORE <strong id="score">0</strong> · BEST <strong id="best">0</strong></div></div><canvas id="game" width="540" height="840" aria-label="One-button rocket gap game"></canvas><div class="foot"><span>Tap / click / Space to boost</span><a href="/">Back to Lodge</a></div></div><script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),S=document.getElementById('score'),B=document.getElementById('best'),W=c.width,H=c.height,FIX=1/120;let last=performance.now(),acc=0,state='ready',score=0,best=Number(localStorage.getItem('bfg_rocket_best')||0),scroll=0;const rocket={x:135,y:H*.42,vy:0,r:17,rot:0},obs=[],sparks=[];let spawn=0;B.textContent=best;const GRAV=1220,IMP=-405,SPEED=180;
function reset(){score=0;scroll=0;rocket.y=H*.42;rocket.vy=0;obs.length=sparks.length=0;spawn=.55;state='play';S.textContent=0}
function flap(){if(state!=='play'){reset();return}rocket.vy=IMP;for(let i=0;i<7;i++)sparks.push({x:rocket.x-13,y:rocket.y+8,vx:-70-Math.random()*90,vy:(Math.random()-.5)*80,life:.25+Math.random()*.2})}
function gapSize(){return Math.max(145,188-score*1.6)}
function addObs(){const gap=gapSize(),margin=95,cy=margin+gap/2+Math.random()*(H-150-margin*2-gap);obs.push({x:W+45,w:72,cy,gap,passed:false})}
function hitRectCircle(rx,ry,rw,rh,cx,cy,cr){const qx=Math.max(rx,Math.min(cx,rx+rw)),qy=Math.max(ry,Math.min(cy,ry+rh)),dx=cx-qx,dy=cy-qy;return dx*dx+dy*dy<cr*cr}
function die(){state='over';if(score>best){best=score;localStorage.setItem('bfg_rocket_best',String(best));B.textContent=best}}
function step(dt){scroll+=SPEED*dt;rocket.vy+=GRAV*dt;rocket.y+=rocket.vy*dt;rocket.rot=Math.max(-.55,Math.min(1.05,rocket.vy/520));spawn-=dt;if(spawn<=0){addObs();spawn=1.52}for(let i=obs.length-1;i>=0;i--){const o=obs[i];o.x-=SPEED*dt;if(!o.passed&&o.x+o.w<rocket.x){o.passed=true;score++;S.textContent=score}if(hitRectCircle(o.x,0,o.w,o.cy-o.gap/2,rocket.x,rocket.y,rocket.r)||hitRectCircle(o.x,o.cy+o.gap/2,o.w,H-(o.cy+o.gap/2)-50,rocket.x,rocket.y,rocket.r))die();if(o.x<-100)obs.splice(i,1)}if(rocket.y-rocket.r<0||rocket.y+rocket.r>H-50)die();for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.life<=0)sparks.splice(i,1)}}
function draw(){const grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#0b1730');grd.addColorStop(.68,'#17243a');grd.addColorStop(1,'#29160f');g.fillStyle=grd;g.fillRect(0,0,W,H);for(let i=0;i<55;i++){const x=(i*97-scroll*.18)%W,y=(i*53)%620;g.globalAlpha=.25+(i%5)*.1;g.fillStyle='#fff4d9';g.fillRect(x<0?x+W:x,y,1+(i%3===0),1+(i%3===0))}g.globalAlpha=1;g.fillStyle='#26170f';g.fillRect(0,H-50,W,50);g.fillStyle='#4d3020';for(let i=0;i<W;i+=38)g.fillRect(i,H-50+(i%76?12:3),28,8);for(const o of obs){g.fillStyle='#4b3725';g.strokeStyle='#e3aa52';g.lineWidth=3;const top=o.cy-o.gap/2,bottom=o.cy+o.gap/2;g.fillRect(o.x,0,o.w,top);g.strokeRect(o.x,0,o.w,top);g.fillRect(o.x,bottom,o.w,H-50-bottom);g.strokeRect(o.x,bottom,o.w,H-50-bottom);g.fillStyle='#705036';g.fillRect(o.x-7,top-16,o.w+14,16);g.fillRect(o.x-7,bottom,o.w+14,16)}for(const s of sparks){g.globalAlpha=Math.max(0,s.life/.4);g.fillStyle=Math.random()>.5?'#ffcf63':'#ff714a';g.fillRect(s.x,s.y,5,3)}g.globalAlpha=1;g.save();g.translate(rocket.x,rocket.y);g.rotate(rocket.rot);g.fillStyle='#f1eee4';g.strokeStyle='#e3aa52';g.lineWidth=3;g.beginPath();g.moveTo(22,0);g.lineTo(-12,-14);g.lineTo(-7,0);g.lineTo(-12,14);g.closePath();g.fill();g.stroke();g.fillStyle='#62d4ff';g.beginPath();g.arc(4,0,6,0,Math.PI*2);g.fill();g.fillStyle='#ff714a';g.beginPath();g.moveTo(-9,-7);g.lineTo(-27,0);g.lineTo(-9,7);g.closePath();g.fill();g.restore();if(state!=='play'){g.fillStyle='#07101fd9';g.fillRect(0,0,W,H);g.textAlign='center';g.fillStyle='#fff5df';g.font='900 42px system-ui';g.fillText(state==='over'?'RUN OVER':'CAMPFIRE ROCKET',W/2,H*.38);g.fillStyle='#efbd63';g.font='700 22px system-ui';g.fillText(state==='over'?`Score ${score} · Best ${best}`:'Thread the timber gaps',W/2,H*.45);g.fillStyle='#d7c9b5';g.font='18px system-ui';g.fillText(state==='over'?'Tap to try again':'Tap / click / Space to boost',W/2,H*.52)}}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;acc+=dt;while(acc>=FIX){if(state==='play')step(FIX);acc-=FIX}draw();requestAnimationFrame(frame)}c.addEventListener('pointerdown',e=>{e.preventDefault();flap()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap()}});requestAnimationFrame(frame)})();
</script></body></html>
