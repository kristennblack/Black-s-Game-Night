<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W42 Portrait Anchor QA</title>
<style>
body{margin:0;background:#0d0b09;color:#f5e4be;font-family:system-ui,sans-serif}.wrap{padding:14px}.top{position:sticky;top:0;z-index:20;background:#0d0b09ee;border-bottom:1px solid #745126;padding:8px 0 12px}.top h1{margin:0;font-size:clamp(22px,4vw,34px)}.top p{margin:5px 0;color:#b8c8b4}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}.card{border:1px solid #70502b;background:#17110d;border-radius:10px;overflow:hidden}.stage{position:relative;aspect-ratio:1;overflow:hidden;background:#211a14}.base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cos{position:absolute;left:var(--cx);top:var(--cy);width:var(--cw);height:auto;max-width:none;transform:translate(-50%,-50%) rotate(var(--cr)) skewX(var(--cskew)) scale(var(--csx),1);transform-origin:50% 50%;filter:drop-shadow(0 2px 4px #000c)}.pt{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid #111;box-shadow:0 0 0 1px #fff5}.pt.pupil{background:#c75ce3}.pt.bridge{background:#67bbff}.pt.temple{background:#5bf08f}.meta{padding:8px;font-size:12px;color:#bdd0b9}.meta b{display:block;color:#f3d9a4;font-size:14px}.warn{color:#f1aa69;font-weight:800}
</style></head><body><div class=wrap><div class=top><h1>W42A.3 Portrait Anchor QA Lab</h1><p>Actual shop/card portraits + actual GLB-derived 2D accessories. Purple=pupils, blue=bridge, green=temples. QA only.</p></div><div id=grid class=grid></div></div>
<script type=module>
import {COSMETIC_BY_ID} from './avatar-cosmetics.mjs';
import {portraitGlassesFit,portraitAccessoryAsset,portraitAnchorDebugPoints,portraitAnchorProfile} from './portrait-accessory-anchors.mjs';
const avatars=[['john','John','/avatars/styles/john-look-01.jpg'],['kristen','Kristen','/avatars/styles/kristen-cute.jpg'],['holly','Holly','/avatars/styles/holly-cute.jpg'],['vanessa','Vanessa','/avatars/styles/vanessa-cute.jpg'],['elizabeth','Elizabeth','/avatars/styles/elizabeth-cute.jpg'],['logan','Logan','/avatars/styles/logan-cute.jpg'],['james','James','/avatars/styles/james-cute.jpg'],['dorothy','Dorothy','/avatars/styles/dorothy-cute.jpg'],['papa','Papa','/avatars/styles/papa-cute.jpg'],['nana','Nana','/avatars/styles/nana-cute.jpg'],['kelsi','Kelsi','/avatars/styles/kelsi-cute.jpg'],['molly','Molly','/avatars/styles/molly-cute.jpg'],['gunner','Gunner','/avatars/styles/gunner-cute.jpg']];
const ids=['round-glasses','classic-glasses','heart-glasses','safety-glasses'];
const grid=document.querySelector('#grid');
const esc=s=>String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
for(const [key,name,src] of avatars){for(const id of ids){const item=COSMETIC_BY_ID[id],f=portraitGlassesFit(key,0,item),profile=portraitAnchorProfile(key,0);const points=portraitAnchorDebugPoints(key,0).filter(x=>/Pupil|bridge|Temple/.test(x.name));const marks=points.map(p=>`<i class="pt ${/Pupil/.test(p.name)?'pupil':p.name==='bridge'?'bridge':'temple'}" title="${p.name}" style="left:${p.x}%;top:${p.y}%"></i>`).join('');const conflict=profile?.baked?.glasses?'<span class=warn>Portrait already has baked eyewear; clean portrait required before approval.</span>':'';grid.insertAdjacentHTML('beforeend',`<article class=card><div class=stage><img class=base src="${src}"><img class=cos src="${portraitAccessoryAsset(item)}" style="--cx:${f.x}%;--cy:${f.y}%;--cw:${f.w}%;--cr:${f.r}deg;--csx:${f.sx};--cskew:${f.skew}deg">${marks}</div><div class=meta><b>${name} · ${esc(item.name)}</b>x ${f.x.toFixed(1)} · y ${f.y.toFixed(1)} · w ${f.w.toFixed(1)}% · r ${f.r.toFixed(1)}°<br>${conflict}</div></article>`);}}
</script></body></html>
