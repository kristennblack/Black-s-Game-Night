<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Shop Bomber</title><style>
:root{color-scheme:dark;--ink:#f8f1e3;--muted:#bbae9c;--gold:#e8b95c;--panel:#1b1510}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#3b281a,#100d0a 62%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,580px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.08em}.stats{font-size:12px;color:var(--muted)}.stats b{color:var(--gold);font-size:18px}canvas{display:block;width:100%;aspect-ratio:13/15;background:#21170f;border:1px solid #6d5137;border-radius:18px;box-shadow:0 18px 58px #0009}.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:8px}.dpad{display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px;gap:4px}.dpad button,.charge{border:1px solid #6a5035;background:#2a2018;color:#fff3da;border-radius:12px;font-weight:900;min-width:44px;min-height:44px;touch-action:manipulation}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.charge{justify-self:end;padding:0 16px;background:#9b4f31}.foot{display:flex;justify-content:space-between;gap:10px;margin:6px 4px 0;font-size:11px;color:var(--muted)}a{color:var(--gold);text-decoration:none}</style></head><body><div class="wrap"><div class="head"><div class="brand">SHOP BOMBER</div><div class="stats">SCORE <b id="score">0</b> · LIVES <b id="lives">3</b> · ROOM <b id="room">1</b></div></div><canvas id="game" width="650" height="750" aria-label="Papa's Shop maze bomber game"></canvas><div class="controls"><div class="dpad"><button class="up" data-d="0,-1">▲</button><button class="left" data-d="-1,0">◀</button><button class="down" data-d="0,1">▼</button><button class="right" data-d="1,0">▶</button></div><span></span><button class="charge" id="charge">PLACE CHARGE</button></div><div class="foot"><span>Arrows / WASD · Space = charge · clear every critter</span><a href="/">Back to Lodge</a></div></div><script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),COL=13,ROW=15,S=50,scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),roomEl=document.getElementById('room');let state='ready',score=0,lives=3,room=1,last=performance.now(),grid=[],bombs=[],blasts=[],enemies=[],enemyClock=0,inv=0;const player={x:1,y:13};const key=(x,y)=>y*COL+x;function solid(x,y){return x<0||y<0||x>=COL||y>=ROW||grid[key(x,y)]===1||grid[key(x,y)]===2||bombs.some(b=>b.x===x&&b.y===y)}function makeRoom(){grid=Array(COL*ROW).fill(0);for(let y=0;y<ROW;y++)for(let x=0;x<COL;x++){if(x===0||y===0||x===COL-1||y===ROW-1||(x%2===0&&y%2===0))grid[key(x,y)]=1;else if(Math.random()<.30)grid[key(x,y)]=2}for(const [x,y] of [[1,13],[1,12],[2,13],[11,1],[10,1],[11,2],[11,13],[10,13],[11,12],[1,1],[1,2],[2,1]])grid[key(x,y)]=0;player.x=1;player.y=13;bombs=[];blasts=[];enemies=[{x:11,y:1},{x:11,y:13},{x:1,y:1}].slice(0,Math.min(3+Math.floor((room-1)/2),3)).map((e,i)=>({...e,kind:i%2?'pig':'goat',dead:false}));inv=1}function begin(){if(state==='over'){score=0;lives=3;room=1;scoreEl.textContent=0;livesEl.textContent=3;roomEl.textContent=1}state='play';makeRoom()}function move(dx,dy){if(state!=='play'){begin();return}const nx=player.x+dx,ny=player.y+dy;if(!solid(nx,ny)){player.x=nx;player.y=ny}}function placeBomb(){if(state!=='play'){begin();return}if(bombs.length>=2||bombs.some(b=>b.x===player.x&&b.y===player.y))return;bombs.push({x:player.x,y:player.y,t:1.7})}function explode(b){const cells=[[b.x,b.y]];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])for(let r=1;r<=2;r++){const x=b.x+dx*r,y=b.y+dy*r;if(x<0||y<0||x>=COL||y>=ROW||grid[key(x,y)]===1)break;cells.push([x,y]);if(grid[key(x,y)]===2){grid[key(x,y)]=0;score+=5;scoreEl.textContent=score;break}}for(const [x,y] of cells)blasts.push({x,y,t:.33});for(const e of enemies){if(!e.dead&&cells.some(q=>q[0]===e.x&&q[1]===e.y)){e.dead=true;score+=100;scoreEl.textContent=score}}if(cells.some(q=>q[0]===player.x&&q[1]===player.y))hurt()}function hurt(){if(inv>0)return;lives--;livesEl.textContent=lives;if(lives<=0){state='over'}else{player.x=1;player.y=13;inv=1.2}}function enemyMove(){const choices=[[1,0],[-1,0],[0,1],[0,-1]];for(const e of enemies){if(e.dead)continue;const ranked=choices.map(d=>({d,s:Math.abs(player.x-(e.x+d[0]))+Math.abs(player.y-(e.y+d[1]))+Math.random()*3})).sort((a,b)=>a.s-b.s);for(const q of ranked){const nx=e.x+q.d[0],ny=e.y+q.d[1];if(!solid(nx,ny)&&!enemies.some(o=>o!==e&&!o.dead&&o.x===nx&&o.y===ny)){e.x=nx;e.y=ny;break}}if(e.x===player.x&&e.y===player.y)hurt()}}function update(dt){if(state!=='play')return;inv=Math.max(0,inv-dt);enemyClock+=dt;if(enemyClock>.42){enemyClock=0;enemyMove()}for(const b of bombs)b.t-=dt;for(const b of bombs.filter(x=>x.t<=0))explode(b);bombs=bombs.filter(x=>x.t>0);for(const b of blasts)b.t-=dt;blasts=blasts.filter(x=>x.t>0);for(const e of enemies){if(!e.dead&&blasts.some(b=>b.x===e.x&&b.y===e.y)){e.dead=true;score+=100;scoreEl.textContent=score}}if(enemies.length&&enemies.every(e=>e.dead)){room++;roomEl.textContent=room;score+=250;scoreEl.textContent=score;makeRoom()}}addEventListener('keydown',e=>{const d={ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0],ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1]}[e.key];if(d){e.preventDefault();move(...d)}if(e.code==='Space'){e.preventDefault();placeBomb()}});document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('pointerdown',()=>move(...b.dataset.d.split(',').map(Number))));document.getElementById('charge').addEventListener('pointerdown',placeBomb);c.addEventListener('pointerdown',()=>{if(state!=='play')begin()});function drawActor(x,y,kind){const px=x*S+S/2,py=y*S+S/2;g.save();g.translate(px,py);g.fillStyle=kind==='player'?'#d9b15c':kind==='pig'?'#d78686':'#eee8d9';g.beginPath();g.arc(0,0,17,0,Math.PI*2);g.fill();g.strokeStyle='#21170f';g.lineWidth=3;g.stroke();if(kind!=='pig'){g.beginPath();g.moveTo(-9,-12);g.lineTo(-15,-25);g.lineTo(-4,-16);g.moveTo(9,-12);g.lineTo(15,-25);g.lineTo(4,-16);g.stroke()}g.fillStyle='#21170f';g.beginPath();g.arc(-6,-3,2,0,Math.PI*2);g.arc(6,-3,2,0,Math.PI*2);g.fill();g.restore()}function draw(){g.fillStyle='#23180f';g.fillRect(0,0,c.width,c.height);for(let y=0;y<ROW;y++)for(let x=0;x<COL;x++){const t=grid[key(x,y)],px=x*S,py=y*S;g.strokeStyle='#1a120c';g.strokeRect(px,py,S,S);if(t===1){g.fillStyle='#4b3728';g.fillRect(px+3,py+3,S-6,S-6);g.fillStyle='#755238';g.fillRect(px+8,py+8,S-16,8)}else if(t===2){g.fillStyle='#8d5e32';g.fillRect(px+6,py+6,S-12,S-12);g.strokeStyle='#c18d51';g.strokeRect(px+6,py+6,S-12,S-12);g.beginPath();g.moveTo(px+8,py+8);g.lineTo(px+S-8,py+S-8);g.moveTo(px+S-8,py+8);g.lineTo(px+8,py+S-8);g.stroke()}}for(const b of bombs){const px=b.x*S+S/2,py=b.y*S+S/2;g.fillStyle='#222';g.beginPath();g.arc(px,py,15,0,Math.PI*2);g.fill();g.strokeStyle=b.t<.5?'#ffb34d':'#e8b95c';g.lineWidth=4;g.beginPath();g.arc(px,py,18,0,Math.PI*2);g.stroke()}for(const b of blasts){g.fillStyle='#ff9d36';g.globalAlpha=Math.min(1,b.t/.15);g.beginPath();g.arc(b.x*S+S/2,b.y*S+S/2,23,0,Math.PI*2);g.fill();g.globalAlpha=1}if(!(inv>0&&Math.floor(inv*12)%2))drawActor(player.x,player.y,'player');for(const e of enemies)if(!e.dead)drawActor(e.x,e.y,e.kind);if(state!=='play'){g.fillStyle='#0b0806db';g.fillRect(0,0,c.width,c.height);g.textAlign='center';g.fillStyle='#f8f1e3';g.font='950 48px system-ui';g.fillText(state==='over'?'SHOP CLOSED!':'SHOP BOMBER',c.width/2,c.height*.42);g.fillStyle='#e8b95c';g.font='700 21px system-ui';g.fillText(state==='over'?`Final score ${score}`:'Clear the critters with safe spark charges',c.width/2,c.height*.49);g.fillStyle='#cbbdab';g.font='17px system-ui';g.fillText(state==='over'?'Tap / Space to restart':'Tap canvas or press a direction to start',c.width/2,c.height*.55)}}function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}makeRoom();requestAnimationFrame(loop)})();
</script></body></html>
