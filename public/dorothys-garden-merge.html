<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Dorothy's Garden Merge - Black Family Game Night</title><style>
:root{color-scheme:dark;--ink:#fff7e7;--muted:#bba98f;--gold:#e8b95c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#4a301b,#120d09 60%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,560px)}.head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.09em}.stats{font-size:12px;color:var(--muted)}.stats b{font-size:19px;color:var(--gold)}canvas{display:block;width:100%;aspect-ratio:1;background:#2a1e16;border:1px solid #6b5037;border-radius:20px;box-shadow:0 18px 58px #0009;touch-action:none}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 4px 0}.row button{min-height:44px;padding:0 15px;border:1px solid #6a5036;border-radius:12px;background:#2b2119;color:#f7ecd7;font-weight:900}.row span{font-size:11px;color:var(--muted)}a{font-size:11px;color:var(--gold);text-decoration:none}.brand small{display:block;font-size:10px;color:#e8b95c;letter-spacing:.18em;margin-bottom:3px}</style><link rel="stylesheet" href="/phase-w-platform.css?v=25"></head><body><div class="wrap"><div class="head"><div class="brand"><small>DOROTHY</small>DOROTHY'S GARDEN MERGE</div><div class="stats">SCORE <b id="score">0</b> · BEST <b id="best">0</b></div></div><canvas id="game" width="600" height="600" aria-label="Dorothy garden merge puzzle"></canvas><div class="row"><button id="new">NEW GARDEN</button><span>Tap to enter · swipe or use arrow keys · merge matching garden pieces</span><a href="/">Back to Lodge</a></div></div><script>
(()=>{const BFGN_PROGRESS_KEY='bfgn_arcade_progress_v1',BFGN_ACH_KEY='bfgn_arcade_achievements_v1';function bfRead(k,f){try{return JSON.parse(localStorage.getItem(k)||'')||f}catch{return f}}function bfWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}function bfPlay(id){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.plays=(p.plays||0)+1;p.games=p.games||{};p.games[id]=(p.games[id]||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}function bfUnlock(id,label){const a=bfRead(BFGN_ACH_KEY,{});if(a[id])return;a[id]={label,at:Date.now()};bfWrite(BFGN_ACH_KEY,a);}
const c=document.getElementById('game'),g=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');const names={2:['SEED','Seed'],4:['SPRT','Sprout'],8:['FLWR','Flower'],16:['HERB','Herb Box'],32:['POT','Planter'],64:['ROW','Garden Row'],128:['TRLS','Trellis'],256:['GH','Greenhouse'],512:['GDN','Big Garden'],1024:['YARD','Backyard Oasis'],2048:['DOT','Dorothy Garden']};const palette={2:'#5b3b28',4:'#6d4930',8:'#7a5130',16:'#86623a',32:'#596a42',64:'#3f6d6b',128:'#466489',256:'#6b5581',512:'#8b594f',1024:'#ac7741',2048:'#c99a3d'};let board,score=0,best=Number(localStorage.getItem('dorothyGardenBest')||0),state='ready';bestEl.textContent=best;function empty(){const a=[];for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(!board[y][x])a.push([x,y]);return a}function addTile(){const e=empty();if(!e.length)return;const [x,y]=e[Math.floor(Math.random()*e.length)];board[y][x]=Math.random()<.9?2:4}function reset(){board=Array.from({length:4},()=>Array(4).fill(0));score=0;state='ready';addTile();addTile();sync()}function begin(){if(state==='ready'){state='play';bfPlay('dorothys-garden-merge')}}function sync(){scoreEl.textContent=score;best=Math.max(best,score);bestEl.textContent=best;localStorage.setItem('dorothyGardenBest',best)}function lineMove(line){const vals=line.filter(Boolean),out=[],merged=[];for(const v of vals){if(out.length&&out[out.length-1]===v&&!merged[out.length-1]){out[out.length-1]*=2;score+=out[out.length-1];if(out[out.length-1]>=512)bfUnlock('dorothy-green-thumb','Dorothy Green Thumb');merged[out.length-1]=true}else{out.push(v);merged.push(false)}}while(out.length<4)out.push(0);return out}function transpose(a){return a[0].map((_,i)=>a.map(r=>r[i]))}function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}function move(dir){if(state==='ready')begin();if(state==='over'){reset();begin();return}const before=board.map(r=>r.slice());let b=board.map(r=>r.slice());if(dir==='up'||dir==='down')b=transpose(b);if(dir==='right'||dir==='down')b=b.map(r=>r.slice().reverse());b=b.map(lineMove);if(dir==='right'||dir==='down')b=b.map(r=>r.slice().reverse());if(dir==='up'||dir==='down')b=transpose(b);board=b;if(!same(before,board)){addTile();sync();if(!canMove())state='over'}}function canMove(){if(empty().length)return true;for(let y=0;y<4;y++)for(let x=0;x<4;x++){const v=board[y][x];if(x<3&&board[y][x+1]===v)return true;if(y<3&&board[y+1][x]===v)return true}return false}addEventListener('keydown',e=>{const d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}});let sx=0,sy=0;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<22){if(state==='over'){reset();begin()}else if(state==='ready')begin();return}move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});document.getElementById('new').addEventListener('click',reset);function draw(){g.fillStyle='#211710';g.fillRect(0,0,600,600);const pad=20,gap=12,s=(600-pad*2-gap*3)/4;for(let y=0;y<4;y++)for(let x=0;x<4;x++){const px=pad+x*(s+gap),py=pad+y*(s+gap),v=board[y][x];g.fillStyle=v?(palette[Math.min(v,2048)]||'#b47639'):'#3a2b21';g.beginPath();g.roundRect(px,py,s,s,16);g.fill();g.strokeStyle='#f2d8a52b';g.stroke();if(v){const [icon,label]=names[Math.min(v,2048)]||['🔥','Bonfire'];g.textAlign='center';g.fillStyle='#fff7e7';g.font=`${Math.min(48,s*.35)}px system-ui`;g.fillText(icon,px+s/2,py+s*.43);g.font='900 15px system-ui';g.fillText(label,px+s/2,py+s*.68);g.fillStyle='#f2ddaf';g.font='700 13px system-ui';g.fillText(String(v),px+s/2,py+s*.84)}}if(state==='ready'||state==='over'){g.fillStyle='#0a0705d8';g.fillRect(0,0,600,600);g.textAlign='center';g.fillStyle='#fff7e7';g.font='950 48px system-ui';g.fillText(state==='over'?'SMOKE BREAK':"DOROTHY'S GARDEN MERGE",300,255);g.fillStyle='#e8b95c';g.font='700 21px system-ui';g.fillText(state==='over'?`Score ${score} / Best ${best}`:'Merge seeds into a ridiculous backyard garden.',300,305);g.fillStyle='#d1c1a9';g.font='17px system-ui';g.fillText(state==='over'?'Tap or press an arrow to start again':'Swipe or press an arrow to start',300,350)}}function loop(){draw();requestAnimationFrame(loop)}reset();loop()})();
</script><script type="module" src="/phase-w-platform.mjs?v=25"></script></body></html>
