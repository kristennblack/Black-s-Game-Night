<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Gunner's Goat Run - Black Family Game Night</title><style>
:root{color-scheme:dark;--ink:#fff6e6;--muted:#baa98f;--gold:#e8b95c;--panel:#1b1510;--wood:#2a1b12;--accent:#d4934c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#46301f,#100c09 62%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}body{display:grid;place-items:center;padding:10px}.wrap{width:min(100%,600px)}.head{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:0 4px 8px}.brand{font-weight:950;letter-spacing:.07em;line-height:1.05}.brand small{display:block;font-size:10px;color:var(--gold);letter-spacing:.18em;margin-bottom:3px}.stats{font-size:11px;color:var(--muted);text-align:right}.stats b{color:var(--gold);font-size:18px}.foot{display:flex;justify-content:space-between;align-items:center;gap:9px;margin:7px 4px 0;font-size:11px;color:var(--muted);flex-wrap:wrap}a{color:var(--gold);text-decoration:none}.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-15px);opacity:0;background:#f4d793;color:#20130b;padding:10px 14px;border-radius:999px;font-weight:900;font-size:12px;pointer-events:none;transition:.2s;z-index:4;box-shadow:0 8px 28px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}.stage{position:relative}button{font:inherit}
canvas{display:block;width:100%;aspect-ratio:3/5;background:#17371f;border:1px solid #5d5131;border-radius:20px;box-shadow:0 18px 58px #0009;touch-action:none}</style><link rel="stylesheet" href="/phase-w-platform.css?v=W45-HEADWEAR-SCALE-RECOVERY-63"></head><body><div class="wrap"><div class="head"><div class="brand"><small>GUNNER</small>GUNNER'S GOAT RUN</div><div class="stats">SAVED <b id="score">0</b> / LIVES <b id="lives">3</b> / LEVEL <b id="level">1</b></div></div><div class="stage"><div class="toast" id="toast"></div><canvas id="game" width="600" height="1000" aria-label="Gunner goat run crossing game"></canvas></div><div class="foot"><span>Arrows / WASD / swipe. Get Gunner to the goat pen.</span><a href="/">Back to Lodge</a></div></div><script>
const BFGN_PROGRESS_KEY='bfgn_arcade_progress_v1';
const BFGN_ACH_KEY='bfgn_arcade_achievements_v1';
function bfRead(k,fallback){try{return JSON.parse(localStorage.getItem(k)||'')||fallback}catch{return fallback}}
function bfWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function bfPlay(id){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.plays=(p.plays||0)+1;p.games=p.games||{};p.games[id]=(p.games[id]||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfWin(){const p=bfRead(BFGN_PROGRESS_KEY,{plays:0,games:{},wins:0});p.wins=(p.wins||0)+1;bfWrite(BFGN_PROGRESS_KEY,p)}
function bfUnlock(id,label){const a=bfRead(BFGN_ACH_KEY,{});if(a[id])return false;a[id]={label,at:Date.now()};bfWrite(BFGN_ACH_KEY,a);const t=document.getElementById('toast');if(t){t.textContent='Achievement: '+label;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}return true}

(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),W=c.width,H=c.height,scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),levelEl=document.getElementById('level');const laneH=100;let state='ready',saved=0,lives=3,level=1,last=performance.now(),inv=0,message='Help the big guy get the goats home.';const dog={x:300,y:930,r:28};let movers=[];const lanes=[{type:'goal',y:50},{type:'grass',y:150},{type:'water',y:250,dir:1,spd:78},{type:'water',y:350,dir:-1,spd:92},{type:'grass',y:450},{type:'road',y:550,dir:1,spd:120},{type:'road',y:650,dir:-1,spd:150},{type:'road',y:750,dir:1,spd:175},{type:'road',y:850,dir:-1,spd:112},{type:'start',y:950}];
function rebuild(){movers=[];for(const l of lanes){if(l.type==='road')for(let i=0;i<4;i++)movers.push({type:'vehicle',lane:l,x:i*190+Math.random()*40,y:l.y,w:90,h:48,dir:l.dir,spd:l.spd*(1+.12*(level-1)),kind:i%3});if(l.type==='water')for(let i=0;i<3;i++)movers.push({type:'log',lane:l,x:i*230+Math.random()*60,y:l.y,w:145,h:42,dir:l.dir,spd:l.spd*(1+.09*(level-1))})}}
function resetDog(){dog.x=300;dog.y=930;inv=.75}
function begin(){if(state==='over'){saved=0;lives=3;level=1;scoreEl.textContent=0;livesEl.textContent=3;levelEl.textContent=1}state='play';message='';bfPlay('gunners-goat-run');rebuild();resetDog()}
function move(dx,dy){if(state!=='play'){begin();return}dog.x=Math.max(30,Math.min(W-30,dog.x+dx*60));dog.y=Math.max(50,Math.min(950,dog.y+dy*100))}
addEventListener('keydown',e=>{const m={ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0],ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1]}[e.key];if(m){e.preventDefault();move(...m)}if(e.code==='Space'&&state!=='play')begin()});let sx=0,sy=0;c.addEventListener('pointerdown',e=>{if(state!=='play'){begin();return}sx=e.clientX;sy=e.clientY;c.setPointerCapture?.(e.pointerId)});c.addEventListener('pointerup',e=>{if(state!=='play')return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)<18&&Math.abs(dy)<18){move(0,-1);return}Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy))});
function laneAt(y){return lanes.reduce((a,b)=>Math.abs(b.y-y)<Math.abs(a.y-y)?b:a,lanes[0])}function hit(o){return Math.abs(dog.x-o.x)<o.w/2+dog.r*.7&&Math.abs(dog.y-o.y)<o.h/2+dog.r*.7}
function lose(){if(inv>0)return;lives--;livesEl.textContent=lives;message=['Gunner forgot what he was doing.','Snack break.','Wrong way, big guy.'][Math.floor(Math.random()*3)];if(lives<=0)state='over';else resetDog()}
function update(dt){if(state!=='play')return;inv=Math.max(0,inv-dt);for(const o of movers){o.x+=o.spd*o.dir*dt;if(o.dir>0&&o.x-o.w/2>W+30)o.x=-o.w/2-30;if(o.dir<0&&o.x+o.w/2<-30)o.x=W+o.w/2+30}const lane=laneAt(dog.y);if(lane.type==='road'){for(const o of movers)if(o.lane===lane&&o.type==='vehicle'&&hit(o)){lose();break}}if(lane.type==='water'){let log=null;for(const o of movers)if(o.lane===lane&&o.type==='log'&&hit(o)){log=o;break}if(log){dog.x+=log.spd*log.dir*dt;if(dog.x<15||dog.x>W-15)lose()}else lose()}if(dog.y<=70&&state==='play'){saved++;scoreEl.textContent=saved;level++;levelEl.textContent=level;if(saved>=5)bfUnlock('good-boy-gunner','Good Boy Gunner');rebuild();resetDog()}}
function drawDog(){if(inv>0&&Math.floor(inv*12)%2)return;g.save();g.translate(dog.x,dog.y);g.fillStyle='#6a4c37';g.strokeStyle='#2b2119';g.lineWidth=4;g.beginPath();g.ellipse(0,8,34,23,0,0,Math.PI*2);g.fill();g.stroke();g.beginPath();g.arc(3,-20,24,0,Math.PI*2);g.fill();g.stroke();g.beginPath();g.moveTo(-10,-37);g.lineTo(-25,-55);g.lineTo(-19,-27);g.moveTo(15,-37);g.lineTo(27,-51);g.lineTo(24,-25);g.stroke();g.fillStyle='#18130f';g.beginPath();g.arc(-5,-23,3,0,Math.PI*2);g.arc(10,-23,3,0,Math.PI*2);g.fill();g.fillStyle='#e88b8b';g.fillRect(-2,-2,12,18);g.fillStyle='#d9c5a3';g.font='900 12px system-ui';g.textAlign='center';g.fillText('GUNNER',0,42);g.restore()}
function draw(){g.fillStyle='#254f2e';g.fillRect(0,0,W,H);for(const l of lanes){const top=l.y-laneH/2;if(l.type==='road'){g.fillStyle='#292c2b';g.fillRect(0,top,W,laneH);g.strokeStyle='#d9b35f';g.setLineDash([28,28]);g.beginPath();g.moveTo(0,l.y);g.lineTo(W,l.y);g.stroke();g.setLineDash([])}else if(l.type==='water'){g.fillStyle='#20516c';g.fillRect(0,top,W,laneH);for(let x=0;x<W;x+=80){g.strokeStyle='#ffffff24';g.beginPath();g.arc(x+20,l.y+12,25,Math.PI,Math.PI*2);g.stroke()}}else{g.fillStyle=l.type==='goal'?'#49753b':l.type==='start'?'#365a2f':'#3d6935';g.fillRect(0,top,W,laneH)}}g.fillStyle='#d7c275';for(let x=80;x<W;x+=140){g.beginPath();g.arc(x,52,18,0,Math.PI*2);g.fill();g.strokeStyle='#4e4032';g.beginPath();g.moveTo(x-10,40);g.lineTo(x-18,28);g.moveTo(x+10,40);g.lineTo(x+18,28);g.stroke()}for(const o of movers){if(o.type==='vehicle'){g.fillStyle=o.kind===0?'#777f83':o.kind===1?'#7e5436':'#5c744b';g.beginPath();g.roundRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h,12);g.fill();g.fillStyle='#dce7e8';g.fillRect(o.x-22,o.y-o.h/2+7,44,11);g.fillStyle='#161616';g.beginPath();g.arc(o.x-o.w*.3,o.y+o.h/2,9,0,Math.PI*2);g.arc(o.x+o.w*.3,o.y+o.h/2,9,0,Math.PI*2);g.fill()}else{g.fillStyle='#6e4326';g.strokeStyle='#a6784f';g.lineWidth=3;g.beginPath();g.roundRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h,20);g.fill();g.stroke()}}drawDog();if(state!=='play'){g.fillStyle='#0c1009dd';g.fillRect(0,0,W,H);g.textAlign='center';g.fillStyle='#e8b95c';g.font='800 18px system-ui';g.fillText('GUNNER',W/2,H*.33);g.fillStyle='#f6f3e7';g.font='950 49px system-ui';g.fillText(state==='over'?'GUNNER GOT DISTRACTED':"GUNNER'S GOAT RUN",W/2,H*.41);g.fillStyle='#e8b95c';g.font='700 21px system-ui';g.fillText(state==='over'?`Goats saved: ${saved}`:'Help the big guy get the goats home.',W/2,H*.48);g.fillStyle='#d0c7b5';g.font='17px system-ui';g.fillText(state==='over'?message:'Tap or press a direction to start',W/2,H*.54)}}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}rebuild();requestAnimationFrame(loop)})();
</script><script type="module" src="/phase-w-platform.mjs?v=W45-HEADWEAR-SCALE-RECOVERY-63"></script></body></html>
